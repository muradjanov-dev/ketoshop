  .lang-btn {
    height: 32px;
    padding: 0 10px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--text);
    font-size: 12.5px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color .25s var(--ease), color .25s var(--ease), transform .3s var(--ease-spring);
  }
  .lang-btn:active { transform: scale(.92); }
  .lang-btn.active { background: var(--pop); color: var(--on-pop); font-weight: 800; box-shadow: var(--shadow-pop); }

  /* ── Bottom sheets (product detail, aksiya) ────────────────────────── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10000;
    align-items: flex-end;
    justify-content: center;
    background: var(--scrim);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  .modal-overlay.show { display: flex; animation: scrimIn .3s var(--ease); }
  @keyframes scrimIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    position: relative;
    width: 100%;
    max-width: 640px;
    max-height: 92vh;
    overflow-y: auto;
    border-radius: 30px 30px 0 0;
    background: var(--bg);
    box-shadow: 0 -20px 60px -20px rgba(0,0,0,.5);
    padding-bottom: var(--safe-b);
    animation: sheetUp .5s var(--ease);
    overscroll-behavior: contain;
  }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
  .modal-header {
    position: sticky;
    top: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 22px 16px 12px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
  }
  .modal-header::before {
    content: '';
    position: absolute;
    top: 8px;
    left: 50%;
    width: 40px;
    height: 5px;
    margin-left: -20px;
    border-radius: 3px;
    background: var(--hint);
    opacity: .35;
  }
  .modal-header h2 { flex: 1; min-width: 0; font-size: 16.5px; font-weight: 700; line-height: 1.25; letter-spacing: -.015em; }
  .modal-close, .modal .detail-fav-btn {
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 50%;
    background: var(--surface-hi);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    transition: transform .3s var(--ease-spring);
  }
  .modal .detail-fav-btn { font-size: 17px; }
  .modal-close:active { transform: scale(.88); }
  .modal .detail-fav-btn:active { transform: scale(1.2); }

  #detail-photo-container {
    position: relative;
    margin: 2px 14px 0;
    border-radius: 26px;
    overflow: hidden;
    background: var(--surface-hi);
  }
  #detail-photo-container:empty { display: none; }
  .modal img.detail-img, .modal video.detail-video,
  .detail-media-carousel .media-slide img, .detail-media-carousel .media-slide video {
    display: block;
    width: 100%;
    aspect-ratio: 1;
    max-height: 48vh;
    object-fit: cover;
  }
  .detail-media-carousel {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .detail-media-carousel::-webkit-scrollbar { display: none; }
  .detail-media-carousel .media-slide { flex-shrink: 0; width: 100%; scroll-snap-align: start; }
  .media-dots {
    position: absolute;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    padding: 6px 8px;
    border-radius: 999px;
    background: rgba(12,17,14,.45);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  .media-dots .dot {
    width: 6px;
    height: 6px;
    border-radius: 3px;
    background: #fff;
    opacity: .45;
    transition: width .35s var(--ease), opacity .2s;
  }
  .media-dots .dot.active { width: 18px; opacity: 1; background: var(--pop); }

  .modal .detail-body { padding: 16px 16px 10px; }
  .detail-tip {
    margin: 0 0 14px;
    padding: 12px 14px;
    border-radius: 18px;
    background: var(--pop-soft);
    border: 1px solid var(--hairline);
    font-size: 14px;
    line-height: 1.5;
  }
  .detail-tip-label {
    display: block;
    margin-bottom: 4px;
    font: 700 10.5px var(--font-display);
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--link);
  }
  .modal .detail-price { font-size: 23px; font-weight: 800; letter-spacing: -.025em; color: var(--text); }
  .modal .detail-price .keto-badge { font-family: var(--font-body); letter-spacing: 0; vertical-align: middle; }
  .modal .detail-body > div:has(> .detail-price) {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    column-gap: 6px;
  }
  .modal .detail-body > div:has(> .detail-price) .detail-price { display: contents; }
  .modal .detail-body > div:has(> .detail-price) .detail-unit { order: 2; }
  .modal .detail-body > div:has(> .detail-price) .keto-badge { order: 3; flex-basis: 100%; width: auto; max-width: max-content; }
  .modal .detail-unit { font-size: 13px; color: var(--hint); }
  .detail-saving {
    display: inline-block;
    margin-top: 8px;
    padding: 5px 11px;
    border-radius: 999px;
    background: var(--leaf-soft);
    color: var(--leaf-deep);
    font-size: 12.5px;
    font-weight: 700;
  }
  .detail-bonus {
    margin-top: 10px;
    padding: 11px 14px;
    border-radius: 16px;
    background: var(--berry-soft);
    border: 1px dashed var(--berry);
    color: var(--berry);
    font-size: 13px;
    font-weight: 700;
    line-height: 1.4;
  }
  .modal .detail-rating { margin-top: 10px; font-size: 13px; font-weight: 600; color: var(--text); }
  .modal .detail-rating:empty, .modal .detail-seller:empty { display: none; }
  .modal .detail-seller { margin-top: 4px; font-size: 12px; color: var(--hint); }
  .modal .detail-desc {
    margin-top: 14px;
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--text);
    opacity: .86;
    white-space: pre-line;
  }
  .detail-reviews { margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--hairline); }
  .reviews-heading { margin-bottom: 10px; font: 700 14px var(--font-display); letter-spacing: -.01em; }
  .reviews-empty { margin-bottom: 10px; font-size: 13px; color: var(--hint); }
  .review-item {
    margin-bottom: 8px;
    padding: 12px 14px;
    border-radius: 18px;
    background: var(--surface);
    border: 1px solid var(--hairline);
  }
  .review-item-head { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .review-name { flex: 1; font-size: 13px; font-weight: 700; }
  .review-del-btn { border: 0; background: none; font-size: 14px; padding: 2px 4px; opacity: .7; cursor: pointer; }
  .review-comment { margin-top: 6px; font-size: 13.5px; line-height: 1.5; opacity: .9; white-space: pre-line; }
  .review-date { margin-top: 6px; font-size: 11px; color: var(--hint); }
  .review-form {
    margin-top: 12px;
    padding: 14px;
    border-radius: 20px;
    background: var(--surface);
    border: 1px dashed var(--hairline);
  }
  .review-stars { margin-bottom: 10px; font-size: 26px; letter-spacing: 6px; color: var(--gold); cursor: pointer; }
  .review-form textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1.5px solid transparent;
    background: var(--surface-hi);
    color: var(--text);
    font: 500 14px/1.45 var(--font-body);
    resize: vertical;
    outline: none;
  }
  .review-form textarea:focus { border-color: var(--link); }
  .review-submit-btn {
    margin-top: 10px;
    height: 42px;
    padding: 0 18px;
    border: 0;
    border-radius: 999px;
    background: var(--btn);
    color: var(--btn-text);
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .review-submit-btn:disabled { opacity: .55; cursor: not-allowed; }

  /* Sticky buy bar: stepper and the main button side by side. */
  .modal .detail-footer {
    position: sticky;
    bottom: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px calc(14px + var(--safe-b));
    background: var(--glass);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
    border-top: 1px solid var(--hairline);
  }
  .qty-controls {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 4px;
    border-radius: 999px;
    background: var(--surface-hi);
  }
  .qty-btn {
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 50%;
    background: var(--surface);
    color: var(--text);
    font-size: 20px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform .3s var(--ease-spring);
  }
  .qty-btn:active { transform: scale(.86); }
  .qty-value { min-width: 34px; text-align: center; font-size: 16px; font-weight: 800; }
  .add-to-cart-btn {
    flex: 1;
    min-width: 0;
    height: 52px;
    padding: 0 16px;
    border: 0;
    border-radius: 999px;
    background: var(--btn);
    color: var(--btn-text);
    font-size: 15.5px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--shadow-pop);
    transition: transform .3s var(--ease-spring);
  }
  .add-to-cart-btn:active { transform: scale(.96); }
  .add-to-cart-btn:disabled { box-shadow: none; }

  /* Aksiya sheet content */
  .promo-sheet-img { width: 100%; margin-bottom: 12px; border-radius: 20px; }
  .promo-sheet-terms { margin-top: 10px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
  #promo-sheet-rules-wrap { margin-top: 18px; }
  .promo-sheet-rules { margin: 10px 0 0; padding: 0; list-style: none; }
  .promo-sheet-rules li {
    margin-bottom: 8px;
    padding: 11px 14px;
    border-radius: 16px;
    background: var(--berry-soft);
    border: 1px dashed var(--berry);
    font-size: 13.5px;
    font-weight: 600;
  }

  /* ── Orders ────────────────────────────────────────────────────────── */
  .order-card {
    position: relative;
    overflow: hidden;
    margin: 0 14px 12px;
    padding: 14px 16px 14px 20px;
    border-radius: 22px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    box-shadow: var(--shadow-1);
  }
  /* Status stripe down the left edge (progressive: needs :has()). */
  .order-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 14px;
    bottom: 14px;
    width: 4px;
    border-radius: 0 4px 4px 0;
    background: var(--hint);
  }
  .order-card:has(.order-status.pending)::before   { background: #F2A93B; }
  .order-card:has(.order-status.confirmed)::before { background: #4C8DF0; }
  .order-card:has(.order-status.ready)::before     { background: #2FB6A8; }
  .order-card:has(.order-status.shipped)::before   { background: #9B6BF2; }
  .order-card:has(.order-status.delivered)::before { background: var(--leaf); }
  .order-card:has(.order-status.cancelled)::before { background: var(--berry); }
  .order-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }
  .order-id { font-size: 16px; font-weight: 800; letter-spacing: -.02em; }
  .order-total { font-size: 15px; font-weight: 800; white-space: nowrap; }
  .order-status {
    display: inline-block;
    margin-left: 8px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    vertical-align: 2px;
    background: var(--surface-hi);
    color: var(--hint);
  }
  .order-status.pending   { background: rgba(242,169,59,.16); color: #D98A12; }
  .order-status.confirmed { background: rgba(76,141,240,.16); color: #3B7BE0; }
  .order-status.ready     { background: rgba(47,182,168,.16); color: #1F9A8D; }
  .order-status.shipped   { background: rgba(155,107,242,.16); color: #8256E0; }
  .order-status.delivered { background: var(--leaf-soft);    color: var(--leaf-deep); }
  .order-status.cancelled { background: var(--berry-soft);   color: var(--berry); }
  .order-meta { margin: 2px 0; font-size: 12px; line-height: 1.5; color: var(--hint); }
  .order-items { margin: 10px 0 4px; font-size: 13px; line-height: 1.6; }
  .order-timeline {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--hairline);
  }
  .order-timeline span {
    padding: 4px 9px;
    border-radius: 999px;
    background: var(--surface-hi);
    font-size: 11px;
    color: var(--hint);
    white-space: nowrap;
  }
  .order-cancel-btn {
    width: 100%;
    height: 44px;
    margin-top: 12px;
    border: 1px solid var(--berry);
    border-radius: 999px;
    background: transparent;
    color: var(--berry);
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .3s var(--ease-spring), background-color .2s;
  }
  .order-cancel-btn:active { transform: scale(.97); background: var(--berry-soft); }
  .order-cancel-btn:disabled { opacity: .5; cursor: default; }

  /* ── Shared states ─────────────────────────────────────────────────── */
  .loading {
    padding: 44px 20px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    background: linear-gradient(90deg, var(--hint) 20%, var(--text) 40%, var(--hint) 60%);
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: textShimmer 1.8s linear infinite;
  }
  @keyframes textShimmer { to { background-position: -250% 0; } }
  /* Empty states: the emoji floats in a slowly morphing blob. */
  .empty-state { padding: 56px 24px; text-align: center; color: var(--hint); font-size: 14.5px; line-height: 1.5; }
  .empty-state .emoji {
    width: 116px;
    height: 116px;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 46px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    box-shadow: var(--shadow-1);
    border-radius: 42% 58% 55% 45% / 48% 42% 58% 52%;
    animation: blobMorph 9s ease-in-out infinite;
  }
  @keyframes blobMorph {
    0%, 100% { border-radius: 42% 58% 55% 45% / 48% 42% 58% 52%; transform: translateY(0); }
    50%      { border-radius: 58% 42% 45% 55% / 42% 58% 42% 58%; transform: translateY(-6px); }
  }
  #page-order-success .checkout-submit-btn { margin-left: auto; margin-right: auto; }

  .scroll-loader { padding: 16px; text-align: center; font-size: 13px; color: var(--hint); }
  .scroll-loader .spinner {
    display: inline-block;
    width: 22px;
    height: 22px;
    border: 2.5px solid var(--surface-hi);
    border-top-color: var(--link);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .skeleton { position: relative; overflow: hidden; border-radius: 16px; background: var(--surface-hi); }

  /* The toast is created inline by showToast(); only its shape and
     position are restyled here so it clears the floating dock. */
  #app-toast {
    bottom: calc(var(--dock-h) + var(--dock-gap) * 2 + var(--safe-b) + 6px) !important;
    border-radius: 999px !important;
    padding: 11px 20px !important;
    font-weight: 600;
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    box-shadow: 0 12px 30px -12px rgba(0,0,0,.6);
  }

  .btn-checkout, .checkout-submit-btn, .add-to-cart-btn, .review-submit-btn { background: var(--btn-grad); color: var(--btn-text); }


  /* ── Blob motif ────────────────────────────────────────────────────────
     Uneven, hand-made corners on the things that carry the brand; plain
     pills stay on the controls people tap, so they still read as buttons.
     A few shapes slowly "breathe" (blobMorph, defined with the empty
     states); prefers-reduced-motion stops them. */
  .carousel-card, .product-card { border-radius: var(--soft-a); }
  .carousel-card:nth-child(even), .product-card:nth-child(even) { border-radius: var(--soft-b); }
  .card-img-wrap { border-radius: 22px 30px 20px 32px / 28px 22px 30px 24px; }
  .carousel-card:nth-child(even) .card-img-wrap, .product-card:nth-child(even) .card-img-wrap { border-radius: 30px 22px 32px 20px / 22px 30px 24px 30px; }
  .card-img-wrap::after { border-radius: var(--blob-a); }
  .card-img-wrap .discount-corner { border-radius: var(--blob-c); padding: 6px 10px; }
  .section-header::before { border-radius: var(--blob-b); padding: 5px 9px; }
  .cart-page-header::after, .fav-header::after, .orders-header::after,
  .checkout-header::after, .games-header::after { width: 10px; height: 9px; border-radius: var(--blob-a); }
  .podium-img, .podium-nophoto { border-radius: var(--blob-a); }
  .podium-item.rank-1 .podium-img, .podium-item.rank-1 .podium-nophoto { border-radius: var(--blob-b); }
  .customer-podium .podium-nophoto { border-radius: var(--blob-c); }
  .cart-item { border-radius: var(--soft-a); }
  .cart-item > img, .cart-item > .no-photo-sm { border-radius: var(--blob-d); }
  .perk-strip span, .detail-perks span { border-radius: 18px 24px 16px 26px / 22px 16px 24px 18px; }
  .promo-banner .pb-icon { border-radius: var(--blob-a); animation: blobMorph 9s ease-in-out infinite, giftBreathe 4s var(--ease) infinite; }
  #detail-photo-container { border-radius: 30px 40px 26px 44px / 38px 28px 42px 30px; }
  .order-card { border-radius: var(--soft-b); }
  .cheque-total { border-radius: 28px 40px 24px 44px / 36px 26px 40px 28px; }
  .detail-tip, .review-item { border-radius: 20px 26px 18px 28px / 24px 18px 26px 20px; }
  .profile-avatar, .profile-avatar::before, .profile-avatar img { border-radius: var(--blob-a) !important; }
  .profile-avatar { animation: blobMorph 11s ease-in-out infinite; }
  .profile-avatar::before { animation: blobMorph 11s ease-in-out infinite; }
  .profile-menu-item svg { border-radius: var(--blob-d); }
  /* Two soft blobs float inside the hero. */
  .hero-blob {
    position: absolute;
    z-index: -1;
    border-radius: var(--blob-a);
    background: rgba(255,255,255,.28);
    animation: blobMorph 12s ease-in-out infinite;
    pointer-events: none;
  }
  .hero-blob.one { width: 120px; height: 110px; left: -38px; top: 46%; }
  .hero-blob.two { width: 70px; height: 64px; right: 34%; bottom: -22px; animation-duration: 9s; animation-direction: reverse; }

  /* ── Bilim o'yinlari (knowledge games) ─────────────────────────────── */
  .games-rail {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding: 2px 14px 30px;
    margin-bottom: -10px;
    scrollbar-width: none;
    scroll-snap-type: x mandatory;
    scroll-padding: 0 14px;
    -webkit-overflow-scrolling: touch;
  }
  .games-rail::-webkit-scrollbar { display: none; }
  .game-tile {
    --g1: #2FA35A;
    --g2: #13AE96;
    position: relative;
    isolation: isolate;
    overflow: hidden;
    flex-shrink: 0;
    width: 196px;
    min-height: 168px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 5px;
    padding: 16px;
    border: 0;
    border-radius: 28px 36px 24px 38px / 32px 26px 36px 28px;
    background: linear-gradient(140deg, var(--g1), var(--g2));
    color: #fff;
    text-align: left;
    font-family: var(--font-body);
    cursor: pointer;
    scroll-snap-align: start;
    box-shadow: 0 16px 30px -18px var(--g1);
    transition: transform .35s var(--ease-spring);
  }
  .game-tile:nth-child(even) { border-radius: 36px 26px 38px 24px / 26px 34px 28px 36px; }
  .game-tile:active { transform: scale(.96) rotate(-1deg); }
  .game-tile[data-game="duel"]   { --g1: #FF6A1F; --g2: #FFB21E; }
  .game-tile[data-game="quiz"]   { --g1: #EC2F55; --g2: #FF7A3D; }
  .game-tile[data-game="memory"] { --g1: #7C5CF0; --g2: #2E96E0; }
  .game-tile::after {
    content: '';
    position: absolute;
    z-index: -1;
    right: -36px;
    bottom: -48px;
    width: 140px;
    height: 128px;
    border-radius: var(--blob-a);
    background: rgba(255,255,255,.16);
    animation: blobMorph 10s ease-in-out infinite;
  }
  .game-tile-icon {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 52px;
    height: 50px;
    border-radius: var(--blob-b);
    background: rgba(255,255,255,.24);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .game-tile-icon svg { width: 27px; height: 27px; }
  .game-tile-title { margin-top: 54px; font: 800 15px/1.18 var(--font-display); letter-spacing: -.01em; }
  .game-tile-sub { font-size: 12px; line-height: 1.35; opacity: .92; }
  .game-tile-best {
    align-self: flex-start;
    margin-top: 4px;
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(255,255,255,.26);
    font-size: 11px;
    font-weight: 700;
  }
  .games-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 14px 6px; }
  .games-grid .game-tile { width: auto; min-height: 184px; }
  .games-intro { padding: 0 16px 14px; color: var(--hint); font-size: 13.5px; line-height: 1.5; }
  .games-note { margin: 12px 16px 18px; color: var(--hint); font-size: 11.5px; line-height: 1.5; }
  #page-games.playing .games-header { display: none; }

  .game-shell { padding: 14px 14px 20px; }
  .game-top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .game-back {
    flex-shrink: 0;
    height: 38px;
    padding: 0 14px 0 10px;
    border-radius: 999px;
    border: 1px solid var(--hairline);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .game-title { flex: 1; min-width: 0; font: 800 15px/1.2 var(--font-display); letter-spacing: -.015em; }
  .game-score {
    flex-shrink: 0;
    padding: 6px 12px;
    border-radius: var(--blob-b);
    background: var(--pop);
    color: var(--on-pop);
    font: 800 13px var(--font-display);
    white-space: nowrap;
  }
  .game-progress { display: flex; gap: 4px; margin-bottom: 14px; }
  .game-progress i { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-hi); }
  .game-progress i.ok { background: var(--leaf); }
  .game-progress i.bad { background: var(--berry); }
  .game-progress i.now { background: var(--pop); }

  .food-card {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 26px 18px;
    border-radius: 34px 44px 30px 48px / 42px 32px 46px 34px;
    background: linear-gradient(var(--tint), var(--tint)), var(--surface);
    border: 1px solid var(--hairline);
    text-align: center;
    color: var(--text);
    animation: popIn .45s var(--ease-spring);
  }
  .food-card::before {
    content: '';
    position: absolute;
    z-index: -1;
    width: 190px;
    height: 176px;
    border-radius: var(--blob-a);
    background: var(--tone);
    opacity: .16;
    animation: blobMorph 9s ease-in-out infinite;
  }
  .food-mono {
    width: 76px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--blob-c);
    background: var(--tone);
    color: #fff;
    font: 800 30px var(--font-display);
    box-shadow: 0 14px 26px -14px var(--tone);
    transform: rotate(-6deg);
    animation: blobMorph 7s ease-in-out infinite;
  }
  .food-name { font: 800 23px/1.15 var(--font-display); letter-spacing: -.02em; text-wrap: balance; }
  .food-sub { font-size: 12.5px; font-weight: 600; color: var(--hint); }
  .game-answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .game-btn {
    height: 60px;
    border: 0;
    border-radius: 22px 26px 20px 28px / 26px 20px 28px 22px;
    color: #fff;
    font: 800 15.5px var(--font-body);
    cursor: pointer;
    transition: transform .3s var(--ease-spring), opacity .2s;
  }
  .game-btn.yes { background: linear-gradient(135deg, #46C774, #1D8446); box-shadow: 0 12px 24px -14px #1D8446; }
  .game-btn.no { background: linear-gradient(135deg, #FF5B78, #D9203F); box-shadow: 0 12px 24px -14px #D9203F; }
  .game-btn:active { transform: scale(.95); }
  .game-btn:disabled { opacity: .4; box-shadow: none; transform: none; }
  .game-reveal {
    margin-top: 14px;
    padding: 16px;
    border-radius: 24px 30px 22px 32px / 28px 22px 30px 24px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    box-shadow: var(--shadow-1);
    animation: popIn .4s var(--ease-spring);
  }
  .game-verdict {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 12px;
    border-radius: var(--blob-d);
    font-size: 12.5px;
    font-weight: 800;
  }
  .game-verdict.ok { background: var(--leaf-soft); color: var(--leaf-deep); }
  .game-verdict.bad { background: var(--berry-soft); color: var(--berry); }
  .game-carbs { margin-top: 8px; font: 800 28px var(--font-display); letter-spacing: -.03em; }
  .game-carbs small { font: 600 12.5px var(--font-body); letter-spacing: 0; color: var(--hint); }
  .game-fact { margin-top: 8px; font-size: 14px; line-height: 1.55; }
  .game-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .game-next {
    flex: 1 1 140px;
    height: 50px;
    border: 0;
    border-radius: 999px;
    background: var(--btn-grad);
    color: var(--btn-text);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--shadow-pop);
  }
  .game-shop {
    flex: 1 1 140px;
    height: 50px;
    padding: 0 16px;
    border-radius: 999px;
    border: 1.5px solid var(--leaf);
    background: var(--leaf-soft);
    color: var(--leaf-deep);
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .game-shop-wide { display: block; width: 100%; margin-top: 12px; }
  .game-next:active, .game-shop:active, .game-back:active { transform: scale(.96); }

  .duel-q { margin: 2px 4px 14px; text-align: center; font: 700 15px/1.3 var(--font-display); }
  .duel { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .duel-card { min-height: 210px; padding: 20px 10px; cursor: pointer; border-width: 2.5px; font: inherit; transition: transform .3s var(--ease-spring), border-color .2s; }
  .duel-card:nth-child(2) { border-radius: 44px 32px 48px 30px / 32px 44px 34px 46px; }
  .duel-card .food-name { font-size: 16px; }
  .duel-card .food-mono { width: 62px; height: 58px; font-size: 25px; }
  .duel-card:active { transform: scale(.96); }
  .duel-card:disabled { cursor: default; }
  .duel-card.win { border-color: var(--leaf); }
  .duel-card.lose { border-color: var(--berry); opacity: .82; }
  .duel-card.picked { transform: scale(1.02); }
  .duel-carbs { min-height: 1.2em; font: 800 19px var(--font-display); color: var(--text); }
  .duel-vs {
    position: absolute;
    z-index: 2;
    left: 50%;
    top: 50%;
    width: 50px;
    height: 46px;
    margin: -23px 0 0 -25px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--blob-a);
    background: var(--text);
    color: var(--bg);
    font: 800 13px var(--font-display);
    box-shadow: 0 0 0 4px var(--bg);
    pointer-events: none;
  }

  .quiz-q { margin: 2px 2px 16px; font: 800 18px/1.3 var(--font-display); letter-spacing: -.015em; text-wrap: balance; }
  .quiz-opts { display: grid; gap: 8px; }
  .quiz-opt {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 56px;
    padding: 10px 14px;
    border-radius: 18px 22px 16px 24px / 22px 16px 24px 18px;
    border: 1.5px solid var(--hairline);
    background: var(--surface);
    color: var(--text);
    text-align: left;
    font: 600 14.5px/1.35 var(--font-body);
    cursor: pointer;
    transition: transform .3s var(--ease-spring), border-color .2s, background-color .2s;
  }
  .quiz-opt:active { transform: scale(.98); }
  .quiz-opt:disabled { cursor: default; }
  .quiz-opt b {
    flex-shrink: 0;
    width: 32px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--blob-c);
    background: var(--surface-hi);
    font: 800 13px var(--font-display);
  }
  .quiz-opt.right { border-color: var(--leaf); background: var(--leaf-soft); }
  .quiz-opt.right b { background: var(--leaf); color: #fff; }
  .quiz-opt.wrong { border-color: var(--berry); background: var(--berry-soft); animation: gameShake .4s; }
  .quiz-opt.wrong b { background: var(--berry); color: #fff; }

  .mem-hint { padding: 0 2px 12px; }
  .mem-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; perspective: 900px; }
  .mem-card {
    position: relative;
    aspect-ratio: 1 / 1.08;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform .5s var(--ease);
  }
  .mem-card.open, .mem-card.done { transform: rotateY(180deg); }
  .mem-face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    text-align: center;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
  }
  .mem-back {
    border-radius: 24px 30px 22px 32px / 28px 22px 30px 24px;
    background: linear-gradient(140deg, #8B6CF0, #2E96E0);
    color: #fff;
    font: 800 26px var(--font-display);
    box-shadow: 0 12px 22px -14px #5A4BD0;
  }
  .mem-card:nth-child(3n+2) .mem-back { background: linear-gradient(140deg, #FF6A1F, #FFB21E); box-shadow: 0 12px 22px -14px #E05A0C; border-radius: 30px 24px 32px 22px / 22px 30px 24px 30px; }
  .mem-card:nth-child(3n) .mem-back { background: linear-gradient(140deg, #2FA35A, #13AE96); box-shadow: 0 12px 22px -14px #1D8446; }
  .mem-front {
    transform: rotateY(180deg);
    border-radius: 26px 22px 30px 24px / 24px 30px 22px 28px;
    background: var(--surface);
    border: 2px solid var(--hairline);
    color: var(--text);
    font: 700 12.5px/1.25 var(--font-body);
  }
  .mem-front.kind-product { background: var(--t-sun); font: 800 12px/1.2 var(--font-display); }
  .mem-card.done .mem-front { border-color: var(--leaf); background: var(--leaf-soft); }
  .mem-card.miss .mem-front { border-color: var(--berry); background: var(--berry-soft); }

  .game-result {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    padding: 30px 18px 22px;
    border-radius: 36px 46px 32px 50px / 44px 34px 48px 36px;
    background: var(--hero-bg);
    color: var(--hero-text);
    text-align: center;
    animation: popIn .5s var(--ease-spring);
  }
  .game-result::before {
    content: '';
    position: absolute;
    z-index: -1;
    left: 50%;
    top: 14px;
    width: 150px;
    height: 136px;
    margin-left: -75px;
    border-radius: var(--blob-a);
    background: rgba(255,255,255,.3);
    animation: blobMorph 8s ease-in-out infinite;
  }
  .game-result-big { padding-top: 22px; font: 800 52px/1 var(--font-display); letter-spacing: -.04em; }
  .game-result-msg { margin-top: 26px; font: 800 16px/1.3 var(--font-display); }
  .game-result-sub { margin-top: 6px; font-size: 13px; font-weight: 600; opacity: .85; }
  .game-result .game-actions { justify-content: center; }
  .game-again {
    height: 48px;
    padding: 0 20px;
    border: 0;
    border-radius: 999px;
    background: var(--hero-cta-bg);
    color: var(--hero-cta-fg);
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .game-other {
    height: 48px;
    padding: 0 20px;
    border-radius: 999px;
    border: 1.5px solid currentColor;
    background: transparent;
    color: inherit;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(.94) translateY(8px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes gameShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  /* ── Wider screens (Telegram Desktop) ───────────────────────────────
     Keep reading widths sane instead of stretching edge to edge. */
  @media (min-width: 700px) {
    .page { max-width: 760px; margin: 0 auto; }
    .product-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  }

  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--link);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
      scroll-behavior: auto !important;
    }
    .organic-leaves { display: none; }
  }
</style>
</head>
<body>

<!-- Decorative drifting leaves — populated once by initOrganicLeaves() in
     JS and run behind every theme (night/day/organic). -->
<div class="organic-leaves" id="organic-leaves" aria-hidden="true"></div>

<!-- ===== PAGE: HOME ===== -->
<div class="page active" id="page-home">
  <!-- Every product, auto-scrolling, at the very top (owner, 2026-10-02:
       "barcha mahsulotlarni saytda eng tepada"). Filled by renderHomePage. -->
  <div id="home-top-carousel"></div>
  <div class="home-hero">
    <!-- Decorative rotating brand stamp; the headline wraps around it. -->
    <div class="hero-stamp" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <defs><path id="hero-stamp-ring" d="M50,50 m-38,0 a38,38 0 1,1 76,0 a38,38 0 1,1 -76,0"/></defs>
        <text><textPath href="#hero-stamp-ring" textLength="236" lengthAdjust="spacing">KETOSHOP • KETOSHOP • KETOSHOP •</textPath></text>
      </svg>
      <span class="hero-stamp-core">
        <svg viewBox="0 0 48 48">
          <path d="M24 3c-6 0-9 6-11 12-2 6-7 10-7 18a18 15 0 0 0 36 0c0-8-5-12-7-18C33 9 30 3 24 3z" fill="#2E5B24"/>
          <path d="M24 8c-4.5 0-6.5 5-8.5 10.5-2 5-5.5 8.5-5.5 14.5a14 11.5 0 0 0 28 0c0-6-3.5-9.5-5.5-14.5C30.5 13 28.5 8 24 8z" fill="#D7EC86"/>
          <circle cx="24" cy="31" r="7.5" fill="#8A5A2B"/>
          <circle cx="21.5" cy="28.5" r="2.2" fill="#B98250"/>
        </svg>
      </span>
    </div>
    <span class="hero-blob one" aria-hidden="true"></span>
    <span class="hero-blob two" aria-hidden="true"></span>
    <div class="home-hero-eyebrow" id="home-hero-eyebrow"></div>
    <div class="home-hero-title" id="home-hero-title"></div>
    <div class="home-hero-sub" id="home-hero-sub"></div>
    <button class="home-hero-cta" onclick="switchPage('catalog')" id="home-hero-cta" type="button"></button>
  </div>
  <button class="promo-banner" id="home-promo-banner" style="display:none" type="button" onclick="openPromoSheet()">
    <span class="pb-icon">🎁</span>
    <span class="pb-body">
      <span class="pb-title" id="home-promo-title"></span>
      <span class="pb-sub" id="home-promo-sub"></span>
    </span>
    <span class="pb-arrow">›</span>
  </button>
  <div class="perk-strip" id="home-perks" style="display:none"></div>
  <!-- Knowledge games teaser, filled by renderGamesTeaser(). -->
  <div class="home-section" id="home-games"></div>
  <div id="home-sections"></div>
  <div class="loading" id="home-loading" style="display:none"></div>
</div>

<!-- ===== PAGE: CATALOG ===== -->
<div class="page" id="page-catalog">
  <div class="catalog-search-bar">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="catalog-search" placeholder="...">
    </div>
  </div>
  <button class="promo-strip" id="catalog-promo-strip" style="display:none" type="button" onclick="openPromoSheet()"></button>
  <div class="perk-strip" id="catalog-perks" style="display:none"></div>
  <div class="categories" id="categories"></div>
  <div class="product-grid" id="product-grid"></div>
  <div class="loading" id="catalog-loading" style="display:none"></div>
  <div class="empty-state" id="catalog-empty" style="display:none">
    <div class="emoji">😔</div>
    <div id="catalog-empty-text"></div>
  </div>
  <div class="scroll-loader" id="scroll-loader" style="display:none"><span class="spinner"></span></div>
</div>

<!-- ===== PAGE: CART ===== -->
<div class="page" id="page-cart">
  <div class="cart-page-content">
    <div class="cart-page-header" id="cart-page-title"></div>
    <div class="perk-strip" id="cart-perks" style="display:none"></div>
    <div id="cart-items"></div>
    <div class="empty-state" id="cart-empty" style="display:none">
      <div class="emoji">🛒</div>
      <div id="cart-empty-text"></div>
    </div>
  </div>
  <div class="cart-footer" id="cart-footer" style="display:none">
    <div class="cart-saved-banner" id="cart-saved-banner" style="display:none"></div>
    <label class="keto-redeem-toggle-row" id="cart-keto-group" style="display:none;margin-bottom:10px">
      <span id="cart-keto-toggle-text"></span>
      <input type="checkbox" id="cart-keto-toggle">
    </label>
    <div class="cart-discount-line" id="cart-discount-line" style="display:none"></div>
    <div class="cart-total-row">
      <span id="cart-total-label"></span>
      <span id="cart-total-value"></span>
    </div>
    <div class="cart-actions">
      <button class="btn-clear" onclick="clearCart()" id="btn-clear-cart"></button>
      <button class="btn-checkout" onclick="checkout()" id="btn-checkout"></button>
    </div>
  </div>
</div>

<!-- ===== PAGE: CHECKOUT ===== -->
<div class="page" id="page-checkout">
  <div class="checkout-content">
    <div class="checkout-header" id="checkout-title"></div>

    <div class="checkout-summary" id="checkout-summary"></div>

    <div class="checkout-form">
      <div class="form-group">
        <label id="lbl-phone"></label>
        <input type="tel" id="inp-phone" placeholder="+998901234567" autocomplete="tel">
      </div>
      <div class="form-group">
        <label id="lbl-location"></label>
        <button class="location-btn" id="btn-get-location" onclick="getLocation()">
          <span id="location-icon">📍</span>
          <span id="location-text"></span>
        </button>
        <button class="location-btn map-pick-btn" id="btn-pick-on-map" onclick="openMapPicker()" type="button">
          <span>🗺️</span>
          <span id="map-pick-text"></span>
        </button>
        <div class="location-address-box" id="location-address-box" style="display:none">
          <label class="location-address-label" id="location-address-label" for="location-address"></label>
          <textarea class="location-address-input" id="location-address" rows="2" maxlength="500"></textarea>
        </div>
        <input type="hidden" id="inp-lat" value="">
        <input type="hidden" id="inp-lng" value="">
      </div>
      <div class="form-group" id="delivery-group" style="display:none">
        <label id="lbl-delivery"></label>
        <div class="delivery-options-list" id="delivery-options"></div>
      </div>
      <div class="form-group">
        <label id="lbl-payment"></label>
        <div class="payment-options">
          <button class="pay-opt active" data-method="cash" id="pay-cash"></button>
          <button class="pay-opt" data-method="online" id="pay-online"></button>
        </div>
      </div>
      <div class="form-group" id="keto-redeem-group" style="display:none">
        <label class="keto-redeem-toggle-row">
          <span id="keto-redeem-toggle-text"></span>
          <input type="checkbox" id="keto-redeem-toggle">
        </label>
        <input type="number" id="keto-redeem-amount" min="0" step="1" style="display:none;margin-top:8px">
      </div>
    </div>

    <div class="checkout-total" id="checkout-total-row"></div>
    <button class="checkout-submit-btn" id="btn-submit-order" onclick="submitOrder()"></button>
    <button class="checkout-back-btn" onclick="switchPage('cart')" id="btn-checkout-back"></button>
  </div>
</div>

<!-- ===== PAGE: ORDER SUCCESS ===== -->
<div class="page" id="page-order-success">
  <div class="empty-state" style="padding-top:100px">
    <div class="emoji">✅</div>
    <div id="order-success-text" style="font-size:16px;font-weight:600;color:var(--text)"></div>
    <div id="order-success-detail" style="margin-top:8px"></div>
    <div id="order-success-keto" style="margin-top:14px;font-size:14px;font-weight:600;display:none"></div>
    <button class="checkout-submit-btn" style="margin-top:24px;width:80%" onclick="switchPage('home')" id="btn-continue-shopping"></button>
  </div>
</div>

<!-- ===== PAGE: CHEQUE UPLOAD (online payment) ===== -->
<div class="page" id="page-cheque">
  <div class="cheque-page">
    <div class="cheque-title" id="cheque-title"></div>
    <div class="cheque-order" id="cheque-order"></div>
    <div class="cheque-total" id="cheque-total"></div>

    <div class="cheque-row">
      <div class="cheque-row-label" id="cheque-card-label"></div>
      <div class="cheque-row-value">
        <code id="cheque-card-value"></code>
        <button class="cheque-copy" id="cheque-copy-card" type="button"></button>
      </div>
    </div>
    <div class="cheque-row">
      <div class="cheque-row-label" id="cheque-recipient-label"></div>
      <div class="cheque-row-value">
        <span id="cheque-recipient-value"></span>
      </div>
    </div>

    <div class="cheque-hint" id="cheque-hint"></div>

    <input type="file" id="cheque-file" accept="image/*,application/pdf" style="display:none" onchange="onChequeFileSelected(event)">
    <button class="cheque-pick-btn" id="cheque-pick-btn" type="button" onclick="document.getElementById('cheque-file').click()"></button>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// ===== SITE THEME =====
// Defaults to the bright day theme (owner, 2026-10-02 — it was night since
// 2026-07-13). Not tied to Telegram's own light/dark setting. Buyers can
// switch from the Profile page; a buyer who already picked a theme keeps it,
// since the choice persists via localStorage like the language does.
let siteTheme = localStorage.getItem('ketoshop_theme') || 'day';

// Populates the drifting leaf particles once — runs on every theme
// (night/day/organic), owner's request 2026-07-20. Idempotent, so
// re-running on a theme switch is a cheap no-op once populated.
// Declared *before* applySiteTheme() below, which calls it immediately —
// a `const` referenced before its own declaration line runs throws
// (temporal dead zone), which was silently crashing the entire app's
// top-level script on every load (2026-07-20 incident: fixed same-day).
const LEAF_EMOJI = ['🍃', '🌿', '🍀'];
function initOrganicLeaves() {
  const holder = document.getElementById('organic-leaves');
  if (!holder) return;
  if (holder.children.length) return; // already populated
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 10; i++) {
    const leaf = document.createElement('span');
    leaf.className = 'leaf';
    leaf.textContent = LEAF_EMOJI[i % LEAF_EMOJI.length];
    leaf.style.setProperty('--x', (Math.random() * 100) + '%');
    leaf.style.setProperty('--size', (14 + Math.random() * 14) + 'px');
    leaf.style.setProperty('--dur', (12 + Math.random() * 10) + 's');
    leaf.style.setProperty('--delay', (-Math.random() * 20) + 's');
    leaf.style.setProperty('--drift', (Math.random() * 120 - 60) + 'px');
    frag.appendChild(leaf);
  }
  holder.appendChild(frag);
  initLeafMagnetPhysics(holder);
}

// Takes the ambient leaves off the CSS keyframe and drives them from JS
// instead, so a finger press (or mouse-down, on desktop) can pull nearby
// leaves toward it like a magnet — owner's request, 2026-07-28. Runs once;
// the leaves layer stays pointer-events:none so it never intercepts taps,
// but window-level pointer listeners still see every press/touch/drag
// anywhere on the page (including on real buttons) to know where to pull.
let _leafPhysicsStarted = false;
function initLeafMagnetPhysics(holder) {
  if (_leafPhysicsStarted) return;
  _leafPhysicsStarted = true;

  const MAGNET_RADIUS = 170;   // px — reach of a single press
  const MAGNET_ACCEL = 2200;   // px/s^2 at zero distance, tapering to 0 at the radius
  const DRAG = 0.90;           // per-frame damping so a pull settles instead of orbiting forever

  const pointers = new Map(); // pointerId -> {x, y}
  window.addEventListener('pointerdown', e => pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }), { passive: true });
  window.addEventListener('pointermove', e => { if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); }, { passive: true });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(evt =>
    window.addEventListener(evt, e => pointers.delete(e.pointerId), { passive: true })
  );

  function makeLeaf(el) {
    const dur = 12 + Math.random() * 10; // seconds for one full fall cycle
    return {
      el,
      x: Math.random() * window.innerWidth,
      y: -40,
      vx: 0, vy: 0,                       // extra velocity from magnet pulls, px/s
      rot: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 50, // deg/s
      driftAmp: 30 + Math.random() * 50,
      driftFreq: 0.15 + Math.random() * 0.2,
      phase: Math.random() * Math.PI * 2,
      fallSpeed: (window.innerHeight * 1.24) / dur, // px/s baseline descent
      fadeDur: dur,
      born: Math.random() * dur, // stagger so all 10 don't cycle in sync
    };
  }
  function respawn(l) {
    l.x = Math.random() * window.innerWidth;
    l.y = -40;
    l.vx = 0; l.vy = 0;
    l.born = 0;
  }

  const leaves = Array.from(holder.querySelectorAll('.leaf')).map(el => {
    el.style.animation = 'none'; // hand control over to the rAF loop below
    return makeLeaf(el);
  });

  let lastT = null;
  function frame(now) {
    if (lastT === null) lastT = now;
    const dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;

    for (const l of leaves) {
      l.born += dt;

      for (const p of pointers.values()) {
        const dx = p.x - l.x, dy = p.y - l.y;
        const dist = Math.hypot(dx, dy) || 1;
        if (dist < MAGNET_RADIUS) {
          const accel = MAGNET_ACCEL * (1 - dist / MAGNET_RADIUS);
          l.vx += (dx / dist) * accel * dt;
          l.vy += (dy / dist) * accel * dt;
        }
      }
      l.vx *= DRAG;
      l.vy *= DRAG;

      const sway = Math.sin(l.phase + l.born * l.driftFreq * 2 * Math.PI) * l.driftAmp * dt * 0.6;
      l.x += l.vx * dt + sway;
      l.y += (l.fallSpeed + l.vy) * dt;
      l.rot += l.rotSpeed * dt;

      // Wrap horizontally so a pull off one edge doesn't strand it offscreen.
      const w = window.innerWidth;
      if (l.x < -30) l.x = w + 30;
      if (l.x > w + 30) l.x = -30;

      if (l.y > window.innerHeight + 80 || l.born > l.fadeDur) respawn(l);

      const progress = Math.min(l.born / l.fadeDur, 1);
      const opacity = progress < 0.08 ? 0.55 * (progress / 0.08)
        : progress > 0.92 ? 0.55 * ((1 - progress) / 0.08)
        : 0.55;

      l.el.style.transform = 'translate3d(' + l.x + 'px,' + l.y + 'px,0) rotate(' + l.rot + 'deg)';
      l.el.style.opacity = opacity;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function applySiteTheme() {
  document.documentElement.setAttribute('data-site-theme', siteTheme);
  initOrganicLeaves();
  // Paint Telegram's own header/background in the page colour so the Mini
  // App reads as one surface. Hex colours need Bot API 6.9+; older clients
  // throw, which is fine — they keep Telegram's default chrome.
  try {
    const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    if (bg && tg.setHeaderColor) tg.setHeaderColor(bg);
    if (bg && tg.setBackgroundColor) tg.setBackgroundColor(bg);
  } catch (_) { /* unsupported client */ }
}
applySiteTheme();

function switchTheme(newTheme) {
  siteTheme = newTheme;
  try { localStorage.setItem('ketoshop_theme', siteTheme); } catch (_) { /* quota — ignore */ }
  applySiteTheme();
  document.querySelectorAll('.theme-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.theme === siteTheme);
  });
}

// ===== Latin → Uzbek Cyrillic transliteration =====
// Mirrors translit.py — same brand skip list, same digraph order so the
// Mini App and bot stay in lockstep.
const _UZ_BRANDS = ['Yandex Taxi','Yandex Market','Yandex','KETOSHOP','Ketoshop','Telegram','BTS','EMU','UZS'];
const _UZ_DIGRAPHS = [
  // o' / g' before yo/yu/ya so "yo'l" → й + ў + л (not ё + ъ).
  ["O'",'Ў'],["o'",'ў'],
  ["G'",'Ғ'],["g'",'ғ'],
  ['Oʻ','Ў'],['oʻ','ў'],
  ['Gʻ','Ғ'],['gʻ','ғ'],
  ['Sh','Ш'],['SH','Ш'],['sh','ш'],
  ['Ch','Ч'],['CH','Ч'],['ch','ч'],
  ['Yo','Ё'],['YO','Ё'],['yo','ё'],
  ['Yu','Ю'],['YU','Ю'],['yu','ю'],
  ['Ya','Я'],['YA','Я'],['ya','я'],
  ['Ye','Е'],['YE','Е'],['ye','е'],
];
const _UZ_SINGLES = {
  a:'а',b:'б',d:'д',e:'е',f:'ф',g:'г',h:'ҳ',i:'и',j:'ж',k:'к',l:'л',m:'м',
  n:'н',o:'о',p:'п',q:'қ',r:'р',s:'с',t:'т',u:'у',v:'в',x:'х',y:'й',z:'з',"'":'ъ','ʻ':'ъ',
  A:'А',B:'Б',D:'Д',E:'Е',F:'Ф',G:'Г',H:'Ҳ',I:'И',J:'Ж',K:'К',L:'Л',M:'М',
  N:'Н',O:'О',P:'П',Q:'Қ',R:'Р',S:'С',T:'Т',U:'У',V:'В',X:'Х',Y:'Й',Z:'З',
};
function latToCyr(text) {
  if (!text || typeof text !== 'string') return text;
  // Stash HTML tags, {format_tokens}, and brand names so they survive intact.
  const store = [];
  const stash = (m) => { store.push(m); return '' + (store.length - 1) + ''; };
  text = text.replace(/<[^>]+>/g, stash);
  text = text.replace(/\{[^{}]*\}/g, stash);
  // Telegram bot commands like /skip /done — must remain typeable
  text = text.replace(/(^|\s)\/[a-zA-Z][a-zA-Z0-9_]*/g, (m, lead) => lead + stash(m.slice(lead.length)));
  for (const b of _UZ_BRANDS) {
    if (text.includes(b)) {
      // Escape regex metachars
      const esc = b.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      text = text.replace(new RegExp(esc, 'g'), stash);
    }
  }
  // Digraphs in order
  for (const [from, to] of _UZ_DIGRAPHS) {
    if (text.includes(from)) text = text.split(from).join(to);
  }
  // Single letters
  text = Array.from(text).map((ch) => _UZ_SINGLES[ch] !== undefined ? _UZ_SINGLES[ch] : ch).join('');
  // Restore stashed pieces
  text = text.replace(/(\d+)/g, (_, i) => store[Number(i)]);
  return text;
}

// Build the active locale dict. "uz_cyr" auto-derives from L.uz so the
// Mini App doesn't need a third hand-written string table.
function buildActiveLocale() {
  if (lang === 'uz_cyr') {
    const base = L.uz;
    const out = {};
    for (const k in base) {
      out[k] = (typeof base[k] === 'string') ? latToCyr(base[k]) : base[k];
    }
    return out;
  }
  return L[lang] || L.uz;
}

async function switchLanguage(newLang) {
  const btns = document.querySelectorAll('.lang-btn');
  btns.forEach(b => b.disabled = true);
  try {
    lang = newLang;
    t = buildActiveLocale();
    try { localStorage.setItem('ketoshop_lang', lang); } catch (_) { /* quota — ignore */ }
    applyLanguage();
    // Save to server
    try { await api('/api/lang', { method: 'POST', body: JSON.stringify({ lang }) }); } catch (_) { /* server-side preference is best-effort */ }
    // Reload dynamic content. loadPromo() and not renderPromoBanners(): the
    // two standing-promise lines are worded by the SERVER (see api_promo),
    // so re-rendering the cached payload would keep showing them in the old
    // language — which is exactly what happened after a switch to Cyrillic.
    renderCatalogCategories();
    loadPromo();
    loadProducts();
    renderHomePage();
    if (activePage === 'cart') renderCartPage();
    if (activePage === 'profile') renderProfilePage();
    if (activePage === 'fav') renderFavPage();
    if (activePage === 'orders') loadOrdersPage();
    if (activePage === 'games') renderGamesPage();
  } finally {
    btns.forEach(b => b.disabled = false);
  }
}

// ===== AUTH =====
const AUTH = 'tma ' + tg.initData;
function apiHeaders() {
  return { 'Authorization': AUTH, 'Content-Type': 'application/json' };
}
async function api(path, opts = {}) {
  const res = await fetch(path, { headers: apiHeaders(), ...opts });
  if (!res.ok) {
    let body = null;
    try { body = await res.json(); } catch(_) {}
    const err = new Error(res.status);
    err.status = res.status;
    err.body = body;
    throw err;
  }
  return res.json();
}

// ===== SYSTEM BACK BUTTON =====
// Telegram exposes tg.BackButton (Android hardware back, iOS swipe-back, and
// the in-app back arrow). Without this hooked up, system-back closes the
// whole Mini App — pressing it after opening a product detail dropped the
// buyer all the way out instead of just closing the modal.
function _isModalOpen(id) {
  const el = document.getElementById(id);
  return el && el.classList.contains('show');
}

function onBackPressed() {
  // Highest-priority overlays win.
  if (_isModalOpen('map-modal')) { closeMapPicker(); return; }
  if (_isModalOpen('detail-modal')) { closeDetail(); return; }
  // Inside a game, back returns to the games menu first.
  if (activePage === 'games' && gameState) { renderGamesPage(); return; }
  // Then page-level: anywhere except home → go home. (Home itself has
  // BackButton hidden, so Telegram handles back natively → app closes.)
  if (activePage && activePage !== 'home') {
    switchPage('home');
  }
}

function updateBackButton() {
  if (!tg.BackButton) return;
  const shouldShow = (
    _isModalOpen('map-modal') ||
    _isModalOpen('detail-modal') ||
    (activePage && activePage !== 'home')
  );
  if (shouldShow) tg.BackButton.show();
  else tg.BackButton.hide();
}

if (tg.BackButton) {
  tg.BackButton.onClick(onBackPressed);
}

document.querySelectorAll('.tab-item').forEach(tab => {
  tab.addEventListener('click', () => switchPage(tab.dataset.page));
});

let gameState = null;  // the running game, or null while the menu shows

function gameShuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function gamesBest() {
  try { return JSON.parse(localStorage.getItem('ketoshop_games') || '{}') || {}; } catch (_) { return {}; }
}

function saveGameBest(id, value) {
  const best = gamesBest();
  const lowerWins = id === 'memory';
  const prev = best[id];
  const better = prev === undefined || (lowerWins ? value < prev : value > prev);
  if (better) {
    best[id] = value;
    try { localStorage.setItem('ketoshop_games', JSON.stringify(best)); } catch (_) { /* quota — ignore */ }
  }
  return better;
}

function gameBestLabel(id) {
  const b = gamesBest()[id];
  if (b === undefined) return '';
  if (id === 'keto' || id === 'quiz') return gx('Rekord: ' + b + '/10', 'Рекорд: ' + b + '/10');
  if (id === 'duel') return gx('Rekord: ' + b + ' ketma-ket', 'Рекорд: ' + b + ' подряд');
  return gx('Rekord: ' + b + ' urinish', 'Рекорд: ' + b + ' попыток');
}

function gameHaptic(ok) {
  try { if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(ok ? 'success' : 'error'); } catch (_) {}
}

function gameTileHtml(g) {
  const best = gameBestLabel(g.id);
  return '<button type="button" class="game-tile" data-game="' + g.id + '" onclick="openGame(\'' + g.id + '\')">' +
    '<span class="game-tile-icon" aria-hidden="true">' + GAME_ICONS[g.id] + '</span>' +
    '<span class="game-tile-title">' + escapeHtml(gx(g.title[0], g.title[1])) + '</span>' +
    '<span class="game-tile-sub">' + escapeHtml(gx(g.sub[0], g.sub[1])) + '</span>' +
    (best ? '<span class="game-tile-best">' + escapeHtml(best) + '</span>' : '') +
  '</button>';
}

function gameTitle(id) {

function gameProgressHtml(marks, total) {
  let html = '<div class="game-progress" aria-hidden="true">';
  for (let i = 0; i < total; i++) {
    const cls = i < marks.length ? (marks[i] ? 'ok' : 'bad') : (i === marks.length ? 'now' : '');
    html += '<i class="' + cls + '"></i>';
  }
  return html + '</div>';
}

function gameToneStyle(i) {
  const t = GAME_TONES[i % GAME_TONES.length];

function foodName(f) { return gx(f[0], f[1]); }

// ── 1. Keto mi, emas mi? ─────────────────────────────────────────────
function startKetoGame() {
  const yes = gameShuffle(GAME_FOODS.filter(f => f[3])).slice(0, 5);
  const no = gameShuffle(GAME_FOODS.filter(f => !f[3])).slice(0, 5);
  gameState = { id: 'keto', items: gameShuffle(yes.concat(no)), i: 0, score: 0, marks: [], answered: false };
  renderKetoRound();
}

function renderKetoRound() {
  const s = gameState;
  const f = s.items[s.i];
  setGameScreen('keto', s.score + '/' + s.items.length,
    gameProgressHtml(s.marks, s.items.length) +
    foodCardHtml(f, s.i) +
    '<div class="game-answers" id="keto-answers">' +
      '<button type="button" class="game-btn yes" onclick="answerKeto(true)">✓ ' + escapeHtml(gx('Keto', 'Кето')) + '</button>' +
      '<button type="button" class="game-btn no" onclick="answerKeto(false)">✗ ' + escapeHtml(gx('Keto emas', 'Не кето')) + '</button>' +
    '</div>' +
    '<div id="game-reveal-slot"></div>');
}

function answerKeto(saysKeto) {
  const s = gameState;
  if (!s || s.id !== 'keto' || s.answered) return;
  s.answered = true;
  const f = s.items[s.i];
  const ok = saysKeto === f[3];
  if (ok) s.score++;
  s.marks.push(ok);
  gameHaptic(ok);
  document.querySelectorAll('#keto-answers .game-btn').forEach(b => { b.disabled = true; });
  document.getElementById('game-score').textContent = s.score + '/' + s.items.length;
  const verdict = ok ? gx("To'g'ri!", 'Верно!') : gx("Noto'g'ri", 'Неверно');
  const body =
    '<div class="game-carbs">' + foodCarbs(f) + ' <small>' + escapeHtml(gx('sof uglevod 100 g da', 'чистых углеводов на 100 г')) + '</small></div>' +
    '<div class="game-fact"><b>' + escapeHtml(f[3] ? gx('Keto uchun mos.', 'Подходит для кето.') : gx('Keto uchun mos emas.', 'Не подходит для кето.')) + '</b> ' +
      escapeHtml(gx(f[5], f[6])) + '</div>';
  showGameReveal(gameRevealHtml(ok, verdict, body, f[4], gameNextLabel(s.i === s.items.length - 1), 'nextKetoRound()'));
}

function nextKetoRound() {
  const s = gameState;
  if (!s || s.id !== 'keto') return;

// ── 2. Qaysi birida uglevod kam? ─────────────────────────────────────
const DUEL_MAX = 12;

function startDuelGame() {
  gameState = { id: 'duel', streak: 0, used: new Set(), pair: null, answered: false };
  renderDuelRound();
}

function pickDuelPair() {
  const s = gameState;
  for (let tries = 0; tries < 300; tries++) {
    const a = GAME_FOODS[Math.floor(Math.random() * GAME_FOODS.length)];
    const b = GAME_FOODS[Math.floor(Math.random() * GAME_FOODS.length)];
    // Ties and near-ties are not fair questions with rounded figures.
    if (a === b || Math.abs(a[2] - b[2]) < 3) continue;
    const key = [a[0], b[0]].sort().join('|');
    if (s.used.has(key)) continue;
    s.used.add(key);
    return [a, b];
  }
  return [GAME_FOODS[0], GAME_FOODS[18]];
}

function renderDuelRound() {
  const s = gameState;
  s.pair = pickDuelPair();
  s.answered = false;
  setGameScreen('duel', '🔥 ' + s.streak,
    '<div class="duel-q">' + escapeHtml(gx('Qaysi birida sof uglevod kamroq?', 'В чём меньше чистых углеводов?')) + '</div>' +
    '<div class="duel" id="duel">' + foodCardHtml(s.pair[0], 0, 'button') + foodCardHtml(s.pair[1], 1, 'button') +
      '<div class="duel-vs" aria-hidden="true">VS</div></div>' +
    '<div id="game-reveal-slot"></div>');
}

function answerDuel(k) {
  const s = gameState;
  if (!s || s.id !== 'duel' || s.answered) return;
  s.answered = true;
  const pick = s.pair[k];
  const other = s.pair[1 - k];
  const ok = pick[2] < other[2];
  const cards = document.querySelectorAll('#duel .duel-card');
  cards.forEach((c, i) => {
    c.disabled = true;
    c.querySelector('.duel-carbs').textContent = foodCarbs(s.pair[i]);
    c.classList.add(s.pair[i][2] < s.pair[1 - i][2] ? 'win' : 'lose');
  });
  cards[k].classList.add('picked');
  gameHaptic(ok);
  const low = ok ? pick : other;
  const high = ok ? other : pick;
  const fact = '<div class="game-fact">' + escapeHtml(gx(
    foodName(low) + ': ' + foodCarbs(low) + ', ' + foodName(high) + ': ' + foodCarbs(high) + '. ' + low[5],
    foodName(low) + ': ' + foodCarbs(low) + ', ' + foodName(high) + ': ' + foodCarbs(high) + '. ' + low[6])) + '</div>';
  if (ok) {
    s.streak++;
    document.getElementById('game-score').textContent = '🔥 ' + s.streak;
    const done = s.streak >= DUEL_MAX;
    showGameReveal(gameRevealHtml(true, gx("To'g'ri! Seriya: ", 'Верно! Серия: ') + s.streak, fact, low[4],
      gameNextLabel(done), done ? 'finishGame(\'duel\', ' + s.streak + ', ' + DUEL_MAX + ')' : 'renderDuelRound()'));
  } else {
    showGameReveal(gameRevealHtml(false, gx('Seriya tugadi', 'Серия прервалась'), fact, low[4],
      gameNextLabel(true), 'finishGame(\'duel\', ' + s.streak + ', ' + DUEL_MAX + ')'));
  }
}

function startQuizGame() {
  const items = gameShuffle(GAME_QUIZ).map(item => ({
    item,
    order: gameShuffle([0, 1, 2, 3]),  // shown position → answer index (0 is right)
  }));
  gameState = { id: 'quiz', items, i: 0, score: 0, marks: [], answered: false };
  renderQuizRound();
}

function renderQuizRound() {
  const s = gameState;
  const { item, order } = s.items[s.i];
  setGameScreen('quiz', s.score + '/' + s.items.length,
    gameProgressHtml(s.marks, s.items.length) +
    '<div class="quiz-q">' + escapeHtml(gx(item.q[0], item.q[1])) + '</div>' +
    '<div class="quiz-opts" id="quiz-opts">' + order.map((ai, pos) =>
      '<button type="button" class="quiz-opt" data-pos="' + pos + '" onclick="answerQuiz(' + pos + ')">' +
        '<b>' + 'ABCD'[pos] + '</b><span>' + escapeHtml(gx(item.a[ai][0], item.a[ai][1])) + '</span></button>'
    ).join('') + '</div>' +

function answerQuiz(pos) {
  const s = gameState;
  if (!s || s.id !== 'quiz' || s.answered) return;
  s.answered = true;
  const { item, order } = s.items[s.i];
  const ok = order[pos] === 0;
  if (ok) s.score++;
  s.marks.push(ok);
  gameHaptic(ok);
  document.querySelectorAll('#quiz-opts .quiz-opt').forEach(b => {
    b.disabled = true;

  const body = '<div class="game-fact">' + escapeHtml(gx(item.e[0], item.e[1])) + '</div>';
  showGameReveal(gameRevealHtml(ok, ok ? gx("To'g'ri!", 'Верно!') : gx("Noto'g'ri", 'Неверно'), body, null,
    gameNextLabel(s.i === s.items.length - 1), 'nextQuizRound()'));
}

function nextQuizRound() {
  const s = gameState;
  if (!s || s.id !== 'quiz') return;
  s.i++;
  s.answered = false;
  if (s.i >= s.items.length) { finishGame('quiz', s.score, s.items.length); return; }
  renderQuizRound();
  window.scrollTo(0, 0);
}

// ── 4. Juftini top ───────────────────────────────────────────────────
function startMemoryGame() {
  const cards = [];
  GAME_PAIRS.forEach((pair, i) => {
    cards.push({ pair: i, kind: 'product', text: pair[0] });
    cards.push({ pair: i, kind: 'benefit', text: pair[1] });
  });
  gameState = { id: 'memory', cards: gameShuffle(cards), open: [], found: 0, moves: 0, lock: false };
  const s = gameState;
  setGameScreen('memory', memoryScoreText(0),
    '<p class="games-intro mem-hint">' + escapeHtml(gx(
      "Kartani oching va mahsulotni uning foydasi bilan juftlang.",
      'Открывайте карточки и соединяйте продукт с его пользой.')) + '</p>' +
    '<div class="mem-grid" id="mem-grid">' + s.cards.map((c, k) =>
      '<button type="button" class="mem-card" data-k="' + k + '" onclick="flipMemory(' + k + ')" aria-label="' + escapeHtml(gx('Karta', 'Карточка')) + ' ' + (k + 1) + '">' +
        '<span class="mem-face mem-back" aria-hidden="true">?</span>' +
        '<span class="mem-face mem-front kind-' + c.kind + '">' + escapeHtml(gx(c.text[0], c.text[1])) + '</span>' +
      '</button>').join('') + '</div>');
}

function memoryScoreText(moves) {
  return gx(moves + ' urinish', moves + ' попыт.');
}

function flipMemory(k) {
  const s = gameState;
  if (!s || s.id !== 'memory' || s.lock) return;
  const el = document.querySelector('.mem-card[data-k="' + k + '"]');
  if (!el || el.classList.contains('open') || el.classList.contains('done')) return;
  el.classList.add('open');
  s.open.push(k);
  if (s.open.length < 2) return;

  s.moves++;
  document.getElementById('game-score').textContent = memoryScoreText(s.moves);
  const [a, b] = s.open;
  const els = s.open.map(i => document.querySelector('.mem-card[data-k="' + i + '"]'));
  s.open = [];
  if (s.cards[a].pair === s.cards[b].pair) {
    s.found++;
    gameHaptic(true);
    els.forEach(e => { e.classList.add('done'); e.disabled = true; });
    if (s.found === GAME_PAIRS.length) setTimeout(() => finishGame('memory', s.moves, GAME_PAIRS.length), 700);
  } else {
    s.lock = true;
    gameHaptic(false);
    els.forEach(e => e.classList.add('miss'));
    setTimeout(() => {
      els.forEach(e => e.classList.remove('open', 'miss'));
      s.lock = false;
    }, 950);
  }
}

function finishGame(id, value, total) {
  if (!gameState || gameState.id !== id) return;
  gameState.finished = true;
  const record = saveGameBest(id, value);
  let big, msg, great;
  if (id === 'memory') {
    big = String(value);
    great = value <= total + 3;
    msg = gx(value + ' urinishda hammasini topdingiz', 'Всё найдено за ' + value + ' попыток');
  } else if (id === 'duel') {
    big = String(value);
    great = value >= 6;
    msg = value >= total ? gx('Barcha savollar to\'g\'ri — zo\'r!', 'Все ответы верные — отлично!')
                         : gx(value + ' ta ketma-ket to\'g\'ri javob', value + ' верных ответов подряд');
  } else {
    big = value + '/' + total;
    great = value >= total * 0.8;
    msg = great ? gx('Ajoyib! Siz keto bilimdonisiz', 'Отлично! Вы знаток кето')
        : value >= total * 0.5 ? gx('Yaxshi natija!', 'Хороший результат!')
        : gx('Yana bir bor urinib ko\'ring', 'Попробуйте ещё раз');
  }
  const sub = record ? gx('Yangi rekord! 🎉', 'Новый рекорд! 🎉') : gameBestLabel(id);
  setGameScreen(id, '',
    '<div class="game-result" id="game-result">' +
      '<div class="game-result-big">' + escapeHtml(big) + '</div>' +
      '<div class="game-result-msg">' + escapeHtml(msg) + '</div>' +
      '<div class="game-result-sub">' + escapeHtml(sub) + '</div>' +
      '<div class="game-actions">' +
        '<button type="button" class="game-again" onclick="openGame(\'' + id + '\')">' + escapeHtml(gx("Qayta o'ynash", 'Сыграть ещё')) + '</button>' +
        '<button type="button" class="game-other" onclick="renderGamesPage()">' + escapeHtml(gx("Boshqa o'yin", 'Другая игра')) + '</button>' +
      '</div>' +
    '</div>' +
    '<button type="button" class="game-shop game-shop-wide" onclick="gameToShop(\'keto_flour\')">' +
      escapeHtml(gx("Keto mahsulotlarini ko'rish", 'Смотреть кето-продукты')) + ' →</button>');
  if (great || record) launchConfetti(document.getElementById('game-result'));
  gameHaptic(true);
  renderGamesTeaser();
}

(async function init() {
  // Paint immediately with the language we already know locally
  // (localStorage / Telegram's language_code — set synchronously above at
  // module load) instead of leaving the buyer staring at a blank shell
  // while we wait on a network round trip just to double-check it.
  applyLanguage();
  updateBackButton();

  // Reconcile the server-saved language preference in the background; only
  // re-render text if it actually differs from our local guess.
  const langPromise = api('/api/lang').then(langData => {
    if (langData.lang && L[langData.lang] && langData.lang !== lang) {
      lang = langData.lang;
      t = buildActiveLocale();
      try { localStorage.setItem('ketoshop_lang', lang); } catch (_) { /* quota — ignore */ }
      applyLanguage();
    }
  }).catch(() => { /* use local fallback */ });

  const ketoRatePromise = api('/api/keto/status')
    .then(s => { ketoRate = (s && s.rate) || 0; })
    .catch(() => { /* no badges */ });

  try {
    categories = await api('/api/categories');
    await ketoRatePromise;
    await loadPromo();
    renderHomePage();
    renderCatalogCategories();
    await loadProducts();
    await loadCart();

    // Deep link: ?product=<id> on the Mini App URL (used by admin broadcasts —
    // e.g. a low-stock alert with a "tap here" button) opens straight into
    // that product's detail modal instead of landing on the home page.
    const dpId = parseInt(new URLSearchParams(location.search).get('product'), 10);
    if (!isNaN(dpId)) {
      openDetail(dpId).catch(() => {});
    }
  } catch(e) {
    console.error('Init error:', e);
    showToast(t.errorLoad, true);
  }

  await langPromise;
})();

// ===== TACTILE POLISH =====
// A light haptic tick on every control tap. Telegram already gets one on a
// few specific actions (add-to-cart, order placed); this generalises it to
// the whole UI, which is most of what makes a web view feel like a real app
// rather than a page. Delegated from the document so it covers controls that
// are re-rendered by innerHTML — binding per element would miss those.
//
// Guarded three ways: the API is absent on old clients, throws on some
// desktop builds, and must never break the tap it is decorating.
(function initHaptics() {
  const TAP = '.add-to-cart-btn,.btn-checkout,.checkout-submit-btn,.cheque-pick-btn,'
            + '.home-hero-cta,.promo-banner,.cart-nudge-add,.review-submit-btn';
  const LIGHT = '.cat-tab,.qty-btn,.qty-step,.btn-clear,.tab-item,.card-fav-btn,'
              + '.detail-fav-btn,.modal-close,.promo-strip,.checkout-back-btn,'
              + '.location-btn,.cheque-pay-later-btn,.lang-btn,.remove-btn,'
              + '.game-tile,.game-next,.game-back,.game-shop,.mem-card';

  document.addEventListener('pointerdown', (e) => {
    try {
      const h = tg.HapticFeedback;
      if (!h) return;
      if (e.target.closest(TAP)) h.impactOccurred('medium');
      else if (e.target.closest(LIGHT)) h.impactOccurred('light');
    } catch (_) { /* unsupported client — silence is the correct fallback */ }
  }, { passive: true });
})();

// ===== HOME PAGE =====
async function renderHomePage() {
  const container = document.getElementById('home-sections');
  const topSlot = document.getElementById('home-top-carousel');
  const loading = document.getElementById('home-loading');
  container.innerHTML = '';
  topSlot.innerHTML = '';
  loading.style.display = 'block';
  loading.textContent = t.loading;

  try {
    // Load each category's products in parallel
    const promises = categories.map(cat =>
      api('/api/products?category=' + cat.key + '&page=0&per_page=200')
        .then(data => ({ cat, products: data.products || [], total: data.total || 0 }))
        .catch(() => ({ cat, products: [], total: 0 }))
    );
    const [topProducts, results, allProductsResp, topCustomers] = await Promise.all([
      api('/api/top').catch(() => []),
      Promise.all(promises),
      // Every product — the API caps a page at 200, well above the catalogue.
      api('/api/products?page=0&per_page=200').catch(() => ({ products: [] })),
      api('/api/leaderboard').catch(() => []),
    ]);
    const allProducts = allProductsResp.products || [];

    loading.style.display = 'none';

    // All-products carousel — auto-rotating, above the banners: the first
    // thing on the page is the whole catalogue moving by.
    if (Array.isArray(allProducts) && allProducts.length) {
      topSlot.appendChild(buildAutoCarousel(allProducts));
    }

    // Top-3 most-ordered products — podium just below the all-products carousel.
    if (Array.isArray(topProducts) && topProducts.length) {
      container.appendChild(buildPodium(topProducts));
    }

    results.forEach(({ cat, products, total }) => {
      if (products.length === 0) return;
      homeProductsCache[cat.key] = products;

      const section = document.createElement('div');
      section.className = 'home-section';

      // Section header
      const header = document.createElement('div');
      header.className = 'section-header';

      const title = document.createElement('div');
      title.className = 'section-title';
      title.textContent = cat.name;

      header.appendChild(title);
      section.appendChild(header);

      // Carousel — every product in the category, no "N more" pager;
      // the buyer just scrolls the row to see the rest.
      const carousel = document.createElement('div');
      carousel.className = 'carousel';
      products.forEach(p => {
        carousel.appendChild(createCarouselCard(p));
      });
      section.appendChild(carousel);
      container.appendChild(section);
    });

    // Most-active-customers podium — marketing hook so buyers compete for a spot.
    // A little confetti burst the first time it scrolls into view.
    if (Array.isArray(topCustomers) && topCustomers.length) {
      const podiumSection = buildCustomerPodium(topCustomers);
      container.appendChild(podiumSection);
      const io = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            launchConfetti(podiumSection);
            io.disconnect();
          }
        });
      }, { threshold: 0.4 });
      io.observe(podiumSection);
    }

    if (container.children.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="emoji">📦</div><div>' + t.empty + '</div></div>';
    }
  } catch(e) {
    loading.style.display = 'none';
    console.error('Home load error:', e);
    showToast(t.errorLoad, true);
  }
}

function buildPodium(top) {
  // Three of the shop's recent bestsellers, rotated daily
  // (database.rotate_daily_window). The middle slot is raised because the
  // layout reads better that way, NOT because it is first: these are not
  // ranked 1-2-3 and must not be labelled as if they were, so no medals.
  // The customer podium below keeps its medals — that one really is a rank.
  const medals = ['', '', ''];
  const section = document.createElement('div');
  section.className = 'home-section podium-section';

  const header = document.createElement('div');
  header.className = 'section-header';
  const title = document.createElement('div');
  title.className = 'section-title';
  title.textContent = '🏆 ' + t.sectionBestsellers;
  header.appendChild(title);
  section.appendChild(header);

  const podium = document.createElement('div');
  podium.className = 'podium';
  [1, 0, 2].forEach(rankIdx => {
    const p = top[rankIdx];
    if (!p) return;
    const item = document.createElement('div');
    item.className = 'podium-item rank-' + (rankIdx + 1);
    item.onclick = () => openDetail(p.id);
    const img = p.photo_url
      ? '<img class="podium-img" src="' + p.photo_url + '" alt="" loading="lazy" onerror="this.outerHTML=\'<div class=podium-nophoto>📦</div>\'">'
      : '<div class="podium-nophoto">📦</div>';
    item.innerHTML =
      '<div class="podium-medal">' + medals[rankIdx] + '</div>' +
      img +
      '<div class="podium-name">' + escapeHtml(p.name) + '</div>' +
      '<div class="podium-price">' + priceHtml(p) + '</div>';
    podium.appendChild(item);
  });

function buildAutoCarousel(products) {
  const section = document.createElement('div');
  section.className = 'home-section';

  const header = document.createElement('div');
  header.className = 'section-header';
  const title = document.createElement('div');
  title.className = 'section-title';
  title.textContent = '🛍 ' + t.sectionAllProducts;
  header.appendChild(title);
  section.appendChild(header);

  // Genuinely scrollable track (native touch/drag works) — the card list is
  // duplicated once so wrapping scrollLeft back by exactly half the width
  // loops seamlessly. A rAF loop drifts scrollLeft at ~30px/s; user touch
  // pauses the drift (native scrolling takes over) and it always resumes
  // shortly after — with a hard safety timeout so it can never get stuck.
  const track = document.createElement('div');
  track.className = 'auto-carousel-track';
  [...products, ...products].forEach(p => track.appendChild(createCarouselCard(p)));
  section.appendChild(track);

  let halfWidth = 0;
  requestAnimationFrame(() => { halfWidth = track.scrollWidth / 2; });

  let paused = false;
  let resumeTimer = null;
  let safetyTimer = null;
  const SPEED = 0.5; // px/frame ≈ 30px/s at 60fps

  function step() {
    if (!paused && halfWidth > 0) {
      track.scrollLeft += SPEED;
      if (track.scrollLeft >= halfWidth) track.scrollLeft -= halfWidth;
    }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);

  function scheduleResume() {
    clearTimeout(resumeTimer);
    clearTimeout(safetyTimer);
    resumeTimer = setTimeout(() => { paused = false; }, 1200);
  }
  function pause() {
    paused = true;
    clearTimeout(safetyTimer);
    // Guarantees the carousel never stays frozen even if a release event is missed.
    safetyTimer = setTimeout(() => { paused = false; }, 4000);
  }

  track.addEventListener('pointerdown', pause);
  track.addEventListener('pointerup', scheduleResume);
  track.addEventListener('pointercancel', scheduleResume);
  track.addEventListener('pointerleave', scheduleResume);
  track.addEventListener('touchend', scheduleResume);

  return section;
}

let isLoadingMore = false;

async function loadProducts(append = false) {
  const grid = document.getElementById('product-grid');
  const loading = document.getElementById('catalog-loading');
  const empty = document.getElementById('catalog-empty');
  const scrollLoader = document.getElementById('scroll-loader');

  if (!append) {
    grid.innerHTML = '';
    loading.style.display = 'block';
    loading.textContent = t.loading;
    empty.style.display = 'none';
  }
  scrollLoader.style.display = 'none';
  isLoadingMore = true;

  try {
    const url = currentCat === 'all'
      ? '/api/products?page=' + currentPage
      : '/api/products?category=' + currentCat + '&page=' + currentPage;
    const data = await api(url);
    const products = data.products || [];
    totalPages = data.pages || 1;

    loading.style.display = 'none';

    if (!append && products.length === 0) {
      empty.style.display = 'block';
      document.getElementById('catalog-empty-text').textContent = t.empty;
      isLoadingMore = false;
      return;
    }

    products.forEach(p => {
      grid.appendChild(createProductCard(p));
    });

    isLoadingMore = false;
  } catch(e) {
    loading.style.display = 'none';
    isLoadingMore = false;
    console.error('Load products error:', e);
    showToast(t.errorLoad, true);
  }
}

// Infinite scroll
window.addEventListener('scroll', () => {
  if (activePage !== 'catalog' || isLoadingMore) return;
  if (currentPage + 1 >= totalPages) return;

  const scrollY = window.scrollY + window.innerHeight;
  const docHeight = document.documentElement.scrollHeight;

  if (scrollY >= docHeight - 300) {
    currentPage++;
    isLoadingMore = true;
    document.getElementById('scroll-loader').style.display = 'block';
    loadProducts(true);
  }
});
