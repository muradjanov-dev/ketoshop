  .map-locate-btn svg { width: 18px; height: 18px; color: var(--link); }
  .map-locate-btn.busy svg { animation: spin 1s linear infinite; }
  .map-modal-footer {
    flex-shrink: 0;
    padding: 12px 14px calc(12px + var(--safe-b));
    background: var(--bg);
    border-top: 1px solid var(--hairline);
  }
  .map-address {
    min-height: 40px;
    margin-bottom: 10px;
    padding: 10px 14px;
    border-radius: 14px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    font-size: 13px;
    line-height: 1.4;
  }
  .map-address.loading { color: var(--hint); }

  /* ── Cheque upload ─────────────────────────────────────────────────── */
  .cheque-page { padding: 22px 14px 24px; }
  .cheque-title { font-size: 21px; font-weight: 800; letter-spacing: -.02em; }
  .cheque-order { margin-top: 6px; font-size: 13.5px; color: var(--hint); }
  .cheque-total {
    margin: 14px 0 16px;
    padding: 16px 18px;
    border-radius: 22px;
    background: var(--hero-bg);
    color: var(--hero-text);
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -.02em;
  }
  .cheque-row {
    margin-bottom: 10px;
    padding: 12px 14px;
    border-radius: 18px;
    background: var(--surface);
    border: 1px solid var(--hairline);
  }
  .cheque-row-label {
    margin-bottom: 6px;
    font: 700 10.5px var(--font-display);
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--hint);
  }
  .cheque-row-value {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 16px;
    font-weight: 700;
    word-break: break-all;
  }
  .cheque-row-value code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 16px; letter-spacing: .06em; }
  .cheque-copy {
    flex-shrink: 0;
    height: 34px;
    padding: 0 14px;
    border: 0;
    border-radius: 999px;
    background: var(--pop);
    color: var(--on-pop);
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .cheque-copy:active { transform: scale(.94); }
  .cheque-hint { margin: 14px 2px 12px; font-size: 13px; line-height: 1.55; color: var(--hint); }
  .cheque-pick-btn {
    display: block;
    width: 100%;
    min-height: 64px;
    margin-bottom: 12px;
    padding: 14px;
    border-radius: 22px;
    border: 2px dashed var(--hint);
    background: var(--surface);
    color: var(--text);
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .cheque-pick-btn.has-file { border-style: solid; border-color: var(--leaf); background: var(--leaf-soft); }
  #cheque-preview { margin: 0 0 12px; border-radius: 18px; overflow: hidden; border: 1px solid var(--hairline); }
  #cheque-preview img { width: 100%; max-height: 320px; object-fit: contain; display: block; background: var(--surface-hi); }
  #cheque-preview .doc-row { display: flex; align-items: center; gap: 10px; padding: 14px; font-size: 14px; background: var(--surface); }
  .cheque-pay-later-btn {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    border: 0;
    background: transparent;
    color: var(--hint);
    font-size: 13px;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }

  /* ── Profile ───────────────────────────────────────────────────────── */
  .profile-content { padding: 20px 14px 24px; }
  /* Avatar inside a turning gradient ring. */
  .profile-avatar {
    position: relative;
    isolation: isolate;
    width: 104px;
    height: 104px;
    margin: 6px auto 14px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    color: var(--hint);
    background: conic-gradient(from 0deg, var(--c-sun), var(--c-orange), var(--c-berry), var(--c-lilac), var(--c-sky), var(--c-leaf), var(--c-sun));
  }
  .profile-avatar::before {
    content: '';
    position: absolute;
    inset: 4px;
    z-index: -1;
    border-radius: 50%;
    background: var(--surface);
  }
  .profile-avatar img {
    width: 92px !important;
    height: 92px !important;
    border-radius: 50%;
    object-fit: cover;
  }
  .profile-name { text-align: center; font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
  .profile-meta { margin: 4px 0 22px; text-align: center; font-size: 12.5px; color: var(--hint); }
  #profile-menu {
    padding: 4px 14px;
    border-radius: 24px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    box-shadow: var(--shadow-1);
  }
  .profile-menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 60px;
    padding: 10px 0;
    border-bottom: 1px solid var(--hairline);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .profile-menu-item:last-child { border-bottom: 0; }
  .profile-menu-item svg {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    padding: 8px;
    border-radius: 12px;
    background: var(--surface-hi);
    color: var(--link);
  }
  .profile-menu-item[onclick]::after {
    content: '';
    flex-shrink: 0;
    width: 8px;
    height: 8px;
    margin: 0 4px 0 auto;
    border-top: 2px solid var(--hint);
    border-right: 2px solid var(--hint);
    transform: rotate(45deg);
    opacity: .7;
  }
  .profile-menu-item[onclick]:active { opacity: .6; }
  .lang-toggle {
    display: flex;
    gap: 2px;
    padding: 3px;
    border-radius: 999px;
    background: var(--surface-hi);
  }
  .lang-btn {
    height: 32px;
    padding: 0 10px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--text);
    font-size: 12.5px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color .25s var(--ease), color .25s var(--ease), transform .3s var(--ease-spring);
  }
  .lang-btn:active { transform: scale(.92); }
  .lang-btn.active { background: var(--pop); color: var(--on-pop); font-weight: 800; box-shadow: var(--shadow-pop); }

  /* ── Bottom sheets (product detail, aksiya) ────────────────────────── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10000;
    align-items: flex-end;
    justify-content: center;
    background: var(--scrim);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  .modal-overlay.show { display: flex; animation: scrimIn .3s var(--ease); }
  @keyframes scrimIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    position: relative;
    width: 100%;
    max-width: 640px;
    max-height: 92vh;
    overflow-y: auto;
    border-radius: 30px 30px 0 0;
    background: var(--bg);
    box-shadow: 0 -20px 60px -20px rgba(0,0,0,.5);
    padding-bottom: var(--safe-b);
    animation: sheetUp .5s var(--ease);
    overscroll-behavior: contain;
  }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
  .modal-header {
    position: sticky;
    top: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 22px 16px 12px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
  }
  .modal-header::before {
    content: '';
    position: absolute;
    top: 8px;
    left: 50%;
    width: 40px;
    height: 5px;
    margin-left: -20px;
    border-radius: 3px;
    background: var(--hint);
    opacity: .35;
  }
  .modal-header h2 { flex: 1; min-width: 0; font-size: 16.5px; font-weight: 700; line-height: 1.25; letter-spacing: -.015em; }
  .modal-close, .modal .detail-fav-btn {
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 50%;
    background: var(--surface-hi);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    transition: transform .3s var(--ease-spring);
  }
  .modal .detail-fav-btn { font-size: 17px; }
  .modal-close:active { transform: scale(.88); }
  .modal .detail-fav-btn:active { transform: scale(1.2); }

  #detail-photo-container {
    position: relative;
    margin: 2px 14px 0;
    border-radius: 26px;
    overflow: hidden;
    background: var(--surface-hi);
  }
  #detail-photo-container:empty { display: none; }
  .modal img.detail-img, .modal video.detail-video,
  .detail-media-carousel .media-slide img, .detail-media-carousel .media-slide video {
    display: block;
    width: 100%;
    aspect-ratio: 1;
    max-height: 48vh;
    object-fit: cover;
  }
  .detail-media-carousel {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .detail-media-carousel::-webkit-scrollbar { display: none; }
  .detail-media-carousel .media-slide { flex-shrink: 0; width: 100%; scroll-snap-align: start; }
  .media-dots {
    position: absolute;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    padding: 6px 8px;
    border-radius: 999px;
    background: rgba(12,17,14,.45);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  .media-dots .dot {
    width: 6px;
    height: 6px;
    border-radius: 3px;
    background: #fff;
    opacity: .45;
    transition: width .35s var(--ease), opacity .2s;
  }
  .media-dots .dot.active { width: 18px; opacity: 1; background: var(--pop); }

  .modal .detail-body { padding: 16px 16px 10px; }
  .detail-tip {
    margin: 0 0 14px;
    padding: 12px 14px;
    border-radius: 18px;
    background: var(--pop-soft);
    border: 1px solid var(--hairline);
    font-size: 14px;
    line-height: 1.5;
  }
  .detail-tip-label {
    display: block;
    margin-bottom: 4px;
    font: 700 10.5px var(--font-display);
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--link);
  }
  .modal .detail-price { font-size: 23px; font-weight: 800; letter-spacing: -.025em; color: var(--text); }
  .modal .detail-price .keto-badge { font-family: var(--font-body); letter-spacing: 0; vertical-align: middle; }
  .modal .detail-body > div:has(> .detail-price) {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    column-gap: 6px;
  }
  .modal .detail-body > div:has(> .detail-price) .detail-price { display: contents; }
  .modal .detail-body > div:has(> .detail-price) .detail-unit { order: 2; }
  .modal .detail-body > div:has(> .detail-price) .keto-badge { order: 3; flex-basis: 100%; width: auto; max-width: max-content; }
  .modal .detail-unit { font-size: 13px; color: var(--hint); }
  .detail-saving {
    display: inline-block;
    margin-top: 8px;
    padding: 5px 11px;
    border-radius: 999px;
    background: var(--leaf-soft);
    color: var(--leaf-deep);
    font-size: 12.5px;
    font-weight: 700;
  }
  .detail-bonus {
    margin-top: 10px;
    padding: 11px 14px;
    border-radius: 16px;
    background: var(--berry-soft);
    border: 1px dashed var(--berry);
    color: var(--berry);
    font-size: 13px;
    font-weight: 700;
    line-height: 1.4;
  }
  /* Sold-out note in the detail sheet: a warm promise instead of a bare
     "not available". Only inside the product (owner, 2026-10-14) — the
     catalog card just wears the stamp — and it eases in once the sheet is
     open, so it reads as a message to this buyer. */
  .detail-soon {
    margin-top: 12px;
    padding: 14px 16px;
    border-radius: var(--soft-a);
    background: var(--leaf-soft);
    border: 1px dashed var(--leaf);
    color: var(--text);
    animation: soon-in .55s var(--ease-spring) .25s both;
  }
  .detail-soon[hidden] { display: none; }
  .detail-soon .ds-title { font: 800 15px/1.3 var(--font-display); color: var(--leaf-deep); }
  .detail-soon .ds-text { margin-top: 6px; font-size: 13.5px; line-height: 1.5; }
  @keyframes soon-in {
    from { opacity: 0; transform: translateY(10px) scale(.98); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .detail-soon { animation: none; } }
  .detail-footer.is-out .qty-controls { display: none; }
  .modal .detail-rating { margin-top: 10px; font-size: 13px; font-weight: 600; color: var(--text); }
  .modal .detail-rating:empty, .modal .detail-seller:empty { display: none; }
  .modal .detail-seller { margin-top: 4px; font-size: 12px; color: var(--hint); }
  .modal .detail-desc {
    margin-top: 14px;
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--text);
    opacity: .86;
    white-space: pre-line;
  }
  .detail-reviews { margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--hairline); }
  .reviews-heading { margin-bottom: 10px; font: 700 14px var(--font-display); letter-spacing: -.01em; }
  .reviews-empty { margin-bottom: 10px; font-size: 13px; color: var(--hint); }
  .review-item {
    margin-bottom: 8px;
    padding: 12px 14px;
    border-radius: 18px;
    background: var(--surface);
    border: 1px solid var(--hairline);
  }
  .review-item-head { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .review-name { flex: 1; font-size: 13px; font-weight: 700; }
  .review-del-btn { border: 0; background: none; font-size: 14px; padding: 2px 4px; opacity: .7; cursor: pointer; }
  .review-comment { margin-top: 6px; font-size: 13.5px; line-height: 1.5; opacity: .9; white-space: pre-line; }
  .review-date { margin-top: 6px; font-size: 11px; color: var(--hint); }
  .review-form {
    margin-top: 12px;
    padding: 14px;
    border-radius: 20px;
    background: var(--surface);
    border: 1px dashed var(--hairline);
  }
  .review-stars { margin-bottom: 10px; font-size: 26px; letter-spacing: 6px; color: var(--gold); cursor: pointer; }
  .review-form textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1.5px solid transparent;
    background: var(--surface-hi);
    color: var(--text);
    font: 500 14px/1.45 var(--font-body);
    resize: vertical;
    outline: none;
  }
  .review-form textarea:focus { border-color: var(--link); }
  .review-submit-btn {
    margin-top: 10px;
    height: 42px;
    padding: 0 18px;
    border: 0;
    border-radius: 999px;
    background: var(--btn);
    color: var(--btn-text);
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .review-submit-btn:disabled { opacity: .55; cursor: not-allowed; }

  /* Sticky buy bar: stepper and the main button side by side. */
  .modal .detail-footer {
    position: sticky;
    bottom: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px calc(14px + var(--safe-b));
    background: var(--glass);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
    border-top: 1px solid var(--hairline);
  }
  .qty-controls {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 4px;
    border-radius: 999px;
    background: var(--surface-hi);
  }
  .qty-btn {
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 50%;
    background: var(--surface);
    color: var(--text);
    font-size: 20px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform .3s var(--ease-spring);
  }
  .qty-btn:active { transform: scale(.86); }
  .qty-value { min-width: 34px; text-align: center; font-size: 16px; font-weight: 800; }
  .add-to-cart-btn {
    flex: 1;
    min-width: 0;
    height: 52px;
    padding: 0 16px;
    border: 0;
    border-radius: 999px;
    background: var(--btn);
    color: var(--btn-text);
    font-size: 15.5px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--shadow-pop);
    transition: transform .3s var(--ease-spring);
  }
  .add-to-cart-btn:active { transform: scale(.96); }
  .add-to-cart-btn:disabled { box-shadow: none; }

  /* Aksiya sheet content */
  .promo-sheet-img { width: 100%; margin-bottom: 12px; border-radius: 20px; }
  .promo-sheet-terms { margin-top: 10px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
  #promo-sheet-rules-wrap { margin-top: 18px; }
  .promo-sheet-rules { margin: 10px 0 0; padding: 0; list-style: none; }
  .promo-sheet-rules li {
    margin-bottom: 8px;
    padding: 11px 14px;
    border-radius: 16px;
    background: var(--berry-soft);
    border: 1px dashed var(--berry);
    font-size: 13.5px;
    font-weight: 600;
  }

  /* ── Orders ────────────────────────────────────────────────────────── */
  .order-card {
    position: relative;
    overflow: hidden;
    margin: 0 14px 12px;
    padding: 14px 16px 14px 20px;
    border-radius: 22px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    box-shadow: var(--shadow-1);
  }
  /* Status stripe down the left edge (progressive: needs :has()). */
  .order-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 14px;
    bottom: 14px;
    width: 4px;
    border-radius: 0 4px 4px 0;
    background: var(--hint);
  }
  .order-card:has(.order-status.pending)::before   { background: #F2A93B; }
  .order-card:has(.order-status.confirmed)::before { background: #4C8DF0; }
  .order-card:has(.order-status.ready)::before     { background: #2FB6A8; }
  .order-card:has(.order-status.shipped)::before   { background: #9B6BF2; }
  .order-card:has(.order-status.delivered)::before { background: var(--leaf); }
  .order-card:has(.order-status.cancelled)::before { background: var(--berry); }
  .order-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }
  .order-id { font-size: 16px; font-weight: 800; letter-spacing: -.02em; }
  .order-total { font-size: 15px; font-weight: 800; white-space: nowrap; }
  .order-status {
    display: inline-block;
    margin-left: 8px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    vertical-align: 2px;
    background: var(--surface-hi);
    color: var(--hint);
  }
  .order-status.pending   { background: rgba(242,169,59,.16); color: #D98A12; }
  .order-status.confirmed { background: rgba(76,141,240,.16); color: #3B7BE0; }
  .order-status.ready     { background: rgba(47,182,168,.16); color: #1F9A8D; }
  .order-status.shipped   { background: rgba(155,107,242,.16); color: #8256E0; }
  .order-status.delivered { background: var(--leaf-soft);    color: var(--leaf-deep); }
  .order-status.cancelled { background: var(--berry-soft);   color: var(--berry); }
  .order-meta { margin: 2px 0; font-size: 12px; line-height: 1.5; color: var(--hint); }
  .order-items { margin: 10px 0 4px; font-size: 13px; line-height: 1.6; }
  .order-timeline {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--hairline);
  }
  .order-timeline span {
    padding: 4px 9px;
    border-radius: 999px;
    background: var(--surface-hi);
    font-size: 11px;
    color: var(--hint);
    white-space: nowrap;
  }
  .order-cancel-btn {
    width: 100%;
    height: 44px;
    margin-top: 12px;
    border: 1px solid var(--berry);
    border-radius: 999px;
    background: transparent;
    color: var(--berry);
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .3s var(--ease-spring), background-color .2s;
  }
  .order-cancel-btn:active { transform: scale(.97); background: var(--berry-soft); }
  .order-cancel-btn:disabled { opacity: .5; cursor: default; }

  /* ── Shared states ─────────────────────────────────────────────────── */
  .loading {
    padding: 44px 20px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    background: linear-gradient(90deg, var(--hint) 20%, var(--text) 40%, var(--hint) 60%);
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: textShimmer 1.8s linear infinite;
  }
  @keyframes textShimmer { to { background-position: -250% 0; } }
  /* Empty states: the emoji floats in a slowly morphing blob. */
  .empty-state { padding: 56px 24px; text-align: center; color: var(--hint); font-size: 14.5px; line-height: 1.5; }
  .empty-state .emoji {
    width: 116px;
    height: 116px;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 46px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    box-shadow: var(--shadow-1);
    border-radius: 42% 58% 55% 45% / 48% 42% 58% 52%;
    animation: blobMorph 9s ease-in-out infinite;
  }
  @keyframes blobMorph {
    0%, 100% { border-radius: 42% 58% 55% 45% / 48% 42% 58% 52%; transform: translateY(0); }
    50%      { border-radius: 58% 42% 45% 55% / 42% 58% 42% 58%; transform: translateY(-6px); }
  }
  #page-order-success .checkout-submit-btn { margin-left: auto; margin-right: auto; }

  .scroll-loader { padding: 16px; text-align: center; font-size: 13px; color: var(--hint); }
  .scroll-loader .spinner {
    display: inline-block;
    width: 22px;
    height: 22px;
    border: 2.5px solid var(--surface-hi);
    border-top-color: var(--link);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .skeleton { position: relative; overflow: hidden; border-radius: 16px; background: var(--surface-hi); }

  /* The toast is created inline by showToast(); only its shape and
     position are restyled here so it clears the floating dock. */
  #app-toast {
    bottom: calc(var(--dock-h) + var(--dock-gap) * 2 + var(--safe-b) + 6px) !important;
    border-radius: 999px !important;
    padding: 11px 20px !important;
    font-weight: 600;
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    box-shadow: 0 12px 30px -12px rgba(0,0,0,.6);
  }

  .btn-checkout, .checkout-submit-btn, .add-to-cart-btn, .review-submit-btn { background: var(--btn-grad); color: var(--btn-text); }


  /* ── Blob motif ────────────────────────────────────────────────────────
     Uneven, hand-made corners on the things that carry the brand; plain
     pills stay on the controls people tap, so they still read as buttons.
     A few shapes slowly "breathe" (blobMorph, defined with the empty
     states); prefers-reduced-motion stops them. */
  .carousel-card, .product-card { border-radius: var(--soft-a); }
  .carousel-card:nth-child(even), .product-card:nth-child(even) { border-radius: var(--soft-b); }
  .card-img-wrap { border-radius: 22px 30px 20px 32px / 28px 22px 30px 24px; }
  .carousel-card:nth-child(even) .card-img-wrap, .product-card:nth-child(even) .card-img-wrap { border-radius: 30px 22px 32px 20px / 22px 30px 24px 30px; }
  .card-img-wrap::after { border-radius: var(--blob-a); }
  .card-img-wrap .discount-corner { border-radius: var(--blob-c); padding: 6px 10px; }
  .section-header::before { border-radius: var(--blob-b); padding: 5px 9px; }
  .cart-page-header::after, .fav-header::after, .orders-header::after,
  .checkout-header::after, .games-header::after { width: 10px; height: 9px; border-radius: var(--blob-a); }
  .podium-img, .podium-nophoto { border-radius: var(--blob-a); }
  .podium-item.rank-1 .podium-img, .podium-item.rank-1 .podium-nophoto { border-radius: var(--blob-b); }
  .customer-podium .podium-nophoto { border-radius: var(--blob-c); }
  .cart-item { border-radius: var(--soft-a); }
  .cart-item > img, .cart-item > .no-photo-sm { border-radius: var(--blob-d); }
  .perk-strip span, .detail-perks span { border-radius: 18px 24px 16px 26px / 22px 16px 24px 18px; }
  .promo-banner .pb-icon { border-radius: var(--blob-a); animation: blobMorph 9s ease-in-out infinite, giftBreathe 4s var(--ease) infinite; }
  #detail-photo-container { border-radius: 30px 40px 26px 44px / 38px 28px 42px 30px; }
  .order-card { border-radius: var(--soft-b); }
  .cheque-total { border-radius: 28px 40px 24px 44px / 36px 26px 40px 28px; }
  .detail-tip, .review-item { border-radius: 20px 26px 18px 28px / 24px 18px 26px 20px; }
  .profile-avatar, .profile-avatar::before, .profile-avatar img { border-radius: var(--blob-a) !important; }
  .profile-avatar { animation: blobMorph 11s ease-in-out infinite; }
  .profile-avatar::before { animation: blobMorph 11s ease-in-out infinite; }
  .profile-menu-item svg { border-radius: var(--blob-d); }
  /* Two soft blobs float inside the hero. */
  .hero-blob {
    position: absolute;
    z-index: -1;
    border-radius: var(--blob-a);
    background: rgba(255,255,255,.28);
    animation: blobMorph 12s ease-in-out infinite;
    pointer-events: none;
  }
  .hero-blob.one { width: 120px; height: 110px; left: -38px; top: 46%; }
  .hero-blob.two { width: 70px; height: 64px; right: 34%; bottom: -22px; animation-duration: 9s; animation-direction: reverse; }

  /* ── Bilim o'yinlari (knowledge games) ─────────────────────────────── */
  .games-rail {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding: 2px 14px 30px;
    margin-bottom: -10px;
    scrollbar-width: none;
    scroll-snap-type: x mandatory;
    scroll-padding: 0 14px;
    -webkit-overflow-scrolling: touch;
  }
  .games-rail::-webkit-scrollbar { display: none; }
  .game-tile {
    --g1: #2FA35A;
    --g2: #13AE96;
    position: relative;
    isolation: isolate;
    overflow: hidden;
    flex-shrink: 0;
    width: 196px;
    min-height: 168px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 5px;
    padding: 16px;
    border: 0;
    border-radius: 28px 36px 24px 38px / 32px 26px 36px 28px;
    background: linear-gradient(140deg, var(--g1), var(--g2));
    color: #fff;
    text-align: left;
    font-family: var(--font-body);
    cursor: pointer;
    scroll-snap-align: start;
    box-shadow: 0 16px 30px -18px var(--g1);
    transition: transform .35s var(--ease-spring);
  }
  .game-tile:nth-child(even) { border-radius: 36px 26px 38px 24px / 26px 34px 28px 36px; }
  .game-tile:active { transform: scale(.96) rotate(-1deg); }
  .game-tile[data-game="duel"]   { --g1: #FF6A1F; --g2: #FFB21E; }
  .game-tile[data-game="quiz"]   { --g1: #EC2F55; --g2: #FF7A3D; }
  .game-tile[data-game="memory"] { --g1: #7C5CF0; --g2: #2E96E0; }
  .game-tile::after {
    content: '';
    position: absolute;
    z-index: -1;
    right: -36px;
    bottom: -48px;
    width: 140px;
    height: 128px;
    border-radius: var(--blob-a);
    background: rgba(255,255,255,.16);
    animation: blobMorph 10s ease-in-out infinite;
  }
  .game-tile-icon {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 52px;
    height: 50px;
    border-radius: var(--blob-b);
    background: rgba(255,255,255,.24);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .game-tile-icon svg { width: 27px; height: 27px; }
  .game-tile-title { margin-top: 54px; font: 800 15px/1.18 var(--font-display); letter-spacing: -.01em; }
  .game-tile-sub { font-size: 12px; line-height: 1.35; opacity: .92; }
  .game-tile-best {
    align-self: flex-start;
    margin-top: 4px;
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(255,255,255,.26);
    font-size: 11px;
    font-weight: 700;
  }
  .games-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 14px 6px; }
  .games-grid .game-tile { width: auto; min-height: 184px; }
  .games-intro { padding: 0 16px 14px; color: var(--hint); font-size: 13.5px; line-height: 1.5; }
  .games-note { margin: 12px 16px 18px; color: var(--hint); font-size: 11.5px; line-height: 1.5; }
  #page-games.playing .games-header { display: none; }

  .game-shell { padding: 14px 14px 20px; }
  .game-top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .game-back {
    flex-shrink: 0;
    height: 38px;
    padding: 0 14px 0 10px;
    border-radius: 999px;
    border: 1px solid var(--hairline);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .game-title { flex: 1; min-width: 0; font: 800 15px/1.2 var(--font-display); letter-spacing: -.015em; }
  .game-score {
    flex-shrink: 0;
    padding: 6px 12px;
    border-radius: var(--blob-b);
    background: var(--pop);
    color: var(--on-pop);
    font: 800 13px var(--font-display);
    white-space: nowrap;
  }
  .game-progress { display: flex; gap: 4px; margin-bottom: 14px; }
  .game-progress i { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-hi); }
  .game-progress i.ok { background: var(--leaf); }
  .game-progress i.bad { background: var(--berry); }
  .game-progress i.now { background: var(--pop); }

  .food-card {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 26px 18px;
    border-radius: 34px 44px 30px 48px / 42px 32px 46px 34px;
    background: linear-gradient(var(--tint), var(--tint)), var(--surface);
    border: 1px solid var(--hairline);
    text-align: center;
    color: var(--text);
    animation: popIn .45s var(--ease-spring);
  }
  .food-card::before {
    content: '';
    position: absolute;
    z-index: -1;
    width: 190px;
    height: 176px;
    border-radius: var(--blob-a);
    background: var(--tone);
    opacity: .16;
    animation: blobMorph 9s ease-in-out infinite;
  }
  .food-mono {
    width: 76px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--blob-c);
    background: var(--tone);
    color: #fff;
    font: 800 30px var(--font-display);
    box-shadow: 0 14px 26px -14px var(--tone);
    transform: rotate(-6deg);
    animation: blobMorph 7s ease-in-out infinite;
  }
  .food-name { font: 800 23px/1.15 var(--font-display); letter-spacing: -.02em; text-wrap: balance; }
  .food-sub { font-size: 12.5px; font-weight: 600; color: var(--hint); }
  .game-answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .game-btn {
    height: 60px;
    border: 0;
    border-radius: 22px 26px 20px 28px / 26px 20px 28px 22px;
    color: #fff;
    font: 800 15.5px var(--font-body);
    cursor: pointer;
    transition: transform .3s var(--ease-spring), opacity .2s;
  }
  .game-btn.yes { background: linear-gradient(135deg, #46C774, #1D8446); box-shadow: 0 12px 24px -14px #1D8446; }
  .game-btn.no { background: linear-gradient(135deg, #FF5B78, #D9203F); box-shadow: 0 12px 24px -14px #D9203F; }
  .game-btn:active { transform: scale(.95); }
  .game-btn:disabled { opacity: .4; box-shadow: none; transform: none; }
  .game-reveal {
    margin-top: 14px;
    padding: 16px;
    border-radius: 24px 30px 22px 32px / 28px 22px 30px 24px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    box-shadow: var(--shadow-1);
    animation: popIn .4s var(--ease-spring);
  }
  .game-verdict {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 12px;
    border-radius: var(--blob-d);
    font-size: 12.5px;
    font-weight: 800;
  }
  .game-verdict.ok { background: var(--leaf-soft); color: var(--leaf-deep); }
  .game-verdict.bad { background: var(--berry-soft); color: var(--berry); }
  .game-carbs { margin-top: 8px; font: 800 28px var(--font-display); letter-spacing: -.03em; }
  .game-carbs small { font: 600 12.5px var(--font-body); letter-spacing: 0; color: var(--hint); }
  .game-fact { margin-top: 8px; font-size: 14px; line-height: 1.55; }
  .game-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .game-next {
    flex: 1 1 140px;
    height: 50px;
    border: 0;
    border-radius: 999px;
    background: var(--btn-grad);
    color: var(--btn-text);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--shadow-pop);
  }
  .game-shop {
    flex: 1 1 140px;
    height: 50px;
    padding: 0 16px;
    border-radius: 999px;
    border: 1.5px solid var(--leaf);
    background: var(--leaf-soft);
    color: var(--leaf-deep);
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .game-shop-wide { display: block; width: 100%; margin-top: 12px; }
  .game-next:active, .game-shop:active, .game-back:active { transform: scale(.96); }

  .duel-q { margin: 2px 4px 14px; text-align: center; font: 700 15px/1.3 var(--font-display); }
  .duel { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .duel-card { min-height: 210px; padding: 20px 10px; cursor: pointer; border-width: 2.5px; font: inherit; transition: transform .3s var(--ease-spring), border-color .2s; }
  .duel-card:nth-child(2) { border-radius: 44px 32px 48px 30px / 32px 44px 34px 46px; }
  .duel-card .food-name { font-size: 16px; }
  .duel-card .food-mono { width: 62px; height: 58px; font-size: 25px; }
  .duel-card:active { transform: scale(.96); }
  .duel-card:disabled { cursor: default; }
  .duel-card.win { border-color: var(--leaf); }
  .duel-card.lose { border-color: var(--berry); opacity: .82; }
  .duel-card.picked { transform: scale(1.02); }
  .duel-carbs { min-height: 1.2em; font: 800 19px var(--font-display); color: var(--text); }
  .duel-vs {
    position: absolute;
    z-index: 2;
    left: 50%;
    top: 50%;
    width: 50px;
    height: 46px;
    margin: -23px 0 0 -25px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--blob-a);
    background: var(--text);
    color: var(--bg);
    font: 800 13px var(--font-display);
    box-shadow: 0 0 0 4px var(--bg);
    pointer-events: none;
  }

  .quiz-q { margin: 2px 2px 16px; font: 800 18px/1.3 var(--font-display); letter-spacing: -.015em; text-wrap: balance; }
  .quiz-opts { display: grid; gap: 8px; }
  .quiz-opt {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 56px;
    padding: 10px 14px;
    border-radius: 18px 22px 16px 24px / 22px 16px 24px 18px;
    border: 1.5px solid var(--hairline);
    background: var(--surface);
    color: var(--text);
    text-align: left;
    font: 600 14.5px/1.35 var(--font-body);
    cursor: pointer;
    transition: transform .3s var(--ease-spring), border-color .2s, background-color .2s;
  }
  .quiz-opt:active { transform: scale(.98); }
  .quiz-opt:disabled { cursor: default; }
  .quiz-opt b {
    flex-shrink: 0;
    width: 32px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--blob-c);
    background: var(--surface-hi);
    font: 800 13px var(--font-display);
  }
  .quiz-opt.right { border-color: var(--leaf); background: var(--leaf-soft); }
  .quiz-opt.right b { background: var(--leaf); color: #fff; }
  .quiz-opt.wrong { border-color: var(--berry); background: var(--berry-soft); animation: gameShake .4s; }
  .quiz-opt.wrong b { background: var(--berry); color: #fff; }

  .mem-hint { padding: 0 2px 12px; }
  .mem-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; perspective: 900px; }
  .mem-card {
    position: relative;
    aspect-ratio: 1 / 1.08;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform .5s var(--ease);
  }
  .mem-card.open, .mem-card.done { transform: rotateY(180deg); }
  .mem-face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    text-align: center;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
  }
  .mem-back {
    border-radius: 24px 30px 22px 32px / 28px 22px 30px 24px;
    background: linear-gradient(140deg, #8B6CF0, #2E96E0);
    color: #fff;
    font: 800 26px var(--font-display);
    box-shadow: 0 12px 22px -14px #5A4BD0;
  }
  .mem-card:nth-child(3n+2) .mem-back { background: linear-gradient(140deg, #FF6A1F, #FFB21E); box-shadow: 0 12px 22px -14px #E05A0C; border-radius: 30px 24px 32px 22px / 22px 30px 24px 30px; }
  .mem-card:nth-child(3n) .mem-back { background: linear-gradient(140deg, #2FA35A, #13AE96); box-shadow: 0 12px 22px -14px #1D8446; }
  .mem-front {
    transform: rotateY(180deg);
    border-radius: 26px 22px 30px 24px / 24px 30px 22px 28px;
    background: var(--surface);
    border: 2px solid var(--hairline);
    color: var(--text);
    font: 700 12.5px/1.25 var(--font-body);
  }
  .mem-front.kind-product { background: var(--t-sun); font: 800 12px/1.2 var(--font-display); }
  .mem-card.done .mem-front { border-color: var(--leaf); background: var(--leaf-soft); }
  .mem-card.miss .mem-front { border-color: var(--berry); background: var(--berry-soft); }

  .game-result {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    padding: 30px 18px 22px;
    border-radius: 36px 46px 32px 50px / 44px 34px 48px 36px;
    background: var(--hero-bg);
    color: var(--hero-text);
    text-align: center;
    animation: popIn .5s var(--ease-spring);
  }
  .game-result::before {
    content: '';
    position: absolute;
    z-index: -1;
    left: 50%;
    top: 14px;
    width: 150px;
    height: 136px;
    margin-left: -75px;
    border-radius: var(--blob-a);
    background: rgba(255,255,255,.3);
    animation: blobMorph 8s ease-in-out infinite;
  }
  .game-result-big { padding-top: 22px; font: 800 52px/1 var(--font-display); letter-spacing: -.04em; }
  .game-result-msg { margin-top: 26px; font: 800 16px/1.3 var(--font-display); }
  .game-result-sub { margin-top: 6px; font-size: 13px; font-weight: 600; opacity: .85; }
  .game-result .game-actions { justify-content: center; }
  .game-again {
    height: 48px;
    padding: 0 20px;
    border: 0;
    border-radius: 999px;
    background: var(--hero-cta-bg);
    color: var(--hero-cta-fg);
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .game-other {
    height: 48px;
    padding: 0 20px;
    border-radius: 999px;
    border: 1.5px solid currentColor;
    background: transparent;
    color: inherit;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(.94) translateY(8px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes gameShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  /* ── Wider screens (Telegram Desktop) ───────────────────────────────
     Keep reading widths sane instead of stretching edge to edge. */
  @media (min-width: 700px) {
    .page { max-width: 760px; margin: 0 auto; }
    .product-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  }

  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--link);
    outline-offset: 2px;
  }

  /* Phones in battery-saver or "remove animations" mode report reduced
     motion too. The old catch-all (*, every animation .01ms) froze the whole
     site there: the spinning KETOSHOP stamp, the blobs, even the loading
     spinners (owner, 2026-10-22). Only movement across the screen stops
     now — page and sheet entrances, pop-ins, the shake, confetti, falling
     leaves. The slow decorative loops and the spinners keep going. */
  @media (prefers-reduced-motion: reduce) {
    .page.active, .modal, #detail-modal .modal,
    .food-card, .game-reveal, .game-result, .quiz-opt.wrong { animation: none !important; }
    .confetti-piece { display: none; }
    html { scroll-behavior: auto; }
    .organic-leaves { display: none; }
  }

  /* ── Features that landed on master while the redesign was in review,
     drawn in the Quyosh look. Behaviour is master's: the 10% bot-order
     card, the full-screen product screen with its big "← Orqaga"
     (2026-10-02 / 10-04), and today's recipe at the very top (10-08). */

  /* 10% for ordering through the bot — the green twin of the aksiya ticket. */
  .promo-banner.bot-discount-banner {
    margin-top: 4px;
    background: linear-gradient(115deg, #2FA35A 0%, #13AE96 100%);
  }
  .promo-banner.bot-discount-banner .pb-title { white-space: normal; }
  .promo-banner.bot-discount-banner .pb-sub { white-space: pre-line; }

  /* Product screen: full height, photo shown whole (contain), nothing
     cropped; the bottom-sheet look stays for the other sheets. */
  #detail-modal { align-items: stretch; }
  #detail-modal .modal {
    height: 100vh;
    height: 100dvh;
    max-height: none;
    border-radius: 0;
    display: flex;
    flex-direction: column;
    animation: pageIn .38s var(--ease);
  }
  #detail-modal .modal-header {
    flex-shrink: 0;
    flex-wrap: wrap;
    gap: 8px 10px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
  }
  #detail-modal .modal-header::before { display: none; }
  #detail-modal .modal-header h2 { order: 3; flex: 1 1 100%; margin: 0; font-size: 19px; }
  #detail-modal .modal-close { display: none; }
  #detail-modal .detail-fav-btn { order: 2; }
  /* flex-shrink:0 — the photo box clips (overflow:hidden), so as a flex
     item it would otherwise shrink to nothing inside the fixed-height screen. */
  #detail-modal #detail-photo-container { flex-shrink: 0; background: var(--surface); }
  #detail-modal .detail-footer { flex-shrink: 0; }
  #detail-modal .modal img.detail-img,
  #detail-modal .modal video.detail-video,
  #detail-modal .detail-media-carousel .media-slide img,
  #detail-modal .detail-media-carousel .media-slide video {
    width: 100%;
    height: auto;
    aspect-ratio: auto;
    max-height: 62vh;
    max-height: 62dvh;
    object-fit: contain;
  }
  #detail-modal .detail-body { flex: 1 0 auto; }
  #detail-modal .detail-desc { opacity: .9; overflow: visible; max-height: none; }
  .detail-back-btn {
    order: 1;
    margin-right: auto;
    min-height: 44px;
    padding: 0 18px 0 14px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 999px;
    border: 2px solid var(--btn);
    background: var(--surface);
    color: var(--btn);
    font: 700 16px var(--font-body);
    cursor: pointer;
    transition: transform .3s var(--ease-spring), background-color .2s, color .2s;
  }
  .detail-back-btn:active { transform: scale(.95); background: var(--btn); color: #fff; }
  /* Recipe sheet keeps its small × too: back on the left, × on the right. */
  #recipe-modal .detail-back-btn { order: 0; }
  #recipe-modal .modal-header h2:empty { display: none; }

  /* Today's recipe card, first thing on the home page. */
  .recipe-hero {
    margin: 10px 14px 6px;
    overflow: hidden;
    cursor: pointer;
    border-radius: 32px 40px 28px 44px / 38px 30px 42px 32px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    box-shadow: var(--shadow-2);
    transition: transform .35s var(--ease-spring);
  }
  .recipe-hero:active { transform: scale(.985); }
  .recipe-hero .rh-photo { position: relative; }
  .recipe-hero .rh-photo img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
  .recipe-hero .rh-badge {
    position: absolute;
    top: 14px;
    left: 14px;
    padding: 8px 14px;
    border-radius: var(--blob-b);
    background: var(--c-sun);
    color: var(--on-pop);
    font: 800 11.5px var(--font-display);
    letter-spacing: .02em;
    transform: rotate(-4deg);
    box-shadow: 0 8px 18px -8px rgba(80,40,0,.55);
  }
  .recipe-hero .rh-body { padding: 14px 16px 16px; }
  .recipe-hero .rh-title { font: 800 19px/1.2 var(--font-display); letter-spacing: -.02em; text-wrap: balance; color: var(--text); }
  .recipe-hero .rh-meta, .recipe-modal .rm-meta {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
  }
  .rh-meta span, .rm-meta span { padding: 5px 10px; border-radius: 999px; background: var(--t-leaf); }
  .rh-meta span:nth-child(2), .rm-meta span:nth-child(2) { background: var(--t-sun); }
  .rh-meta span:nth-child(3), .rm-meta span:nth-child(3) { background: var(--t-berry); }
  .rh-meta span:nth-child(4), .rm-meta span:nth-child(4) { background: var(--t-sky); }
  .recipe-hero .rh-cta {
    margin-top: 14px;
    height: 50px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-radius: 999px;
    background: linear-gradient(135deg, #46C774, #1D8446);
    color: #fff;
    font-size: 14.5px;
    font-weight: 800;
    box-shadow: 0 12px 24px -14px #1D8446;
  }

  /* Recipe sheet */
  .recipe-modal .rm-img {
    display: block;
    width: calc(100% - 28px);
    margin: 0 14px;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: 30px 40px 26px 44px / 38px 28px 42px 30px;
  }
  .recipe-modal .rm-ai { padding: 8px 18px 0; font-size: 11px; color: var(--hint); }
  .recipe-modal .rm-pad { padding: 10px 16px 28px; }
  .recipe-modal .rm-title { font: 800 22px/1.2 var(--font-display); letter-spacing: -.02em; text-wrap: balance; color: var(--text); }
  .recipe-modal .rm-intro { margin: 8px 0 0; font-size: 14.5px; line-height: 1.6; opacity: .9; color: var(--text); }
  .recipe-modal .rm-note { margin-top: 6px; font-size: 11px; color: var(--hint); }
  .recipe-modal h3 { margin: 24px 0 12px; font: 800 16px var(--font-display); letter-spacing: -.01em; color: var(--text); }
  .rm-ings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .rm-ing {
    padding: 12px 14px;
    border-radius: 18px 24px 16px 26px / 22px 16px 24px 18px;
    background: var(--surface);
    border: 1px solid var(--hairline);
  }
  .rm-ing-main { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--text); }
  .rm-ing-main b { font-weight: 700; }
  .rm-amt { color: var(--hint); font-weight: 600; white-space: nowrap; }
  .rm-home { margin-left: 6px; font-size: 11px; font-weight: 500; color: var(--hint); }
  .rm-prod {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 16px 20px 14px 22px / 18px 14px 20px 16px;
    background: var(--t-sun);
    cursor: pointer;
  }
  .rm-prod img, .rm-prod .rm-noimg {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    border-radius: var(--blob-d);
    object-fit: cover;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .rm-prod-name { font-size: 13px; font-weight: 700; line-height: 1.3; color: var(--text); }
  .rm-prod-price { font-size: 13px; font-weight: 800; color: var(--link); }
  .rm-prod-out { font-size: 12px; font-weight: 700; color: var(--berry); }
  .rm-why { margin-top: 6px; font-size: 12px; line-height: 1.45; color: var(--hint); }
  /* Pinned to the bottom of the sheet while the recipe scrolls under it. */
  .rm-cart-bar {
    position: sticky;
    bottom: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: var(--bg);
    border-top: 1px solid var(--hairline);
    box-shadow: 0 -10px 24px -16px rgba(0,0,0,.35);
  }
  .rm-cart-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; color: var(--text); }
  .rm-cart-info b { font-size: 12.5px; font-weight: 700; }
  .rm-cart-total { font: 800 17px/1.2 var(--font-display); letter-spacing: -.01em; }
  .rm-cart-info small { font-size: 11px; color: var(--hint); }
  .rm-cart-btn {
    flex-shrink: 0;
    padding: 12px 16px;
    border: 0;
    border-radius: 18px 22px 16px 24px / 22px 16px 24px 18px;
    background: linear-gradient(135deg, #46C774, #1D8446);
    color: #fff;
    font: 800 14.5px var(--font-body);
    cursor: pointer;
    transition: transform .3s var(--ease-spring);
  }
  .rm-cart-btn:active { transform: scale(.96); }
  .rm-cart-btn:disabled { opacity: .6; }
  .rm-steps { margin: 0; padding: 0; list-style: none; counter-reset: step; display: flex; flex-direction: column; gap: 12px; }
  .rm-steps li { position: relative; padding-left: 42px; font-size: 14px; line-height: 1.6; color: var(--text); }
  .rm-steps li::before {
    counter-increment: step;
    content: counter(step);
    position: absolute;
    left: 0;
    top: -1px;
    width: 30px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--blob-c);
    background: var(--c-orange);
    color: #fff;
    font: 800 13px var(--font-display);
  }
  .rm-steps li:nth-child(4n+2)::before { background: var(--c-leaf); }
  .rm-steps li:nth-child(4n+3)::before { background: var(--c-berry); }
  .rm-steps li:nth-child(4n)::before { background: var(--c-lilac); }
  .rm-tip {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 20px 26px 18px 28px / 24px 18px 26px 20px;
    background: var(--pop-soft);
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--text);
  }
  .rm-next { margin-top: 18px; font-size: 12px; color: var(--hint); text-align: center; }

  /* ── Soft pass (round 3) ──────────────────────────────────────────────
     Last in the sheet on purpose: it switches off every glow the earlier
     rounds added, and turns the loud gradients into flat soft tints. */
  .home-hero::before { display: none; }                 /* no sun rays */
  .home-hero::after { opacity: .12; }
  .hero-blob { background: rgba(255,255,255,.32); }
  :root[data-site-theme="night"] .hero-blob { background: rgba(255,255,255,.04); }
  .hero-stamp-core { background: var(--surface); box-shadow: 0 3px 8px -5px rgba(60,40,20,.35); }
  .home-hero-eyebrow { background: rgba(255,255,255,.45); }
  :root[data-site-theme="night"] .home-hero-eyebrow { background: rgba(255,255,255,.06); }
  .home-hero-title em { box-shadow: none; transform: rotate(-2deg); }
  .home-hero-cta { box-shadow: none; }

  .organic-leaves { opacity: .35; }

  /* Dock and chips: a calm ink pill, the colour lives in a small dot. */
  .tab-item.active { background: var(--text); color: var(--bg); box-shadow: none; }
  .tab-item.active .tab-badge { background: var(--bg); color: var(--text); }
  .cat-tab.active { background: var(--text); color: var(--bg); box-shadow: none; }
  .cat-tab.active::before { background: var(--cc); }
  .lang-btn.active { box-shadow: none; }

  .section-header::before { background: var(--t-orange); color: var(--text); }
  .home-section:nth-child(6n+2) .section-header::before { background: var(--t-leaf); }
  .home-section:nth-child(6n+3) .section-header::before { background: var(--t-berry); }
  .home-section:nth-child(6n+4) .section-header::before { background: var(--t-lilac); }
  .home-section:nth-child(6n+5) .section-header::before { background: var(--t-mint); }
  .home-section:nth-child(6n)   .section-header::before { background: var(--t-sky); }

  .card-img-wrap::after { box-shadow: none; }
  .card-img-wrap .discount-corner { box-shadow: none; }
  .btn-checkout, .checkout-submit-btn, .add-to-cart-btn, .review-submit-btn, .game-next { box-shadow: none; }

  /* Aksiya and 10% cards: soft tinted tickets with dark text. */
  .promo-banner { background: var(--t-orange); color: var(--text); border: 1px solid var(--hairline); }
  .promo-banner .pb-icon { background: var(--surface); }
  .promo-banner .pb-title { color: var(--text); }
  .promo-banner .pb-sub { opacity: .75; }
  .promo-banner .pb-arrow { border-left-color: var(--hairline); color: var(--link); }
  .promo-banner.bot-discount-banner { background: var(--t-leaf); }
  :root[data-site-theme="night"] .promo-banner,
  :root[data-site-theme="night"] .promo-banner.bot-discount-banner { background-color: var(--surface); }

  /* Game tiles: tinted cards with dark text instead of bright gradients. */
  .game-tile { --gt: var(--t-leaf); --gc: var(--c-leaf); background: linear-gradient(var(--gt), var(--gt)), var(--surface); color: var(--text); box-shadow: var(--shadow-1); border: 1px solid var(--hairline); }
  .game-tile[data-game="duel"]   { --gt: var(--t-orange); --gc: var(--c-orange); }
  .game-tile[data-game="quiz"]   { --gt: var(--t-berry);  --gc: var(--c-berry); }
  .game-tile[data-game="memory"] { --gt: var(--t-lilac);  --gc: var(--c-lilac); }
  .game-tile::after { background: var(--gc); opacity: .12; }
  .game-tile-icon { background: var(--surface); color: var(--gc); }
  .game-tile-sub { opacity: .75; }
  .game-tile-best { background: var(--surface); }
  .food-mono { box-shadow: none; }
  .game-btn.yes { background: var(--c-leaf); box-shadow: none; }
  .game-btn.no { background: var(--c-berry); box-shadow: none; }
  .mem-back, .mem-card:nth-child(3n+2) .mem-back, .mem-card:nth-child(3n) .mem-back {
    background: var(--t-lilac); color: var(--c-lilac); box-shadow: none; border: 1px solid var(--hairline);
  }
  .mem-card:nth-child(3n+2) .mem-back { background: var(--t-orange); color: var(--c-orange); }
  .mem-card:nth-child(3n) .mem-back { background: var(--t-leaf); color: var(--c-leaf); }
  .game-result::before { background: rgba(255,255,255,.3); }
  :root[data-site-theme="night"] .game-result::before { background: rgba(255,255,255,.04); }

  /* Recipe: same green, but matte. */
  .recipe-hero .rh-cta, .rm-cart-btn { background: var(--leaf-deep); box-shadow: none; }
  :root[data-site-theme="night"] .recipe-hero .rh-cta,
  :root[data-site-theme="night"] .rm-cart-btn { background: #5E8358; }
  .rm-cart-btn.go { background: var(--text); color: var(--bg); }
  .recipe-hero .rh-badge { background: var(--pop); box-shadow: none; }

  #app-toast { box-shadow: 0 8px 20px -12px rgba(0,0,0,.45); }

  /* ── Site feedback sheet (owner, 2026-10-13) ───────────────────────────
     A friendly bottom sheet: a smiling face in a soft blob, five big stars,
     an optional comment, ✕ to close and a send button. */
  .modal.site-fb {
    padding: 26px 20px calc(22px + var(--safe-b));
    text-align: center;
  }
  .site-fb-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 50%;
    background: var(--surface-hi);
    color: var(--text);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    transition: transform .3s var(--ease-spring);
  }
  .site-fb-close:active { transform: scale(.88); }
  .site-fb-emoji {
    width: 88px;
    height: 82px;
    margin: 2px auto 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    border-radius: var(--blob-a);
    background: var(--t-sun);
    animation: blobMorph 9s ease-in-out infinite;
  }
  .site-fb-title { margin: 0; font: 800 19px/1.25 var(--font-display); letter-spacing: -.02em; color: var(--text); text-wrap: balance; }
  .site-fb-sub { margin: 8px auto 16px; max-width: 30em; font-size: 13.5px; line-height: 1.5; color: var(--hint); }
  .site-fb-stars { display: flex; justify-content: center; gap: 4px; margin-bottom: 14px; }
  .site-fb-stars button {
    width: 50px;
    height: 50px;
    border: 0;
    background: none;
    font-size: 36px;
    line-height: 1;
    color: var(--hairline);
    cursor: pointer;
    transition: transform .3s var(--ease-spring), color .2s;
  }
  .site-fb-stars button.on { color: var(--gold); }
  .site-fb-stars button:active { transform: scale(1.2); }
  #site-fb-comment {
    width: 100%;
    min-height: 84px;
    padding: 12px 14px;
    border: 1.5px solid transparent;
    border-radius: 18px 22px 16px 24px / 22px 16px 24px 18px;
    background: var(--surface-hi);
    color: var(--text);
    font: 500 14px/1.45 var(--font-body);
    resize: vertical;
    outline: none;
  }
  #site-fb-comment:focus { border-color: var(--link); }
  .site-fb-send { margin-top: 12px; }
</style>
</head>
<body>

<!-- Decorative drifting leaves — populated once by initOrganicLeaves() in
     JS and run behind every theme (night/day/organic). -->
<div class="organic-leaves" id="organic-leaves" aria-hidden="true"></div>

<!-- ===== PAGE: HOME ===== -->
<div class="page active" id="page-home">
  <!-- Every product, auto-scrolling, at the very top (owner, 2026-10-02:
       "barcha mahsulotlarni saytda eng tepada"). Filled by renderHomePage. -->
  <!-- A new recipe every 2 days, first thing on the page (owner, 2026-10-08:
       "retseptni eng yuqoriga qo'shishimiz kerak"). Filled by loadRecipes. -->
  <div id="home-recipe"></div>
  <div id="home-top-carousel"></div>
  <!-- 10% for ordering through the bot (bot_discount.py) — right under the
       carousel, shown only while the discount is on. -->
  <button class="promo-banner bot-discount-banner" id="home-bot-discount" style="display:none" type="button" onclick="switchPage('catalog')">
    <span class="pb-icon">🎁</span>
    <span class="pb-body">
      <span class="pb-title" id="home-bot-discount-title"></span>
      <span class="pb-sub" id="home-bot-discount-sub"></span>
    </span>
    <span class="pb-arrow">›</span>
  </button>
  <div class="home-hero">
    <!-- Decorative rotating brand stamp; the headline wraps around it. -->
    <div class="hero-stamp" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <defs><path id="hero-stamp-ring" d="M50,50 m-38,0 a38,38 0 1,1 76,0 a38,38 0 1,1 -76,0"/></defs>
        <text><textPath href="#hero-stamp-ring" textLength="236" lengthAdjust="spacing">KETOSHOP • KETOSHOP • KETOSHOP •</textPath></text>
      </svg>
      <span class="hero-stamp-core">
        <svg viewBox="0 0 48 48">
          <path d="M24 3c-6 0-9 6-11 12-2 6-7 10-7 18a18 15 0 0 0 36 0c0-8-5-12-7-18C33 9 30 3 24 3z" fill="#2E5B24"/>
          <path d="M24 8c-4.5 0-6.5 5-8.5 10.5-2 5-5.5 8.5-5.5 14.5a14 11.5 0 0 0 28 0c0-6-3.5-9.5-5.5-14.5C30.5 13 28.5 8 24 8z" fill="#D7EC86"/>
          <circle cx="24" cy="31" r="7.5" fill="#8A5A2B"/>
          <circle cx="21.5" cy="28.5" r="2.2" fill="#B98250"/>
        </svg>
      </span>
    </div>
    <span class="hero-blob one" aria-hidden="true"></span>
    <span class="hero-blob two" aria-hidden="true"></span>
    <div class="home-hero-eyebrow" id="home-hero-eyebrow"></div>
    <div class="home-hero-title" id="home-hero-title"></div>
    <div class="home-hero-sub" id="home-hero-sub"></div>
    <button class="home-hero-cta" onclick="switchPage('catalog')" id="home-hero-cta" type="button"></button>
  </div>
  <button class="promo-banner" id="home-promo-banner" style="display:none" type="button" onclick="openPromoSheet()">
    <span class="pb-icon">🎁</span>
    <span class="pb-body">
      <span class="pb-title" id="home-promo-title"></span>
      <span class="pb-sub" id="home-promo-sub"></span>
    </span>
    <span class="pb-arrow">›</span>
  </button>
  <div class="perk-strip" id="home-perks" style="display:none"></div>
  <!-- Knowledge games teaser, filled by renderGamesTeaser(). -->
  <div class="home-section" id="home-games"></div>
  <div id="home-sections"></div>
  <div class="loading" id="home-loading" style="display:none"></div>
</div>

<!-- ===== PAGE: CATALOG ===== -->
<div class="page" id="page-catalog">
  <div class="catalog-search-bar">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="catalog-search" placeholder="...">
    </div>
  </div>
  <button class="promo-strip" id="catalog-promo-strip" style="display:none" type="button" onclick="openPromoSheet()"></button>
  <div class="perk-strip" id="catalog-perks" style="display:none"></div>
  <div class="categories" id="categories"></div>
  <div class="product-grid" id="product-grid"></div>
  <div class="loading" id="catalog-loading" style="display:none"></div>
  <div class="empty-state" id="catalog-empty" style="display:none">
    <div class="emoji">😔</div>
    <div id="catalog-empty-text"></div>
  </div>
  <div class="scroll-loader" id="scroll-loader" style="display:none"><span class="spinner"></span></div>
</div>

<!-- ===== PAGE: CART ===== -->
<div class="page" id="page-cart">
  <div class="cart-page-content">
    <div class="cart-page-header" id="cart-page-title"></div>
    <div class="perk-strip" id="cart-perks" style="display:none"></div>
    <div id="cart-items"></div>
    <div class="empty-state" id="cart-empty" style="display:none">
      <div class="emoji">🛒</div>
      <div id="cart-empty-text"></div>
    </div>
  </div>
  <div class="cart-footer" id="cart-footer" style="display:none">
    <div class="cart-saved-banner" id="cart-saved-banner" style="display:none"></div>
    <label class="keto-redeem-toggle-row" id="cart-keto-group" style="display:none;margin-bottom:10px">
      <span id="cart-keto-toggle-text"></span>
      <input type="checkbox" id="cart-keto-toggle">
    </label>
    <div class="cart-discount-line" id="cart-bot-discount-line" style="display:none"></div>
    <div id="cart-bot-discount-note" style="display:none;font-size:12px;opacity:.8;line-height:1.4;margin:2px 0 8px"></div>
    <div class="cart-discount-line" id="cart-discount-line" style="display:none"></div>
    <div class="cart-total-row">
      <span id="cart-total-label"></span>
      <span id="cart-total-value"></span>
    </div>
    <div class="cart-actions">
      <button class="btn-clear" onclick="clearCart()" id="btn-clear-cart"></button>
      <button class="btn-checkout" onclick="checkout()" id="btn-checkout"></button>
    </div>
  </div>
</div>

<!-- ===== PAGE: CHECKOUT ===== -->
<div class="page" id="page-checkout">
  <div class="checkout-content">
    <div class="checkout-header" id="checkout-title"></div>

    <div class="checkout-summary" id="checkout-summary"></div>

    <div class="checkout-form">
      <div class="form-group">
        <label id="lbl-receive-mode">Buyurtmani olish usuli</label>
        <div class="delivery-options-list" id="checkout-mode-options">
          <button type="button" class="del-opt active" data-mode="delivery" id="mode-delivery-btn">🚚 Yetkazib berish</button>
        </div>
      </div>
      <div class="form-group">
        <label id="lbl-phone"></label>
        <input type="tel" id="inp-phone" placeholder="+998901234567" autocomplete="tel">
      </div>
      <div class="form-group" id="customer-location-group">
        <label id="lbl-location"></label>
        <button class="location-btn" id="btn-get-location" onclick="getLocation()">
          <span id="location-icon">📍</span>
          <span id="location-text"></span>
        </button>
        <button class="location-btn map-pick-btn" id="btn-pick-on-map" onclick="openMapPicker()" type="button">
          <span>🗺️</span>
          <span id="map-pick-text"></span>
        </button>
        <div class="location-address-box" id="location-address-box" style="display:none">
          <label class="location-address-label" id="location-address-label" for="location-address"></label>
          <textarea class="location-address-input" id="location-address" rows="2" maxlength="500"></textarea>
        </div>
        <input type="hidden" id="inp-lat" value="">
        <input type="hidden" id="inp-lng" value="">
      </div>
      <div class="form-group" id="pickup-instructions" style="display:none"></div>
      <div class="form-group" id="delivery-group" style="display:none">
        <label id="lbl-delivery"></label>
        <div class="delivery-options-list" id="delivery-options"></div>
      </div>
      <div class="form-group">
        <label id="lbl-payment"></label>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// ===== SITE THEME =====
// Defaults to the bright day theme (owner, 2026-10-02 — it was night since
// 2026-07-13). Not tied to Telegram's own light/dark setting. Buyers can
// switch from the Profile page; a buyer who already picked a theme keeps it,
// since the choice persists via localStorage like the language does.
let siteTheme = localStorage.getItem('ketoshop_theme') || 'day';

// Populates the drifting leaf particles once — runs on every theme
// (night/day/organic), owner's request 2026-07-20. Idempotent, so
// re-running on a theme switch is a cheap no-op once populated.
// Declared *before* applySiteTheme() below, which calls it immediately —
// a `const` referenced before its own declaration line runs throws
// (temporal dead zone), which was silently crashing the entire app's
// top-level script on every load (2026-07-20 incident: fixed same-day).
const LEAF_EMOJI = ['🍃', '🌿', '🍀'];
function initOrganicLeaves() {
  const holder = document.getElementById('organic-leaves');
  if (!holder) return;
  if (holder.children.length) return; // already populated
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 10; i++) {
    const leaf = document.createElement('span');
    leaf.className = 'leaf';
    leaf.textContent = LEAF_EMOJI[i % LEAF_EMOJI.length];
    leaf.style.setProperty('--x', (Math.random() * 100) + '%');
    leaf.style.setProperty('--size', (14 + Math.random() * 14) + 'px');
    leaf.style.setProperty('--dur', (12 + Math.random() * 10) + 's');
    leaf.style.setProperty('--delay', (-Math.random() * 20) + 's');
    leaf.style.setProperty('--drift', (Math.random() * 120 - 60) + 'px');
    frag.appendChild(leaf);
  }
  holder.appendChild(frag);
  initLeafMagnetPhysics(holder);
}

// Takes the ambient leaves off the CSS keyframe and drives them from JS
// instead, so a finger press (or mouse-down, on desktop) can pull nearby
// leaves toward it like a magnet — owner's request, 2026-07-28. Runs once;
// the leaves layer stays pointer-events:none so it never intercepts taps,
// but window-level pointer listeners still see every press/touch/drag
// anywhere on the page (including on real buttons) to know where to pull.
let _leafPhysicsStarted = false;
function initLeafMagnetPhysics(holder) {
  if (_leafPhysicsStarted) return;
  _leafPhysicsStarted = true;

  const MAGNET_RADIUS = 170;   // px — reach of a single press
  const MAGNET_ACCEL = 2200;   // px/s^2 at zero distance, tapering to 0 at the radius
  const DRAG = 0.90;           // per-frame damping so a pull settles instead of orbiting forever

  const pointers = new Map(); // pointerId -> {x, y}
  window.addEventListener('pointerdown', e => pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }), { passive: true });
  window.addEventListener('pointermove', e => { if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); }, { passive: true });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(evt =>
    window.addEventListener(evt, e => pointers.delete(e.pointerId), { passive: true })
  );

  function makeLeaf(el) {
    const dur = 12 + Math.random() * 10; // seconds for one full fall cycle
    return {
      el,
      x: Math.random() * window.innerWidth,
      y: -40,
      vx: 0, vy: 0,                       // extra velocity from magnet pulls, px/s
      rot: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 50, // deg/s
      driftAmp: 30 + Math.random() * 50,
      driftFreq: 0.15 + Math.random() * 0.2,
      phase: Math.random() * Math.PI * 2,
      fallSpeed: (window.innerHeight * 1.24) / dur, // px/s baseline descent
      fadeDur: dur,
      born: Math.random() * dur, // stagger so all 10 don't cycle in sync
    };
  }
  function respawn(l) {
    l.x = Math.random() * window.innerWidth;
    l.y = -40;
    l.vx = 0; l.vy = 0;
    l.born = 0;
  }

  const leaves = Array.from(holder.querySelectorAll('.leaf')).map(el => {
    el.style.animation = 'none'; // hand control over to the rAF loop below
    return makeLeaf(el);
  });

  let lastT = null;
  function frame(now) {
    if (lastT === null) lastT = now;
    const dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;

    for (const l of leaves) {
      l.born += dt;

      for (const p of pointers.values()) {
        const dx = p.x - l.x, dy = p.y - l.y;
        const dist = Math.hypot(dx, dy) || 1;
        if (dist < MAGNET_RADIUS) {
          const accel = MAGNET_ACCEL * (1 - dist / MAGNET_RADIUS);
          l.vx += (dx / dist) * accel * dt;
          l.vy += (dy / dist) * accel * dt;
        }
      }
      l.vx *= DRAG;
      l.vy *= DRAG;

      const sway = Math.sin(l.phase + l.born * l.driftFreq * 2 * Math.PI) * l.driftAmp * dt * 0.6;
      l.x += l.vx * dt + sway;
      l.y += (l.fallSpeed + l.vy) * dt;
      l.rot += l.rotSpeed * dt;

      // Wrap horizontally so a pull off one edge doesn't strand it offscreen.
      const w = window.innerWidth;
      if (l.x < -30) l.x = w + 30;
      if (l.x > w + 30) l.x = -30;

      if (l.y > window.innerHeight + 80 || l.born > l.fadeDur) respawn(l);

      const progress = Math.min(l.born / l.fadeDur, 1);
      const opacity = progress < 0.08 ? 0.55 * (progress / 0.08)
        : progress > 0.92 ? 0.55 * ((1 - progress) / 0.08)
        : 0.55;

      l.el.style.transform = 'translate3d(' + l.x + 'px,' + l.y + 'px,0) rotate(' + l.rot + 'deg)';
      l.el.style.opacity = opacity;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// ===== BUTTERFLY =====
// A monarch that now and then flutters across the screen (owner, 2026-10-22:
// "realistik kapalak ora-orada uchib turib yoqimli effekt"). One at a time,
// it never takes a tap (pointer-events: none), and it keeps away from the
// ordering screens and from any open window. Flight and wingbeat run in one
// rAF loop, not CSS animations, on purpose: phones in battery-saver mode
// report reduced motion, and this is a slow, occasional flourish the owner
// wants every buyer to see.
const Butterfly = (() => {
  const CALM_PAGES = ['home', 'catalog', 'fav', 'profile', 'games', 'orders'];
  // 2026-10-22: doubled ("juda kam chiqyapti"), then halved back the same
  // night ("chiqishini .5 karra kamaytir").
  const FIRST_DELAY = [7000, 14000];
  const NEXT_DELAY = [40000, 80000];
  const RETRY_DELAY = [8000, 15000];
  const SVG =
    '<svg viewBox="-50 -40 100 80">' +
