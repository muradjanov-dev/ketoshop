// Catalog search
document.getElementById('catalog-search').addEventListener('input', function(e) {
  clearTimeout(searchTimeout);
  const q = e.target.value.trim();
  if (q.length < 2) {
    if (q.length === 0) selectCategory(currentCat);   // back to the tab, from page 0
    return;
  }
  searchTimeout = setTimeout(async () => {
    // Search results are one list: no catalog page may land under them.
    catalogSeq++;
    totalPages = 0;
    isLoadingMore = false;
    const grid = document.getElementById('product-grid');
    const loading = document.getElementById('catalog-loading');
    const empty = document.getElementById('catalog-empty');
    document.getElementById('scroll-loader').style.display = 'none';
    grid.innerHTML = '';
    loading.style.display = 'block';
    loading.textContent = t.loading;
    empty.style.display = 'none';

    document.querySelectorAll('#categories .cat-tab').forEach(el => el.classList.remove('active'));

    try {
      const products = await api('/api/search?q=' + encodeURIComponent(q));
      trk(() => { Trk.cat('search'); Trk.ev('search', 'catalog', q, null, products.length); });
      loading.style.display = 'none';
      if (products.length === 0) {
        empty.style.display = 'block';
        document.getElementById('catalog-empty-text').textContent = t.empty;
        return;
      }
      products.forEach(p => grid.appendChild(createProductCard(p)));
    } catch(e) {
      loading.style.display = 'none';
      console.error('Search error:', e);
      if (e && e.status === 403) {
        showToast(t.errorSessionExpired, true);
      } else {
        showToast(t.errorLoad, true);
      }
    }
  }, 400);
});

// ===== PRODUCT DETAIL =====
async function openDetail(productId, isSet = false) {
  trk(() => Trk.open(isSet ? 'set' : 'product', productId));
  // The product opens over the whole window — make sure the Mini App
  // itself is expanded too, even if the buyer had collapsed it.
  try { tg.expand(); } catch (_) {}
  try {
    const url = isSet ? '/api/set/' + productId : '/api/product/' + productId;
    const p = await api(url);
    currentProduct = p;
    qty = 1;

    document.getElementById('detail-name').textContent = p.name;
    document.getElementById('detail-back-btn').textContent = '← ' + (t.backBtn || 'Orqaga');
    // Personal advice (product_tips) — first thing under the name.
    const tipEl = document.getElementById('detail-tip');
    if (p.tip) {
      tipEl.innerHTML = '<span class="detail-tip-label">💡 ' + escapeHtml(t.tipLabel || 'Siz uchun maslahat') +
                        '</span>' + escapeHtml(p.tip);
      tipEl.style.display = 'block';
    } else {
      tipEl.style.display = 'none';
      tipEl.textContent = '';
    }
    document.getElementById('detail-price').innerHTML = priceHtml(p) + ketoBadgeHtml(p.price);

    const savingEl = document.getElementById('detail-saving');
    const dPct = p.discount_percent || 0;
    if (dPct > 0 && p.original_price && p.original_price > p.price) {
      const saved = Math.round(p.original_price - p.price);
      savingEl.textContent = '🔥 −' + dPct + '% · ' + t.youSave.replace('{amount}', formatPrice(saved));
      savingEl.style.display = 'block';
    } else {
      savingEl.style.display = 'none';
      savingEl.textContent = '';
    }

    const untilEl = document.getElementById('detail-discount-until');
    if (p.discount_percent && p.discount_until) {
      untilEl.textContent = t.discountUntil.replace('{date}', formatDiscountDate(p.discount_until));
    } else {
      untilEl.textContent = '';
    }
    const bonusEl = document.getElementById('detail-bonus');
    if (p.bonus) {
      bonusEl.textContent = p.bonus;
      bonusEl.style.display = 'block';
    } else {
      bonusEl.style.display = 'none';
    }
    document.getElementById('detail-unit').textContent = t.perUnit.replace('{unit}', p.unit);
    const descEl = document.getElementById('detail-desc');
    if (p.description) {
      descEl.innerHTML = escapeHtml(p.description).replace(/\n/g, '<br>');
    } else {
      descEl.textContent = '';
    }
    document.getElementById('qty-value').textContent = qty;
    const addBtn = document.getElementById('add-to-cart-btn');
    // Sold out — "🔔 Kelganda xabar bering". Held in other buyers' carts
    // (Savat broni) is not sold out but can be waited for the same way:
    // "⏳ Band · 🔔 Bo'shasa xabar bering" (owner, 2026-10-16) — the bot
    // writes when the hold runs out.
    if (p.out_of_stock) {
      paintRestockBtn();
    } else {
      addBtn.textContent = t.addToCart;
      addBtn.disabled = false;
      addBtn.style.opacity = '';
    }
    // No stepper for something that can't be bought yet — the note says when.
    addBtn.parentElement.classList.toggle('is-out', !!p.out_of_stock);
    const soonEl = document.getElementById('detail-soon');
    const soldOut = !!p.out_of_stock;
    soonEl.hidden = !soldOut;
    if (soldOut) {
      const v = Math.abs(Number(p.id) || 0) % SOLD_OUT_NOTES;
      document.getElementById('detail-soon-title').textContent = t['soonTitle' + v];
      document.getElementById('detail-soon-text').textContent = t['soonText' + v];
    }

    // Favorite button
    document.getElementById('detail-fav-btn').textContent = favorites[p.id] ? '❤️' : '🤍';

    // Photo + extra media carousel
    const photoContainer = document.getElementById('detail-photo-container');
    const allMedia = [];
    if (p.photo_url) {
      allMedia.push({ url: p.photo_url, type: 'photo' });
    }
    if (p.media && p.media.length > 0) {
      p.media.forEach(m => allMedia.push(m));
    }

    if (allMedia.length === 0) {
      photoContainer.innerHTML = '<div class="no-photo" style="aspect-ratio:1;border-radius:0">📦</div>';
    } else if (allMedia.length === 1) {
      const m = allMedia[0];
      if (m.type === 'video') {
        photoContainer.innerHTML = '<video class="detail-video" src="' + m.url + '" controls playsinline></video>';
      } else {
        photoContainer.innerHTML = '<img class="detail-img" src="' + m.url + '" alt="" onerror="this.style.display=\'none\'">';
      }
    } else {
      let slidesHtml = '';
      let dotsHtml = '';
      allMedia.forEach((m, i) => {
        if (m.type === 'video') {
          slidesHtml += '<div class="media-slide"><video src="' + m.url + '" controls playsinline></video></div>';
        } else {
          slidesHtml += '<div class="media-slide"><img src="' + m.url + '" alt="" onerror="this.parentElement.style.display=\'none\'"></div>';
        }
        dotsHtml += '<div class="dot' + (i === 0 ? ' active' : '') + '"></div>';
      });
      photoContainer.innerHTML =
        '<div class="detail-media-carousel" id="media-carousel">' + slidesHtml + '</div>' +
        '<div class="media-dots" id="media-dots">' + dotsHtml + '</div>';

      // Dot indicator on scroll
      const carousel = document.getElementById('media-carousel');
      const dots = document.querySelectorAll('#media-dots .dot');
      carousel.addEventListener('scroll', () => {
        const idx = Math.round(carousel.scrollLeft / carousel.clientWidth);
        dots.forEach((d, i) => d.classList.toggle('active', i === idx));
      });
    }

    // Rating
    const ratingEl = document.getElementById('detail-rating');
    if (p.review_count > 0) {
      ratingEl.textContent = '⭐ ' + t.rating.replace('{rating}', p.rating).replace('{count}', p.review_count);
    } else {
      ratingEl.textContent = '';
    }

    // Seller
    const sellerEl = document.getElementById('detail-seller');
    if (p.seller_name) {
      sellerEl.textContent = t.seller.replace('{name}', p.seller_name);
    } else {
      sellerEl.textContent = '';
    }

    document.getElementById('detail-modal').classList.add('show');
    updateBackButton();
    loadProductReviews(productId);
  } catch(e) {
    console.error('Detail error:', e);
    showToast(t.errorLoad, true);
  }
}

// ===== PRODUCT REVIEWS =====
// Public to every buyer ("keyingi userlar shu izohlarni ko'rib xulosa qila
// olishadi" — owner request 2026-07-30); admins additionally get a delete
// button per review (moderation, authorized server-side too, not just hidden).
let reviewRating = 0;

function renderReviewStars() {
  document.querySelectorAll('#review-stars span').forEach(s => {
    s.textContent = (+s.dataset.star <= reviewRating) ? '★' : '☆';
  });
}
document.querySelectorAll('#review-stars span').forEach(s => {
  s.addEventListener('click', () => { reviewRating = +s.dataset.star; renderReviewStars(); });
});

async function loadProductReviews(productId) {
  document.getElementById('reviews-heading').textContent = t.reviewsTitle;
  document.getElementById('review-comment').placeholder = t.reviewCommentPlaceholder;
  const listEl = document.getElementById('reviews-list');
  try {
    const data = await api('/api/product/' + productId + '/reviews');
    if (!data.reviews.length) {
      listEl.innerHTML = '<div class="reviews-empty">' + t.noReviews + '</div>';
    } else {
      listEl.innerHTML = data.reviews.map(r => {
        const stars = '⭐'.repeat(r.rating);
        const del = data.is_admin
          ? '<button class="review-del-btn" onclick="deleteReview(' + r.id + ',' + productId + ')" title="' + t.confirmDeleteReview + '">🗑</button>'
          : '';
        const date = r.created_at ? r.created_at.slice(0, 10) : '';
        const comment = r.comment ? '<div class="review-comment">' + escapeHtml(r.comment) + '</div>' : '';
        return '<div class="review-item"><div class="review-item-head"><span>' + stars + '</span>' +
          '<span class="review-name">' + escapeHtml(r.name) + '</span>' + del + '</div>' +
          comment + '<div class="review-date">' + date + '</div></div>';
      }).join('');
    }
    reviewRating = data.my_review ? data.my_review.rating : 0;
    document.getElementById('review-comment').value = data.my_review ? (data.my_review.comment || '') : '';
    renderReviewStars();
    document.getElementById('review-submit-btn').textContent = data.my_review ? t.updateReview : t.submitReview;
  } catch (e) {
    console.error('Reviews load error:', e);
  }
}

async function submitReview() {
  if (!currentProduct) return;
  if (reviewRating < 1) { showToast(t.reviewPickStars, true); return; }
  const comment = document.getElementById('review-comment').value.trim();
  const btn = document.getElementById('review-submit-btn');
  btn.disabled = true;
  try {
    await api('/api/product/' + currentProduct.id + '/reviews', {
      method: 'POST',
      body: JSON.stringify({ rating: reviewRating, comment }),
    });
    showToast(t.reviewSaved);
    await loadProductReviews(currentProduct.id);
  } catch (e) {
    console.error('Review submit error:', e);
    showToast(t.errorLoad, true);
  } finally {
    btn.disabled = false;
  }
}

async function deleteReview(reviewId, productId) {
  if (!confirm(t.confirmDeleteReview)) return;
  try {
    await api('/api/reviews/' + reviewId + '/delete', { method: 'POST' });
    await loadProductReviews(productId);
  } catch (e) {
    console.error('Review delete error:', e);
    showToast(t.errorLoad, true);
  }
}

function closeDetail() {
  document.getElementById('detail-modal').classList.remove('show');
  currentProduct = null;
  trk(() => Trk.close('detail'));
  updateBackButton();
}

function changeQty(delta) {
  // Whole-number quantities only — buyers were ending up with 0.5 / 1.5
  // entries because the old logic let non-kg units step in halves. Now
  // every product steps by 1 with a minimum of 1, regardless of unit.
  // currentProduct.packaged is still returned by the server but no longer
  // influences stepping.
  const stock = (currentProduct && typeof currentProduct.quantity === 'number') ? currentProduct.quantity : 50;
  const max = Math.max(1, Math.min(stock, 50));
  qty = Math.max(1, Math.min(Math.round(qty + delta), max));
  document.getElementById('qty-value').textContent = qty;
}

// ===== FAVORITES =====
function toggleFavFromDetail() {
  if (!currentProduct) return;
  toggleFav(currentProduct);
  document.getElementById('detail-fav-btn').textContent = favorites[currentProduct.id] ? '❤️' : '🤍';
}

// Sold out: the main button is "🔔 Kelganda menga xabar bering"; once asked
// it turns into the promise and stops being tappable.
function paintRestockBtn() {
  const btn = document.getElementById('add-to-cart-btn');
  const waiting = !!(currentProduct && currentProduct.restock_waiting);
  const held = !!(currentProduct && currentProduct.held_out);
  btn.textContent = waiting ? (held ? t.restockOnHeld : t.restockOn) : (held ? t.restockAskHeld : t.restockAsk);
  btn.disabled = waiting;
  btn.style.opacity = waiting ? '0.55' : '';
}

async function restockWait() {
  const p = currentProduct;
  const btn = document.getElementById('add-to-cart-btn');
  btn.disabled = true;
  // The message comes from the bot — make sure it may write to this buyer.
  await ensureBotCanWrite();
  try {
    const res = await api('/api/restock-wait', {
      method: 'POST',
      body: JSON.stringify({ product_id: p.id })
    });
    if (res.status === 'in_stock') {
      showToast(t.restockBack);
      openDetail(p.id);
      return;
    }
    p.restock_waiting = true;
    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    showToast(res.status === 'already' ? t.restockAlready : t.restockAdded);
  } catch (e) {
    console.error('Restock wait error:', e);
    showToast(t.errorLoad, true);
  }
  if (currentProduct === p) paintRestockBtn();
}

function toggleFav(product) {
  trk(() => Trk.ev('fav', 'product', product.id, favorites[product.id] ? 'remove' : 'add'));
  if (favorites[product.id]) {
    delete favorites[product.id];
  } else {
    favorites[product.id] = {
      id: product.id,
      name: product.name,
      price: product.price,
      original_price: product.original_price || product.price,
      discount_percent: product.discount_percent || 0,
      unit: product.unit,
      photo_url: product.photo_url || ''
    };
  }
  try {
    localStorage.setItem('ketoshop_fav', JSON.stringify(favorites));
  } catch (e) {
    console.warn('Favorites storage failed:', e);
    showToast(t.errorFavStorage || 'Sevimlilarni saqlab bo\'lmadi', true);
  }
}

function renderFavPage() {
  const grid = document.getElementById('fav-grid');
  const empty = document.getElementById('fav-empty');
  grid.innerHTML = '';

  const items = Object.values(favorites);
  if (items.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  items.forEach(p => {
    grid.appendChild(createProductCard(p));
  });
}

// ===== CART =====
async function addToCart() {
  if (!currentProduct) return;
  if (currentProduct.out_of_stock) {
    restockWait();
    return;
  }
  const btn = document.getElementById('add-to-cart-btn');
  try {
    if (btn) btn.disabled = true;
    const payload = currentProduct.is_set ? { set_id: currentProduct.id, quantity: qty } : { product_id: currentProduct.id, quantity: qty };
    const res = await api('/api/cart/add', {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    trk(() => Trk.ev('cart_add', currentProduct.is_set ? 'set' : 'product', currentProduct.id, Trk.from()));
    closeDetail();
    await loadCart();
    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    // Savat broni: only what no other buyer holds goes in — say if it was less.
    showToast(res && res.partial ? t.addedPartly.replace('{n}', res.added) : t.addedToCart);
  } catch(e) {
    console.error('Add to cart error:', e);
    const reason = e && e.body && e.body.error;
    const held = reason === 'held' && (e.body.waiting ? t.heldWaiting : t.heldLimit);
    showToast(held || t.errorCart, true);
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function loadCart() {
  try {
    cartData = await api('/api/cart');
    updateCartBadge();
    // If cart page is active, refresh it
    if (activePage === 'cart') renderCartPage();
  } catch(e) {
    console.error('Load cart error:', e);
  }
}

function updateCartBadge() {
  const badge = document.getElementById('cart-badge');
  const count = cartData.items.reduce((sum, i) => sum + i.quantity, 0);
  if (count > 0) {
    badge.classList.add('visible');
    badge.textContent = count % 1 === 0 ? count : count.toFixed(1);
  } else {
    badge.classList.remove('visible');
  }
}

function renderCartPage() {
  const container = document.getElementById('cart-items');
  const emptyEl = document.getElementById('cart-empty');
  const footer = document.getElementById('cart-footer');
  container.innerHTML = '';

  if (cartData.items.length === 0) {
    emptyEl.style.display = 'block';
    footer.style.display = 'none';
    return;
  }

  emptyEl.style.display = 'none';
  footer.style.display = 'block';

  cartData.items.forEach(item => {
    const el = document.createElement('div');
    el.className = 'cart-item';

    let photoHtml;
    if (item.photo_url) {
      photoHtml = '<img src="' + item.photo_url + '" alt="" onerror="this.outerHTML=\'<div class=no-photo-sm>📦</div>\'">';
    } else {
      photoHtml = '<div class="no-photo-sm">📦</div>';
    }

    const qtyDisplay = item.quantity % 1 === 0 ? item.quantity : item.quantity.toFixed(1);

    const d = item.discount_percent || 0;
    let priceMeta;
    if (d > 0 && item.original_price && item.original_price !== item.price) {
      priceMeta = qtyDisplay + ' ' + item.unit + ' &times; ' +
                  '<span class="price-old">' + formatPrice(item.original_price) + '</span>' +
                  '<span class="price-new">' + formatPrice(item.price) + '</span>' +
                  '<span class="discount-badge">-' + d + '%</span>';
      // Total saved on this line (per-unit saving × quantity).
      const savedLine = Math.round((item.original_price - item.price) * item.quantity);
      if (savedLine > 0) {
        priceMeta += '<div class="item-saving">' + t.youSave.replace('{amount}', formatPrice(savedLine)) + '</div>';
      }
    } else {
      priceMeta = qtyDisplay + ' ' + item.unit + ' &times; ' + formatPrice(item.price);
    }

    const stepper =
      '<div class="qty-stepper">' +
        '<button class="qty-step" data-action="dec" data-id="' + item.cart_id + '" aria-label="-">&minus;</button>' +
        '<span class="qty-step-value">' + qtyDisplay + '</span>' +
        '<button class="qty-step" data-action="inc" data-id="' + item.cart_id + '" aria-label="+">+</button>' +
      '</div>';

    el.innerHTML = photoHtml +
      '<div class="item-info">' +
        '<div class="item-name">' + escapeHtml(item.name) + '</div>' +
        '<div class="item-meta">' + priceMeta + ketoBadgeHtml(item.total) + '</div>' +
        stepper +
      '</div>' +
      '<div class="item-price">' + formatPrice(item.total) + '</div>' +
      '<button class="remove-btn" data-id="' + item.cart_id + '">&times;</button>';
    container.appendChild(el);
  });

  // Free aksiya bonuses, computed server-side from what's in the cart. Their
  // own titled block under the paid items, each showing the shelf price
  // struck through beside "BEPUL" — a crossed-out number reads as money
  // saved, where a bare "free" reads as worthless.
  const bonuses = cartData.bonuses || [];
  if (bonuses.length) {
    const box = document.createElement('div');
    box.className = 'cart-gifts';

    const totalValue = cartData.bonuses_value || 0;
    let html = '<div class="cart-gifts-head"><span>' + t.cartGiftsTitle + '</span>';
    if (totalValue > 0) {
      html += '<span class="cart-gifts-total">' +
              t.cartGiftsValue.replace('{v}', formatPrice(totalValue)) + '</span>';
    }
    html += '</div>';

    bonuses.forEach(b => {
      const pic = b.photo_url
        ? '<img src="' + b.photo_url + '" alt="" onerror="this.outerHTML=\'<div class=cb-icon>🎁</div>\'">'
        : '<div class="cb-icon">🎁</div>';
      const priceBlock = b.value > 0
        ? '<span class="cb-was">' + formatPrice(b.value) + '</span><span class="cb-free">0</span>'
        : '<span class="cb-free">0</span>';
      html +=
        '<div class="cart-bonus">' + pic +
          '<div class="cb-body">' +
            '<div class="cb-name">' + escapeHtml(b.name) + ' — ' + escapeHtml(b.amount) + ' ' + escapeHtml(b.unit) + '</div>' +
            '<div class="cb-tag">🎁 ' + t.cartBonusFree + '</div>' +
          '</div>' +
          '<div class="cb-price">' + priceBlock + '</div>' +
        '</div>';
    });
    box.innerHTML = html;
    container.appendChild(box);
  }

  // "Add one more and the gift is yours" — only for products already in the
  // cart, so it's a heads-up rather than an ad. Tapping adds one straight in.
  const misses = cartData.near_misses || [];
  if (misses.length) {
    const nudge = document.createElement('div');
    nudge.className = 'cart-nudge';
    nudge.innerHTML = '<div class="cart-nudge-head">' + t.cartNudgeTitle + '</div>' +
      misses.map(m =>
        '<div class="cart-nudge-row"><span>' +
          t.cartNudgeRow
            .replace('{n}', escapeHtml(m.needed))
            .replace('{u}', escapeHtml(m.needed_unit))
            .replace('{p}', escapeHtml(m.name || ''))
            .replace('{b}', escapeHtml(m.bonus)) +
        '</span>' +
        '<button class="cart-nudge-add" data-add="' + m.product_id + '" data-qty="' + m.needed + '">' +
          t.cartNudgeAdd + '</button></div>'
      ).join('');
    container.appendChild(nudge);

    nudge.querySelectorAll('.cart-nudge-add').forEach(btn => {
      btn.onclick = async () => {
        btn.disabled = true;
        try {
          await api('/api/cart/add', {
            method: 'POST',
            body: JSON.stringify({
              product_id: parseInt(btn.dataset.add),
              quantity: parseFloat(btn.dataset.qty) || 1,
            }),
          });
          trk(() => Trk.ev('cart_add', 'product', btn.dataset.add, 'cart_nudge'));
          await loadCart();
        } catch (err) {
          console.error(err);
          btn.disabled = false;
        }
      };
    });
  }

  // 111 000 so'm gift campaign: "add X more and get Eritritol 100gr free".
  // Server sends plain text (tags stripped) only while the cart is below the
  // threshold; once it qualifies the gift is listed in the 🎁 block above.
  if (cartData.gift_hint) {
    const gift = document.createElement('div');
    gift.className = 'cart-nudge';
    gift.innerHTML = '<div class="cart-nudge-row"><span>' + escapeHtml(cartData.gift_hint) + '</span></div>';
    container.appendChild(gift);
  }

  // "Yana 50 000 so'm — sirli sovg'a", then the same for free delivery. Both
  // come from the server already measured against this exact cart, so the
  // buyer is never told two different sums for the same basket.
  [cartData.mystery_hint, cartData.delivery_hint].forEach(line => {
    if (!line) return;
    const el = document.createElement('div');
    el.className = 'cart-nudge';
    el.innerHTML = '<div class="cart-nudge-row"><span>' + escapeHtml(line) + '</span></div>';
    container.appendChild(el);
  });

  // Remove buttons
  container.querySelectorAll('.remove-btn').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      try {
        btn.disabled = true;
        await api('/api/cart/remove', {
          method: 'POST',
          body: JSON.stringify({ cart_id: parseInt(btn.dataset.id) })
        });
        await loadCart();
      } catch(err) {
        console.error(err);
        btn.disabled = false;
      }
    };
  });

  // Quantity steppers — increment/decrement with stock + step awareness.
  // We disable both buttons during the API roundtrip so a flurry of taps
  // can't outrun the backend and create a stale UI.
  container.querySelectorAll('.qty-step').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const cartId = parseInt(btn.dataset.id);
      const item = cartData.items.find(x => x.cart_id === cartId);
      if (!item) return;
      // Always step by 1. Math.round() snaps any pre-existing fractional
      // quantity (left over from before integer-only was enforced) to the
      // nearest whole number so the first tap brings the line back onto
      // a clean integer grid.
      const delta = btn.dataset.action === 'inc' ? 1 : -1;
      let next = Math.round((item.quantity || 0) + delta);
      // Clamp to stock so we don't even bother the server with overshoot.
      if (typeof item.available === 'number' && next > item.available) {
        next = Math.floor(item.available);
      }
      if (next === item.quantity) return;
      const peers = btn.parentElement.querySelectorAll('.qty-step');
      peers.forEach(b => b.disabled = true);
      try {
        await api('/api/cart/update', {
          method: 'POST',
          body: JSON.stringify({ cart_id: cartId, quantity: next })
        });
        await loadCart();
      } catch (err) {
        console.error('Cart update error:', err);
        peers.forEach(b => b.disabled = false);
        showToast(t.errorCart || 'Error', true);
      }
    };
  });

  renderCartTotal();
  initCartKetoUI();

  // Total saved across all discounted lines — a celebratory banner.
  const savedTotal = cartData.items.reduce((s, it) =>
    (it.original_price && it.original_price > it.price)
      ? s + (it.original_price - it.price) * it.quantity
      : s, 0);
  const savedBanner = document.getElementById('cart-saved-banner');
  if (savedTotal > 0) {
    savedBanner.textContent = t.cartSaved.replace('{amount}', formatPrice(Math.round(savedTotal)));
    savedBanner.style.display = 'flex';
  } else {
    savedBanner.style.display = 'none';
  }

}

// Recompute + display the cart page's total line, folding in whatever Keto
// discount is currently selected (either toggled here or carried over from
// the checkout page). No delivery fee at this stage — that's only known
// once a delivery method is picked on checkout, so the cap here is just the
// product subtotal (checkout's own redeem UI re-clamps against the final
// total once the fee is known).
// 10% off for ordering through the bot by yourself (bot_discount.py) —
// worked out server-side per cart, 0 when it doesn't apply (admins, off).
function botDiscountAmount() {
  return (cartData.bot_discount && cartData.bot_discount.amount) || 0;
}

// What actually comes off at checkout. An admin's cart shows the customer's
// −10% (`preview`) but their own order is full price (owner, 2026-10-08).
function botCheckoutOff() {
  const b = cartData.bot_discount;
  return (b && !b.preview && b.amount) || 0;
}

function botDiscountLineHtml() {
  const off = botDiscountAmount();
  if (!off) return '';
  return '<span>' + escapeHtml(cartData.bot_discount.label) + '</span><span>-' + formatPrice(off) + ' UZS</span>';
}

function renderCartTotal() {
  const botOff = botDiscountAmount();
  const botLine = document.getElementById('cart-bot-discount-line');
  if (botLine) {
    botLine.innerHTML = botDiscountLineHtml();
    botLine.style.display = botOff ? 'flex' : 'none';
  }
  const botNote = document.getElementById('cart-bot-discount-note');
  if (botNote) {
    const note = (cartData.bot_discount && cartData.bot_discount.note) || '';
    botNote.textContent = note;
    botNote.style.display = note ? 'block' : 'none';
  }
  const payable = Math.max(0, cartData.total - botOff);
  const redeem = keto.enabled ? Math.min(keto.redeem || 0, Math.round(cartData.total - botCheckoutOff())) : 0;
  const discountLine = document.getElementById('cart-discount-line');
  if (redeem > 0) {
    discountLine.innerHTML = '<span>' + t.ketoRedeemLine + '</span><span>-' + formatPrice(redeem) + ' UZS</span>';
    discountLine.style.display = 'flex';
  } else {
    discountLine.style.display = 'none';
  }
  document.getElementById('cart-total-value').textContent = formatPrice(Math.max(0, payable - redeem)) + ' UZS';
}

// "Pay with Keto" toggle on the cart page itself (owner request, 2026-08-12):
// a one-tap, all-or-nothing version of the checkout page's adjustable Keto
// discount — flip it on and the full balance (capped at the cart subtotal)
// is applied immediately, so buyers see the amount still owed before they
// even reach checkout. The choice carries into checkout via the shared
// `keto` object; initKetoRedeemUI() there picks it up instead of resetting it.
async function initCartKetoUI() {
  const group = document.getElementById('cart-keto-group');
  const toggle = document.getElementById('cart-keto-toggle');
  const toggleText = document.getElementById('cart-keto-toggle-text');

  try {
    const status = await api('/api/keto/status');
    keto.enabled = !!status.enabled;
    keto.balance = status.balance || 0;
  } catch (e) {
    keto.enabled = false;
    keto.balance = 0;
  }

  if (!keto.enabled || keto.balance <= 0) {
    keto.redeem = 0;
    group.style.display = 'none';
    renderCartTotal();
    return;
  }

  group.style.display = '';
  toggle.checked = (keto.redeem || 0) > 0;
  toggleText.innerHTML = ketoSwitchHtml(t.cartKetoLabel, keto.redeem || 0);

  toggle.onchange = () => {
    keto.redeem = toggle.checked ? Math.min(keto.balance, Math.round(cartData.total - botCheckoutOff())) : 0;
    toggleText.innerHTML = ketoSwitchHtml(t.cartKetoLabel, keto.redeem);
    renderCartTotal();
  };
}

async function clearCart() {
  const btn = document.getElementById('btn-clear-cart');
  if (btn) btn.disabled = true;
  try {
    await api('/api/cart/clear', { method: 'POST' });
    await loadCart();
  } catch (e) {
    console.error(e);
  } finally {
    if (btn) btn.disabled = false;
  }
}

function checkout() {
  if (cartData.items.length === 0) return;
  switchPage('checkout');
}

function renderCheckoutPage() {
  // Title
  document.getElementById('checkout-title').textContent = t.checkoutTitle;
  document.getElementById('lbl-phone').textContent = t.lblPhone;
  document.getElementById('lbl-receive-mode').textContent = t.lblReceiveMode;
  document.getElementById('mode-delivery-btn').textContent = t.modeDelivery;
  const pickupBtn = document.querySelector('#checkout-mode-options [data-mode="pickup"]');
  if (pickupBtn) pickupBtn.textContent = t.modePickup;
  document.getElementById('lbl-location').textContent = t.lblLocation;
  document.getElementById('location-text').textContent = t.btnGetLocation;
  document.getElementById('lbl-payment').textContent = t.lblPayment;
  document.getElementById('pay-cash').textContent = t.payCash;
  document.getElementById('pay-online').textContent = t.payOnline;
  loadPickupConfig();
  // Re-render delivery options if a selection has been shown for this checkout
  const deliveryGroup = document.getElementById('delivery-group');
  if (deliveryGroup && deliveryGroup.style.display !== 'none') {
    const lat = parseFloat(document.getElementById('inp-lat').value);
    const lng = parseFloat(document.getElementById('inp-lng').value);
    if (!isNaN(lat) && !isNaN(lng)) {
      const prev = document.querySelector('.del-opt[data-method].active')?.dataset.method;
      renderDeliveryOptions(isInTashkent(lat, lng));
      if (prev) {
        const restored = document.querySelector('.del-opt[data-method="' + prev + '"]');
        if (restored) {
          document.querySelectorAll('.del-opt').forEach(b => b.classList.remove('active'));
          restored.classList.add('active');
        }
      }
    }
  }
  document.getElementById('btn-submit-order').textContent = t.submitOrder;
  document.getElementById('btn-checkout-back').textContent = t.backToCart;
  document.getElementById('btn-continue-shopping').textContent = t.continueShopping;

  // Summary
  const summary = document.getElementById('checkout-summary');
  let html = '';
  cartData.items.forEach(item => {
    const qtyDisplay = item.quantity % 1 === 0 ? item.quantity : item.quantity.toFixed(1);
    html += '<div class="summary-item">' + escapeHtml(item.name) +
      ' <span class="s-qty">' + qtyDisplay + ' ' + item.unit + ' × ' + formatPrice(item.price) + ' = ' + formatPrice(item.total) + '</span></div>';
  });
  summary.innerHTML = html;

  // Total
  refreshCheckoutTotal();

  // Payment option toggles
  document.querySelectorAll('.pay-opt').forEach(btn => {
    btn.onclick = () => {
      if (btn.disabled) return;  // honor the Yandex-Taxi cash lock
      document.querySelectorAll('.pay-opt').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
  });

  initKetoRedeemUI();

  // Remove old errors
  document.querySelectorAll('.checkout-error').forEach(e => e.remove());
}

// Keto-as-discount at checkout — hidden entirely unless the owner has
// switched it on (off by default) AND this buyer has a spendable balance.
// When hidden, nothing about the checkout flow changes from today.
async function initKetoRedeemUI() {
  const group = document.getElementById('keto-redeem-group');
  const toggle = document.getElementById('keto-redeem-toggle');
  const amountInput = document.getElementById('keto-redeem-amount');
  const toggleText = document.getElementById('keto-redeem-toggle-text');

  // Whatever was chosen on the cart page's "pay with Keto" toggle (0 if
  // none) — re-clamped below once the delivery fee (if any) is known,
  // instead of being silently discarded on arrival here.
  const carriedRedeem = keto.redeem || 0;
  try {
    const status = await api('/api/keto/status');
    keto.enabled = !!status.enabled;
    keto.balance = status.balance || 0;
  } catch (e) {
    keto.enabled = false;
    keto.balance = 0;
  }

  if (!keto.enabled) {
    keto.redeem = 0;
    group.style.display = 'none';
    toggle.checked = false;
    amountInput.style.display = 'none';
    refreshCheckoutTotal();
    return;
  }

  amountInput.style.display = 'none';
  group.style.display = '';

  if (keto.balance <= 0) {
    // Nothing to spend yet — say so instead of hiding the row, so the buyer
    // knows the coins exist and where they will appear.
    keto.redeem = 0;
    toggle.checked = false;
    toggle.disabled = true;
    toggleText.innerHTML = '<span class="keto-switch-text"><span>' + t.ketoRedeemLabel +
      '</span><span class="keto-switch-sub">' + t.ketoSwitchEmpty + '</span></span>';
    refreshCheckoutTotal();
    return;
  }
  toggle.disabled = false;

  function currentCap() {
    const method = pickupMode ? 'pickup' : document.querySelector('.del-opt[data-method].active')?.dataset.method;
    const fee = deliveryFee(method);
    return Math.min(keto.balance, Math.round(cartData.total - botCheckoutOff() + fee));
  }

  // One switch, no typing (owner, 2026-09-18): flipping it on spends as much
  // of the balance as this order can take and the total is recomputed at once.
  amountInput.style.display = 'none';
  keto.redeem = carriedRedeem > 0 ? Math.min(carriedRedeem, currentCap()) : 0;
  toggle.checked = keto.redeem > 0;
  refreshCheckoutTotal();

  const paint = () => { toggleText.innerHTML = ketoSwitchHtml(t.ketoRedeemLabel, keto.redeem || 0); };
  paint();
  toggle.onchange = () => {
    keto.redeem = toggle.checked ? currentCap() : 0;
    paint();
    refreshCheckoutTotal();
  };
}

// A fix less precise than this (cell tower / IP guess, often "the middle of
// Tashkent") is only a starting point: the buyer finishes it on the map.
const LOCATION_PRECISE_M = 300;

// Where the buyer is now → {lat, lng, acc} or null. Telegram's own
// LocationManager first (Bot API 8.0: Telegram asks for access itself and it
// works where the WebView blocks navigator.geolocation), then the browser API.
function getDeviceLocation(timeoutMs) {
  return new Promise(resolve => {
    let done = false;
    let usedBrowser = false;
    const finish = (pos) => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      clearTimeout(lmTimer);
      resolve(pos);
    };
    const timer = setTimeout(() => finish(null), timeoutMs);
    let lmTimer = null;
    const browser = () => {
      if (done || usedBrowser) return;
      usedBrowser = true;
      if (!navigator.geolocation) { finish(null); return; }
      navigator.geolocation.getCurrentPosition(
        p => finish({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
        err => { console.warn('Geolocation error:', err); finish(null); },
        { enableHighAccuracy: true, timeout: timeoutMs }
      );
    };
    const lm = tg.LocationManager;
    if (!lm || typeof tg.isVersionAtLeast !== 'function' || !tg.isVersionAtLeast('8.0')) {
      browser();
      return;
    }
    const ask = () => {
      clearTimeout(lmTimer);
      if (done || usedBrowser) return;
      if (!lm.isLocationAvailable) { browser(); return; }
      try {
        lm.getLocation(d => d
          ? finish({ lat: d.latitude, lng: d.longitude, acc: d.horizontal_accuracy })
          : browser());
      } catch (_) { browser(); }
    };
    // An old client never answers init — don't wait on it forever.
    lmTimer = setTimeout(browser, 4000);
    try { if (lm.isInited) ask(); else lm.init(ask); } catch (_) { browser(); }
  });
}

function _isPreciseFix(pos) {
  return !(pos.acc > LOCATION_PRECISE_M);  // unknown accuracy counts as precise
}

async function getLocation() {
  const btn = document.getElementById('btn-get-location');
  const textEl = document.getElementById('location-text');
  btn.disabled = true;
  textEl.textContent = t.btnLocationLoading;

  const pos = await getDeviceLocation(20000);
  btn.disabled = false;
  if (!pos) {
    textEl.textContent = document.getElementById('inp-lat').value ? t.btnLocationSet : t.btnGetLocation;
    showToast(t.errorLocation, true, 4500);
    return;
  }
  if (!_isPreciseFix(pos)) {
    // Only a rough area — let the buyer put the pin on their house.
    textEl.textContent = document.getElementById('inp-lat').value ? t.btnLocationSet : t.btnGetLocation;
    openMapPicker(pos);
    return;
  }
  setSelectedLocation(pos.lat, pos.lng);
}

// Centralized "this is the chosen delivery point" — used by both the
// current-location button and the map picker so they stay in sync.
async function setSelectedLocation(lat, lng) {
  document.getElementById('inp-lat').value = lat;
  document.getElementById('inp-lng').value = lng;
  const btn = document.getElementById('btn-get-location');
  const textEl = document.getElementById('location-text');
  textEl.textContent = t.btnLocationSet;
  btn.classList.add('set');
  document.getElementById('location-icon').textContent = '✅';
  renderDeliveryOptions(isInTashkent(lat, lng));

  // Reverse geocode only as a *suggestion*. OSM coverage in Uzbekistan is
  // sparse, so Nominatim often snaps to a far road — the buyer must be able
  // to correct it. The picked coordinates (inp-lat/lng) are what the courier
  // navigates to; this editable text is the human-readable note alongside.
  const box = document.getElementById('location-address-box');
  const labelEl = document.getElementById('location-address-label');
  const addrEl = document.getElementById('location-address');
  box.style.display = 'block';
  labelEl.textContent = t.lblAddressEdit;
  addrEl.placeholder = t.mapPickerLoading;
  // Each new point reseeds the suggestion (picking a new spot ⇒ new address).
  const seq = (setSelectedLocation._seq = (setSelectedLocation._seq || 0) + 1);
  addrEl.value = '';
  try {
    const data = await api('/api/geocode?lat=' + lat + '&lng=' + lng);
    if (seq !== setSelectedLocation._seq) return;  // a newer pick superseded us
    addrEl.value = data.address || '';
  } catch (_) {
    if (seq !== setSelectedLocation._seq) return;
  }
  addrEl.placeholder = t.addressEditPlaceholder;
}

// ===== MAP PICKER =====
let _leafletMap = null;
let _mapGeocodeTimer = null;
const _TASHKENT_CENTER = [41.3111, 69.2797];
// The map opens on the Tashkent centre when there is no saved point and no
// GPS fix yet. That spot is a placeholder, not an answer: until the buyer
// drags the map or a precise GPS fix lands, it can't be confirmed (real
// orders landed on the city centre this way, 2026-10-21).
let _mapPointChosen = false;
let _mapGpsSeq = 0;

// Yandex tile servers — only one provider here, intentionally. Yandex
// renders tiles in EPSG:3395 (Elliptical Mercator, WGS84 ellipsoid). The
// Leaflet map below is therefore configured with crs: L.CRS.EPSG3395 so
// the visual map and the lat/lng we read back from getCenter() line up.
//
// We previously fell back to CartoDB/OSM here — but those providers serve
// EPSG:3857 (Spherical Mercator) tiles. Mixing them with a 3395-CRS map
// causes a ~5–10 km north–south displacement at Tashkent's latitude:
// the buyer would visually pick Chorsu but the coords would resolve to
// the Quyichirchiq area. We dropped the fallbacks rather than ship that
// silent address-corruption bug; if Yandex tiles fail to load we show
// a clear error instead.
const _TILE_PROVIDERS = [
  {
    url: 'https://core-renderer-tiles.maps.yandex.net/tiles?l=map&v=21.06.02&x={x}&y={y}&z={z}&scale=1&lang=ru_RU',
    maxZoom: 19,
    subdomains: '',
  },
];

function _setMapError(msg) {
  const el = document.getElementById('map-error');
  if (!el) return;
  if (msg) {
    el.textContent = msg;
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

function _addTileLayer(map, providerIdx) {
  const p = _TILE_PROVIDERS[providerIdx];
  if (!p) return null;
  const opts = { maxZoom: p.maxZoom };
  if (p.subdomains) opts.subdomains = p.subdomains;
  // window.L explicitly — our top-level `const L = {uz: ..., ru: ...}`
  // locale table shadows Leaflet's global L in this script.
  const layer = window.L.tileLayer(p.url, opts);
  let errored = false;
  layer.on('tileerror', () => {
    if (errored) return;
    errored = true;
    if (providerIdx + 1 < _TILE_PROVIDERS.length) {
      console.warn('Tile provider', providerIdx, 'failed — trying next');
      map.removeLayer(layer);
      _addTileLayer(map, providerIdx + 1);
    } else {
      _setMapError('Xaritani yuklab bo\'lmadi. Tarmoq aloqasini tekshiring.');
    }
  });
  layer.addTo(map);
  return layer;
}

// `rough` — a low-accuracy fix from getLocation(): start there, but the
// buyer still has to drag the pin onto their house.
function openMapPicker(rough) {
  trk(() => Trk.ev('checkout', 'checkout', 'map'));
  if (!window.L || typeof window.L.map !== 'function') {
    // Leaflet itself didn't load. Show a clear in-app message rather than
    // a toast, since the user explicitly asked for this feature.
    document.getElementById('map-modal-title').textContent = t.mapPickerTitle;
    document.getElementById('map-modal').classList.add('show');
    updateBackButton();
    _setMapError('Leaflet kutubxonasi yuklanmadi (/static/leaflet.js). Serverni qayta ishga tushirish kerak.');
    return;
  }
  document.getElementById('map-modal-title').textContent = t.mapPickerTitle;
  document.getElementById('map-confirm-btn').textContent = t.mapPickerConfirm;
  document.getElementById('map-locate-text').textContent = t.mapPickerMyLocation;
  document.getElementById('map-address').textContent = t.mapPickerLoading;
  document.getElementById('map-modal').classList.add('show');
  updateBackButton();
  _setMapError(null);

  // Pick a sensible starting center: previously-saved coords > current GPS > Tashkent.
  const savedLat = parseFloat(document.getElementById('inp-lat').value);
  const savedLng = parseFloat(document.getElementById('inp-lng').value);
  const hasSaved = !isNaN(savedLat) && !isNaN(savedLng);
  let startCenter = _TASHKENT_CENTER;
  let startZoom = 12;
  if (rough) {
    startCenter = [rough.lat, rough.lng];
    startZoom = 15;
  } else if (hasSaved) {
    startCenter = [savedLat, savedLng];
    startZoom = 16;
  }
  _cancelMapLocate();  // a fix still pending from the last opening must not land here
  _mapPointChosen = !rough && hasSaved;
  _refreshMapConfirm();

  // Two rAFs to let the modal switch from display:none to display:flex,
  // run flex layout, and report a real height before we hand the container
  // to Leaflet. (One frame is usually enough on Chromium; iOS WKWebView
  // sometimes needs the extra tick.)
  requestAnimationFrame(() => requestAnimationFrame(() => {
    try {
      if (!_leafletMap) {
        // crs: EPSG:3395 is mandatory — Yandex tiles are rendered in this
        // projection (WGS84 ellipsoid). Without it Leaflet treats them as
        // 3857 (spherical) and getCenter() returns coords ~5–10 km off
        // from where the buyer visually picked. See _TILE_PROVIDERS notes.
        _leafletMap = window.L.map('map-canvas', {
          crs: window.L.CRS.EPSG3395,
          zoomControl: true,
          attributionControl: false,
        }).setView(startCenter, startZoom);
        _addTileLayer(_leafletMap, 0);
        _leafletMap.on('moveend', _onMapMoveEnd);
        // A drag is the buyer choosing the spot: it unlocks the confirm
        // button, and a GPS fix that arrives later must not yank the map.
        _leafletMap.on('dragstart', () => {
          _cancelMapLocate();
          _mapPointChosen = true;
          _refreshMapConfirm();
        });
      } else {
        _leafletMap.setView(startCenter, startZoom);
      }
      // Force Leaflet to recompute pixel dimensions now that the modal is
      // actually visible — without this, tiles draw to a 0×0 buffer and
      // the map appears blank. Repeat once with a small delay to catch
      // the case where the first frame still had transitional layout.
      _leafletMap.invalidateSize();
      setTimeout(() => _leafletMap && _leafletMap.invalidateSize(), 250);
      _onMapMoveEnd();

      // No point yet — recenter on the buyer's GPS (better than leaving them
      // in the middle of Tashkent). A rough fix already came from GPS.
      if (!_mapPointChosen && !rough) _locateOnMap(false);
    } catch (e) {
      console.error('Map init failed:', e);
      _setMapError('Xarita ishga tushmadi: ' + (e && e.message ? e.message : e));
    }
  }));
}

function closeMapPicker() {
  document.getElementById('map-modal').classList.remove('show');
  updateBackButton();
}

function _cancelMapLocate() {
  _mapGpsSeq++;
  const btn = document.getElementById('map-locate-btn');
  if (btn) btn.classList.remove('busy');
}

function _refreshMapConfirm() {
  const btn = document.getElementById('map-confirm-btn');
  if (btn) btn.disabled = !_mapPointChosen;
}

// Centre the picker on the buyer's GPS fix. `manual` = they pressed
// «Mening joylashuvim», so a failure gets a toast; the silent try on opening
// stays quiet. A rough fix only moves the map — the buyer drags the rest.
async function _locateOnMap(manual) {
  const seq = ++_mapGpsSeq;
  const btn = document.getElementById('map-locate-btn');
  if (btn) btn.classList.add('busy');
  const pos = await getDeviceLocation(20000);
  if (seq !== _mapGpsSeq) return;  // dragged or reopened meanwhile
  if (btn) btn.classList.remove('busy');
  if (!_leafletMap || !_isModalOpen('map-modal')) return;
  if (!pos) {
    if (manual) showToast(t.errorLocation, true, 4500);
    return;
  }
  const precise = _isPreciseFix(pos);
  if (precise) _mapPointChosen = true;
  _leafletMap.setView([pos.lat, pos.lng], precise ? 17 : 15);
  _refreshMapConfirm();
}

function _onMapMoveEnd() {
  if (!_leafletMap) return;
  const addrEl = document.getElementById('map-address');
  if (!_mapPointChosen) {
    // Don't put a real-looking street under a pin nobody placed — that is
    // what made buyers confirm the city centre.
    clearTimeout(_mapGeocodeTimer);
    addrEl.classList.remove('loading');
    addrEl.textContent = t.mapPickerHint;
    return;
  }
  const c = _leafletMap.getCenter();
  addrEl.classList.add('loading');
  addrEl.textContent = t.mapPickerLoading;
  // Debounce reverse-geocode while the buyer is panning.
  clearTimeout(_mapGeocodeTimer);
  _mapGeocodeTimer = setTimeout(async () => {
    try {
      const data = await api('/api/geocode?lat=' + c.lat + '&lng=' + c.lng);
      addrEl.classList.remove('loading');
      addrEl.textContent = data.address || ('📍 ' + c.lat.toFixed(6) + ', ' + c.lng.toFixed(6));
    } catch (_) {
      addrEl.classList.remove('loading');
      addrEl.textContent = '📍 ' + c.lat.toFixed(6) + ', ' + c.lng.toFixed(6);
    }
  }, 350);
}

function confirmMapPick() {
  if (!_leafletMap || !_mapPointChosen) return;
  const c = _leafletMap.getCenter();
  setSelectedLocation(c.lat, c.lng);
  closeMapPicker();
}

function resetPickupSelection() {
  pickupMode = false;
  document.querySelectorAll('#checkout-mode-options [data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode==='delivery'));
  const instructions = document.getElementById('pickup-instructions');
  if (instructions) instructions.style.display = 'none';
}

function showCheckoutSuccess(result) {
  document.getElementById('order-success-text').textContent = t.orderSuccess;
  document.getElementById('order-success-detail').textContent =
    t.orderSuccessDetail.replace('{id}', result.order_id);
  document.getElementById('order-success-detail').style.whiteSpace = 'pre-line';
  window.renderPickupSuccessDetails(document, result,
    { pickup: t.modePickup, map: '🗺 ' + t.openOnMap });
  const ketoEl = document.getElementById('order-success-keto');
  if (result.expected_keto > 0) {
    ketoEl.innerHTML = t.orderSuccessKeto.replace('{amount}', formatPrice(result.expected_keto));
    ketoEl.style.display = 'block';
  } else {
    ketoEl.style.display = 'none';
  }
  switchPage('order-success');
}

// A buyer who opened the shop without ever pressing START can't get a single
// bot message: no copy of their cheque, no "order confirmed / on its way".
// Ask Telegram for that permission before the order goes in. The client
// answers by itself, without a popup, when the bot may already write. Always
// resolves — a refusal or an old client must never block the order.
function ensureBotCanWrite() {
  const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (!u || u.allows_write_to_pm || typeof tg.requestWriteAccess !== 'function') {
    return Promise.resolve();
  }
  return new Promise(resolve => {
    const timer = setTimeout(resolve, 30000);
    const done = () => { clearTimeout(timer); resolve(); };
    try { tg.requestWriteAccess(done); } catch (_) { done(); }  // unsupported / already asked
  });
}

// Uzbek phone as buyers type it: "90 123 45 67", "+998 (90) 123-45-67",
// "8 90 1234567"… → "+998901234567", or null. Same rule as phone_utils.py on
// the server (2026-10-21: the strict "+998…" check turned most real numbers
// away and the buyer only saw a button that "didn't work").
function normalizeUzPhone(raw) {
  let d = String(raw || '').replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  if (d.length === 9) d = '998' + d;
  else if (d.length === 10 && d[0] === '8') d = '998' + d.slice(1);
  return /^998\d{9}$/.test(d) ? '+' + d : null;
}

// A checkout mistake is shown where the buyer is looking: the field it is
// about comes into view (and the keyboard, for the phone), and a toast says
// what to fix — the note under a field far up the page went unseen.
function showCheckoutFieldError(fieldId, message, focus) {
  const field = document.getElementById(fieldId);
  const err = document.createElement('div');
  err.className = 'checkout-error';
  err.textContent = message;
  if (field) {
    field.after(err);
    try { field.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (_) { field.scrollIntoView(); }
    if (focus) setTimeout(() => { try { field.focus({ preventScroll: true }); } catch (_) {} }, 350);
  }
  showToast(message, true, 4000);
  try { tg.HapticFeedback.notificationOccurred('error'); } catch (_) {}
}

async function submitOrder() {
  trk(() => Trk.ev('checkout', 'checkout', 'submit'));
  const phoneInput = document.getElementById('inp-phone');
  const phone = normalizeUzPhone(phoneInput.value);
  const lat = document.getElementById('inp-lat').value;
  const lng = document.getElementById('inp-lng').value;
  const modeState = window.ketoshopPickupState(pickupConfig.enabled, pickupMode, Boolean(lat && lng));
  const isPickup = modeState.pickupSelected;
  const payMethod = document.querySelector('.pay-opt.active')?.dataset.method || 'cash';

  // Remove old errors
  document.querySelectorAll('.checkout-error').forEach(e => e.remove());

  // Validate
  if (!phone) {
    showCheckoutFieldError('inp-phone', t.errorPhone, true);
    trk(() => Trk.ev('checkout', 'checkout', 'error:phone'));
    return;
  }
  phoneInput.value = phone;                    // show the buyer the number we'll use
  if (modeState.locationRequired && (!lat || !lng)) {
    showCheckoutFieldError('btn-get-location', t.errorAddress, false);
    trk(() => Trk.ev('checkout', 'checkout', 'error:address'));
    return;
  }

  const deliveryMethod = modeState.deliveryMethod || document.querySelector('.del-opt[data-method].active')?.dataset.method;
  if (!isPickup && !deliveryMethod) {
    showToast(t.errorDelivery, true);
    trk(() => Trk.ev('checkout', 'checkout', 'error:delivery'));
    return;
  }

  const address = isPickup ? '' : ('📍 ' + parseFloat(lat).toFixed(6) + ', ' + parseFloat(lng).toFixed(6));
  // Optional human-readable address the buyer reviewed/corrected. Sent as
  // address_note so it renders as 📝 next to the coords for the courier.
  const addressNote = (document.getElementById('location-address')?.value || '').trim();
  const btn = document.getElementById('btn-submit-order');
  btn.disabled = true;
  btn.textContent = t.ordering;

  try {
    await ensureBotCanWrite();
    const result = await api('/api/checkout', {
      method: 'POST',
      body: JSON.stringify({
        phone,
        address,
        address_note: isPickup ? null : (addressNote || null),
        latitude: isPickup ? null : parseFloat(lat),
        longitude: isPickup ? null : parseFloat(lng),
        payment_method: payMethod,
        delivery_method: deliveryMethod,
        keto_redeem: keto.enabled ? (keto.redeem || 0) : 0,
      })
    });

    // Clear cart locally
    cartData = { items: [], total: 0 };
    updateCartBadge();

    // Clear form
    document.getElementById('inp-phone').value = '';
    document.getElementById('inp-lat').value = '';
    document.getElementById('inp-lng').value = '';
    document.getElementById('location-text').textContent = t.btnGetLocation;
    document.getElementById('btn-get-location').classList.remove('set');
    document.getElementById('location-icon').textContent = '📍';
    const addrBox = document.getElementById('location-address-box');
    if (addrBox) addrBox.style.display = 'none';
    const addrEl = document.getElementById('location-address');
    if (addrEl) addrEl.value = '';
    document.getElementById('delivery-group').style.display = 'none';
    document.getElementById('delivery-options').innerHTML = '';
    if (result.awaiting_cheque) {
      // Online payment — go to cheque-upload page directly inside the
      // Mini App instead of bouncing the buyer back to the bot chat.
      openChequePage(result);
    } else {
      // Cash flow — server returns the address/map snapshot used by the order.
      showCheckoutSuccess(result);
      resetPickupSelection();
    }

    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    trk(() => Trk.ev('checkout', 'checkout', 'success', result.awaiting_cheque ? 'card' : 'cash'));
  } catch(e) {
    console.error('Checkout error:', e);
    trk(() => Trk.ev('checkout', 'checkout', 'error:' + ((e && e.body && e.body.error) || (e && e.status) || 'network')));
    if (e && e.body && e.body.error === 'outside_uzbekistan') {
      const err = document.createElement('div');
      err.className = 'checkout-error';
      err.textContent = t.errorOutsideUzbekistan;
      document.getElementById('btn-get-location').after(err);
      // Reset location so user must re-share
      document.getElementById('inp-lat').value = '';
      document.getElementById('inp-lng').value = '';
      document.getElementById('location-text').textContent = t.btnGetLocation;
      document.getElementById('btn-get-location').classList.remove('set');
      document.getElementById('location-icon').textContent = '📍';
      const addrBox = document.getElementById('location-address-box');
      if (addrBox) addrBox.style.display = 'none';
      const addrEl = document.getElementById('location-address');
      if (addrEl) addrEl.value = '';
    } else if (e && e.body && e.body.error === 'stock_gone') {
      showToast(stockGoneMessage(e.body), true, 7000);
      // Refresh cart so the user sees the gap before retrying
      await loadCart();
      switchPage('cart');
    } else if (e && e.body && e.body.error === 'keto_balance_changed') {
      showToast(t.errorKetoChanged, true);
      await initKetoRedeemUI();
    } else if (e && e.status === 403) {
      showToast(t.errorSessionExpired, true);
    } else {
      showToast(t.errorLoad, true);
    }
  } finally {
    btn.disabled = false;
    btn.textContent = t.submitOrder;
  }
}

// The order is only created on the server when the cheque arrives, so there
// is no order ID up front. chequeOrderId is set only if the order got created

// via /api/orders/{id}/cheque instead of placing a second one.
let chequeFile = null;
let chequeOrderId = null;

function openChequePage(result) {
  chequeFile = null;

document.getElementById('cheque-copy-card').addEventListener('click', async () => {
  const card = document.getElementById('cheque-card-value').textContent;
  try {
    await navigator.clipboard.writeText(card);
    showToast(t.chequeCopiedToast);
  } catch (_) {
    // Fallback for older webviews — select the code element so the user
    // can copy with the system menu.
    const range = document.createRange();
    range.selectNodeContents(document.getElementById('cheque-card-value'));
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
});

function onChequeFileSelected(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) {
    showToast(t.chequeFileTooLarge, true);
    event.target.value = '';
    return;
  }
  chequeFile = file;

  const pickBtn = document.getElementById('cheque-pick-btn');
  pickBtn.textContent = t.chequePickedFile.replace('{name}', file.name);
  pickBtn.classList.add('has-file');

  const preview = document.getElementById('cheque-preview');
  preview.innerHTML = '';
  preview.style.display = 'block';
  if (file.type.startsWith('image/')) {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    img.onload = () => URL.revokeObjectURL(img.src);
    preview.appendChild(img);
  } else {
    const row = document.createElement('div');
    row.className = 'doc-row';
    row.textContent = '📄 ' + file.name;
    preview.appendChild(row);
  }

  document.getElementById('cheque-submit-btn').disabled = false;
}

async function submitCheque() {
  if (!chequeFile) return;
  const submit = document.getElementById('cheque-submit-btn');
  submit.disabled = true;
  submit.textContent = t.chequeUploading;

  const fd = new FormData();
  fd.append('file', chequeFile, chequeFile.name);

  try {
    // Deferred-order flow: the server reads pending checkout from FSM state
    // (set by /api/checkout) and creates the order + attaches the cheque in
    // one shot. No order_id in the URL because the order doesn't exist yet.
    const url = chequeOrderId ? '/api/orders/' + chequeOrderId + '/cheque' : '/api/checkout/cheque';
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Authorization': AUTH },  // no Content-Type — browser sets multipart boundary
      body: fd,
    });
    if (!res.ok) {
      let body = null;
      try { body = await res.json(); } catch (_) {}
      if (body && body.order_id) chequeOrderId = body.order_id;
      if (body && body.error === 'file_too_large') {
        showToast(t.chequeFileTooLarge, true);
      } else if (body && body.error === 'stock_gone') {
        // Stock ran out between checkout submission and cheque upload —
        // bounce them back to the cart so they can adjust quantities. Reuse
        // the same toast as the regular cart-out-of-stock path.
        showToast(stockGoneMessage(body), true, 7000);
        await loadCart();
        switchPage('cart');
      } else if (body && body.error === 'no_pending_checkout') {
        // FSM state lost (restart / expiry) — send them back to the cart
        // to restart checkout.
        showToast(t.chequeUploadError, true);
        switchPage('cart');
      } else if (res.status === 403) {
        showToast(t.errorSessionExpired, true);
      } else {
        showToast(t.chequeUploadError, true);
      }
      submit.disabled = false;
      submit.textContent = t.chequeSubmitBtn;
      return;
    }
    const result = await res.json();
    showToast(t.chequeReceivedToast);
    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    if (result.delivery_method === 'pickup') {
      // Use the stored server-side deferred snapshot; the shop config may
      // have changed since the buyer opened the cheque page.
      showCheckoutSuccess(result);
      resetPickupSelection();
    } else {
      // Land them on My Orders so they can see the new pending order.
      switchPage('orders');
    }
  } catch (e) {
    console.error('Cheque upload error:', e);
    showToast(t.chequeUploadError, true);
    submit.disabled = false;
    submit.textContent = t.chequeSubmitBtn;
  }
}

async function closeMiniAppForChat() {
  // Buyer chose to pay via the bot chat instead. /api/checkout already
  // stashed the pending order in FSM state (key: waiting_cheque), so when
  // they upload a photo or document in the bot chat the existing
  // process_cheque_photo/_document handler will see pending_items and
  // create the order then. The server first puts the card details and a
  // cancel button in the chat — before, the chat showed nothing at all.
  // Best-effort and capped at 4s: if the bot can't write yet, pressing
  // START in the chat shows the same prompt.
  document.getElementById('cheque-pay-later-btn').disabled = true;
  try {
    await Promise.race([
      api('/api/checkout/pay-in-chat', { method: 'POST' }),
      new Promise(resolve => setTimeout(resolve, 4000)),
    ]);
  } catch (_) {}
  if (tg.close) tg.close();
}

function deliveryLabel(method) {
  const map = {
    pickup: t.modePickup,
    self: t.delSelfLabel,
    yandex_taxi: t.delYandexTaxiLabel,
    yandex_market: t.delYandexMarketLabel,
    bts: t.delBtsLabel,
    emu: t.delEmuLabel,
  };
  return method && map[method] ? map[method] : '—';
}

function paymentLabel(method) {
  if (method === 'cash') return t.payCashLabel;
  if (method === 'online') return t.payOnlineLabel;
  return '—';
}

function statusLabel(status, deliveryMethod) {
  if (deliveryMethod === 'pickup' && status === 'delivered') return '✅ Olib ketildi';
  const map = {
    pending: t.orderStatusPending,
    confirmed: t.orderStatusConfirmed,
    shipped: t.orderStatusShipped,
    delivered: t.orderStatusDelivered,
    cancelled: t.orderStatusCancelled,
  };
  return map[status] || status;
}

// Reuses the same UTC-naive ISO format the discount expiry uses
function formatOrderDate(iso) {
  if (!iso) return '';
  const isoUtc = iso.endsWith('Z') || /[+-]\d\d:?\d\d$/.test(iso) ? iso : iso + 'Z';
  const d = new Date(isoUtc);
  if (isNaN(d.getTime())) return iso;
  const pad = (n) => String(n).padStart(2, '0');
  return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + ' ' +
         pad(d.getHours()) + ':' + pad(d.getMinutes());
}

async function loadOrdersPage() {
  document.getElementById('orders-title').textContent = t.ordersTitle;
  document.getElementById('orders-empty-text').textContent = t.ordersEmpty;

  const list = document.getElementById('orders-list');
  const empty = document.getElementById('orders-empty');
  list.innerHTML = '';
  empty.style.display = 'none';

  let orders;
  try {
    orders = await api('/api/orders');
  } catch(e) {
    console.error('Load orders error:', e);
    if (e && e.status === 403) {
      showToast(t.errorSessionExpired, true);
    } else {
      showToast(t.errorLoad, true);
    }
    return;
  }

  if (!orders.length) {
    empty.style.display = 'block';
    return;
  }

  orders.forEach(o => {
    const itemsHtml = (o.items || []).slice(0, 5).map(it => {
      const qty = it.quantity % 1 === 0 ? it.quantity : Number(it.quantity).toFixed(1);
      return '<div>• ' + escapeHtml(it.name || '—') + ' &mdash; ' +
             qty + ' ' + escapeHtml(it.unit || '') + '</div>';
    }).join('');
    const moreItems = (o.items || []).length > 5
      ? '<div style="opacity:0.7">+' + ((o.items || []).length - 5) + '…</div>'
      : '';

    const timeline = [];
    if (o.created_at)   timeline.push('<span>' + t.orderCreatedAt   + ': ' + formatOrderDate(o.created_at)   + '</span>');
    if (o.confirmed_at) timeline.push('<span>' + t.orderConfirmedAt + ': ' + formatOrderDate(o.confirmed_at) + '</span>');
    if (o.shipped_at)   timeline.push('<span>' + t.orderShippedAt   + ': ' + formatOrderDate(o.shipped_at)   + '</span>');
    if (o.delivered_at) timeline.push('<span>' + t.orderDeliveredAt + ': ' + formatOrderDate(o.delivered_at) + '</span>');

    const cancellable = (o.status === 'pending' || o.status === 'confirmed');
    const cancelBtn = cancellable
      ? '<button class="order-cancel-btn" data-order-id="' + o.id + '">' + t.btnCancelOrder + '</button>'
      : '';

    const card = document.createElement('div');
    card.className = 'order-card';
    card.innerHTML =
      '<div class="order-card-head">' +
        '<div><span class="order-id">#' + o.id + '</span>' +
          '<span class="order-status ' + o.status + '">' + statusLabel(o.status,o.delivery_method) + '</span></div>' +
        '<div class="order-total">' + formatPrice(o.total) + ' UZS</div>' +
      '</div>' +
      '<div class="order-meta">' + t.orderDelivery + ': ' + deliveryLabel(o.delivery_method) +
        ' &nbsp;·&nbsp; ' + t.orderPayment + ': ' + paymentLabel(o.payment_method) + '</div>' +
      (o.delivery_method==='pickup' ? '<div class="order-meta">🏪 '+escapeHtml(o.address||'')+
        (o.pickup_map_url?' · <a href="'+escapeHtml(o.pickup_map_url)+'" target="_blank" rel="noopener">'+escapeHtml(t.openOnMap)+'</a>':'')+'</div>' : '') +
      '<div class="order-items">' + itemsHtml + moreItems + '</div>' +
      (timeline.length ? '<div class="order-timeline">' + timeline.join('') + '</div>' : '') +
      cancelBtn;
    list.appendChild(card);
  });

  // Wire up cancel buttons (Telegram WebApp confirm + POST + reload)
  document.querySelectorAll('.order-cancel-btn').forEach(btn => {
    btn.onclick = async () => {
      const id = parseInt(btn.dataset.orderId, 10);
      const ok = await new Promise(resolve => {
        const msg = t.confirmCancelOrder.replace('{id}', id);
        if (tg.showConfirm) {
          tg.showConfirm(msg, resolve);
        } else {
          resolve(window.confirm(msg));
        }
      });
      if (!ok) return;

      btn.disabled = true;
      try {
        await api('/api/orders/' + id + '/cancel', { method: 'POST' });
        showToast(t.orderCancelled);
        await loadOrdersPage();  // refresh — status pill flips to "cancelled"
      } catch(e) {
        console.error('Cancel error:', e);
        if (e && e.body && e.body.error === 'cannot_cancel') {
          showToast(t.cancelTooLate, true);
        } else {
          showToast(t.errorCancel, true);
        }
        btn.disabled = false;
      }
    };
  });
}

// ===== HELPERS =====
function formatPrice(price) {
  return Math.round(price).toLocaleString('ru-RU').replace(/,/g, ' ');
}

// Renders price block (with strikethrough original + red final + badge when discounted).
function priceHtml(p, suffix) {
  suffix = suffix === undefined ? ' UZS' : suffix;
  const d = p.discount_percent || 0;
  if (d > 0 && p.original_price && p.original_price !== p.price) {
    return '<span class="price-old">' + formatPrice(p.original_price) + '</span>' +
           '<span class="price-new">' + formatPrice(p.price) + suffix + '</span>' +
           '<span class="discount-badge">-' + d + '%</span>';
  }
  return formatPrice(p.price) + suffix;
}

function discountCornerHtml(p) {
  const d = p.discount_percent || 0;
  return d > 0 ? '<div class="discount-corner">-' + d + '%</div>' : '';
}

// Compact "you save N" line for cards/lists. Empty when not discounted.
function savingHtml(p) {
  const d = p.discount_percent || 0;
  if (d > 0 && p.original_price && p.original_price > p.price) {
    const saved = Math.round(p.original_price - p.price);
    return '<div class="card-saving">' + t.youSave.replace('{amount}', formatPrice(saved)) + '</div>';
  }
  return '';
}

// Short DD.MM for the discount-deadline ribbon on cards.
function shortDate(iso) {
  if (!iso) return '';
  const isoUtc = iso.endsWith('Z') || /[+-]\d\d:?\d\d$/.test(iso) ? iso : iso + 'Z';
  const d = new Date(isoUtc);
  if (isNaN(d.getTime())) return '';
  const pad = (n) => String(n).padStart(2, '0');
  return pad(d.getDate()) + '.' + pad(d.getMonth() + 1);
}

// Discount-deadline ribbon (top-left of the image) — only when the discount
// has an expiry. Echoes the reference design's date banner without obscuring
// the product like a price circle would.
function discountUntilCornerHtml(p) {
  const d = p.discount_percent || 0;
  if (d > 0 && p.discount_until) {
    const s = shortDate(p.discount_until);
    if (s) return '<div class="disc-until-corner">⏳ ' + s + '</div>';
  }
  return '';
}

// Tashkent bounding box — must match cart.py TASHKENT_BOUNDS.
// ~5 km buffer around the city proper so the fringes / near-suburbs still
// count as in-Tashkent (self-delivery + cash allowed).
function isInTashkent(lat, lng) {
  return lat >= 41.10 && lat <= 41.50 && lng >= 69.04 && lng <= 69.51;
}

// Flat fee for Ketoshop's own courier ("self"), Tashkent only — must match
// handlers/cart.py SELF_DELIVERY_FEE.
const SELF_DELIVERY_FEE = 25000;
// Free across Tashkent from this products total — handlers/cart.py FREE_DELIVERY_FROM.
const FREE_DELIVERY_FROM = 800000;
function deliveryFee(method) {
  if (method === 'pickup') return 0;
  if (method !== 'self') return 0;
  return cartData.total >= FREE_DELIVERY_FROM ? 0 : SELF_DELIVERY_FEE;
}

// Render delivery options for the checkout page based on whether the user is in Tashkent.
// Tashkent: Ketoshop's own courier (cash/online, flat fee) or Yandex Taxi (online only).
// Outside: courier services (BTS, EMU). Yandex Market was dropped on
// 2026-09-18; its label stays in the dictionary so past orders still render.
function renderDeliveryOptions(inTashkent) {
  const opts = inTashkent
    ? [['self', 'delSelf'], ['yandex_taxi', 'delYandexTaxi']]
    : [['bts', 'delBts'], ['emu', 'delEmu']];
  const container = document.getElementById('delivery-options');
  container.innerHTML = opts.map(([code, key], i) =>
    '<button type="button" class="del-opt' + (i === 0 ? ' active' : '') +
    '" data-method="' + code + '">' + t[key] + '</button>'
  ).join('');
  document.getElementById('delivery-group').style.display = '';
  document.getElementById('lbl-delivery').textContent = t.lblDelivery;
  // Wire up click toggles (scoped to delivery options only)
  container.querySelectorAll('.del-opt').forEach(btn => {
    btn.onclick = () => {
      container.querySelectorAll('.del-opt').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyPaymentRestrictions();
      refreshCheckoutTotal();
    };
  });
  applyPaymentRestrictions();
  refreshCheckoutTotal();
}

async function loadPickupConfig() {
  if (!pickupConfigLoaded) {
    pickupConfigLoaded = true;
    try { pickupConfig = await api('/api/pickup-config'); }
    catch (_) { pickupConfig = {enabled:false,address:'',map_url:'',fee:0}; }

  const modes = document.getElementById('checkout-mode-options');
  if (!modes) return;
  const pickupState = window.ketoshopPickupState(pickupConfig.enabled, pickupMode,
    Boolean(document.getElementById('inp-lat').value && document.getElementById('inp-lng').value));
  if (pickupState.offerPickup && !modes.querySelector('[data-mode="pickup"]')) {
    modes.insertAdjacentHTML('beforeend','<button type="button" class="del-opt" data-mode="pickup">' + escapeHtml(t.modePickup) + '</button>');
  }
  modes.querySelectorAll('[data-mode]').forEach(btn => btn.onclick = () => {
    pickupMode = btn.dataset.mode === 'pickup';
    modes.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b===btn));
    const view = window.ketoshopPickupState(pickupConfig.enabled, pickupMode,
      Boolean(document.getElementById('inp-lat').value && document.getElementById('inp-lng').value));
    document.getElementById('customer-location-group').style.display = view.showCustomerLocation ? '' : 'none';
    document.getElementById('delivery-group').style.display = view.showDeliveryOptions ? '' : 'none';
    const instructions = document.getElementById('pickup-instructions');
    instructions.style.display = view.showPickupInstructions ? '' : 'none';
    instructions.innerHTML = view.showPickupInstructions ? '<b>' + escapeHtml(t.pickupAddressTitle) + '</b><br>' + escapeHtml(pickupConfig.address) +
      '<br><a href="' + escapeHtml(pickupConfig.map_url) + '" target="_blank" rel="noopener">' + escapeHtml(t.openOnMap) + '</a>' : '';
    applyPaymentRestrictions();refreshCheckoutTotal();
  });
  // If pickup settings arrive while checkout is already on screen, keep the
  // current delivery choice and only expose the newly available option.
}

// Recompute + display the checkout total. The self-courier fee is broken out
// as its own line — shown to the buyer, but kept out of the "Jami" grand
// total, which stays the products subtotal (owner's request, 2026-07-28:
// the grand total was confusingly folding delivery in).
function refreshCheckoutTotal() {
  const method = pickupMode ? 'pickup' : document.querySelector('.del-opt[data-method].active')?.dataset.method;
  const fee = deliveryFee(method);
  // Keto-as-discount (off unless the owner has enabled it) — a genuine
  // discount, unlike the delivery fee above, so it does reduce "Jami".
  // Checkout is "the end": an admin's −10% preview is not taken off here.
  const botOff = botCheckoutOff();
  const redeem = keto.enabled ? Math.min(keto.redeem || 0, Math.round(cartData.total - botOff)) : 0;
  let html = '<div class="ct-line"><span>' + t.subtotal + '</span><span>' + formatPrice(cartData.total) + ' UZS</span></div>';
  if (botOff > 0) {
    html += '<div class="ct-line">' + botDiscountLineHtml() + '</div>';
  } else if (cartData.bot_discount && cartData.bot_discount.checkout_note) {
    html += '<div class="ct-line"><span>' + escapeHtml(cartData.bot_discount.checkout_note) + '</span></div>';
  }
  if (fee > 0) {
    html += '<div class="ct-line"><span>' + t.deliveryFeeLabel + '</span><span>' + formatPrice(fee) + ' UZS</span></div>';
    const left = FREE_DELIVERY_FROM - cartData.total;
    if (left <= 300000) {
      html += '<div class="ct-line"><span>' + t.freeDeliveryHint.replace('{left}', formatPrice(left)) + '</span></div>';
    }
  } else if (method === 'self') {
    html += '<div class="ct-line"><span>' + t.deliveryFreeLabel + '</span><span>' + t.deliveryFreeValue + '</span></div>';
  }
  if (redeem > 0) {
    html += '<div class="ct-line"><span>' + t.ketoRedeemLine + '</span><span>-' + formatPrice(redeem) + ' UZS</span></div>';
  }
  html += '<div class="ct-grand"><span>' + t.total + '</span><span>' + formatPrice(cartData.total - botOff - redeem) + ' UZS</span></div>';
  document.getElementById('checkout-total-row').innerHTML = html;

  // Keep the switch's own line honest when the total or the delivery method
  // changes under it.
  const switchText = document.getElementById('keto-redeem-toggle-text');
  if (switchText && keto.enabled && keto.balance > 0) {
    switchText.innerHTML = ketoSwitchHtml(t.ketoRedeemLabel, redeem);
  }
}

// Ketoshop's own courier ("self") takes cash or online. Every other delivery
// method (Yandex Taxi, Yandex Market, BTS, EMU) is a third party that won't
// take cash on our behalf, so cash is disabled and payment forced to online.
function applyPaymentRestrictions() {
  const method = pickupMode ? 'pickup' : document.querySelector('.del-opt[data-method].active')?.dataset.method;
  const cashBtn = document.getElementById('pay-cash');
  const onlineBtn = document.getElementById('pay-online');
  if (!cashBtn || !onlineBtn) return;
  const cashForbidden = !pickupMode && method !== 'self';
  cashBtn.disabled = cashForbidden;
  cashBtn.style.opacity = cashForbidden ? '0.4' : '';
  cashBtn.style.cursor = cashForbidden ? 'not-allowed' : '';
  if (cashForbidden && cashBtn.classList.contains('active')) {
    cashBtn.classList.remove('active');
    onlineBtn.classList.add('active');
  }
}

// Format an ISO timestamp from the API (server stored as naive UTC) as DD.MM.YYYY HH:mm
function formatDiscountDate(iso) {
  // Treat the server's naive UTC string as UTC explicitly
  const isoUtc = iso.endsWith('Z') || /[+-]\d\d:?\d\d$/.test(iso) ? iso : iso + 'Z';
  const d = new Date(isoUtc);
  if (isNaN(d.getTime())) return iso;
  const pad = (n) => String(n).padStart(2, '0');
  return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear() +
         ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// 409 stock_gone from checkout → name the product and what is left
// (owner request 2026-09-30), falling back to the generic line for a
// set component or an older server that sends no name.
function stockGoneMessage(body) {
  const fmt = (n) => { n = Number(n) || 0; return n % 1 === 0 ? String(n) : n.toFixed(1); };
  if (!body || !body.name) return t.errorStockGone;
  const avail = Number(body.available) || 0;
  const tpl = avail > 0 ? t.errorStockGoneLow : t.errorStockGoneOut;
  if (!tpl) return t.errorStockGone;
  return tpl.split('{name}').join(body.name)
            .split('{available}').join(fmt(avail))
            .split('{requested}').join(fmt(body.requested));
}

function showToast(msg, isError = false, ms = 2500) {
  let toast = document.getElementById('app-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'app-toast';
    toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:12px;font-size:14px;z-index:10050;opacity:0;transition:opacity 0.3s;pointer-events:none;max-width:80%;text-align:center';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.background = isError ? 'rgba(220,50,50,0.9)' : 'rgba(0,0,0,0.8)';
  toast.style.color = '#fff';
  toast.style.opacity = '1';
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, ms);
}
</script>
