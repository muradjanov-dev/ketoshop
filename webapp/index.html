<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ketoshop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Leaflet for the map-picker modal. Self-hosted under /static/ so we
     don't depend on third-party CDN reachability from Uzbekistan
     (cdnjs/unpkg can be slow or blocked, leaving the map blank). -->
<link rel="stylesheet" href="/static/leaflet.css">
<script src="/static/leaflet.js"></script>
<style>
  :root {
    /* Ketoshop brand — honey/cream palette (owner-approved redesign,
       2026-07-04). Deliberately fixed rather than following
       --tg-theme-*: the owner chose specific bright/night looks
       regardless of Telegram's own light/dark setting.

       This is the "day" palette (the default :root). Night mode is the
       actual site default though — see data-site-theme="night" below and
       the site-theme script at the bottom of this file for why. */
    --bg: #FFF9EA;
    --text: #3A2C12;
    --hint: #9C8558;
    --link: #B85C10;
    --btn: #D2701F;
    --btn-text: #fff;
    --secondary-bg: #FFF0C8;
    --leaf: #7FA845;
    --leaf-deep: #5F8A2D;
    --berry: #D2405A;
    --gold: #F0A500;
    --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --tab-bar-h: 56px;
  }

  :root[data-site-theme="night"] {
    /* Closer to Telegram's own dark theme — neutral charcoal instead of a
       saturated brown, easier on the eyes. Brand accents (btn/leaf/berry/
       gold) stay warm so it still reads as Ketoshop, not a generic app. */
    --bg: #17181A;
    --text: #ECE9E4;
    --hint: #9A968E;
    --link: #F0A34D;
    --btn: #E8892E;
    --btn-text: #fff;
    --secondary-bg: #222325;
    --leaf: #9BC25B;
    --leaf-deep: #7FA845;
    --berry: #E8637F;
    --gold: #FFC94D;
  }

  :root[data-site-theme="organic"] {
    /* Experimental green "organic" look, owner's request (2026-07-20) —
       a nature-forward palette with a slowly drifting blob background and
       falling-leaf particles (see .organic-leaves below). */
    --bg: #EDF6E3;
    --text: #1F3620;
    --hint: #6C8F63;
    --link: #3F7D2C;
    --btn: #4C8C2B;
    --btn-text: #fff;
    --secondary-bg: #DCEAC8;
    --leaf: #7CB342;
    --leaf-deep: #4C8C2B;
    --berry: #D2405A;
    --gold: #E3B23C;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-user-select: none;
    user-select: none;
    padding-bottom: 66px;
    overflow-x: hidden;
  }

  /* Organic theme — soft drifting green blobs behind the whole site,
     visible through every panel that doesn't paint its own --bg (most
     of them don't). Pure CSS, off unless data-site-theme="organic". */
  :root[data-site-theme="organic"] body {
    background:
      radial-gradient(circle at 12% 18%, rgba(124,179,66,0.38), transparent 42%),
      radial-gradient(circle at 88% 12%, rgba(227,178,60,0.28), transparent 46%),
      radial-gradient(circle at 78% 82%, rgba(76,140,43,0.32), transparent 46%),
      radial-gradient(circle at 18% 88%, rgba(158,206,110,0.32), transparent 42%),
      var(--bg);
    background-size: 180% 180%, 180% 180%, 180% 180%, 180% 180%, 100% 100%;
    animation: organicDrift 26s ease-in-out infinite alternate;
  }
  @keyframes organicDrift {
    0%   { background-position: 0% 0%, 100% 0%, 100% 100%, 0% 100%, 0 0; }
    50%  { background-position: 15% 25%, 85% 20%, 75% 80%, 20% 78%, 0 0; }
    100% { background-position: 0% 10%, 95% 5%, 90% 95%, 10% 90%, 0 0; }
  }

  /* Drifting leaf particles — a handful of emoji spans populated once by
     initOrganicLeaves() and left running across all three themes (owner's
     request, 2026-07-20 — started as an organic-only touch, now also on
     night/day). Fixed + negative z-index so they sit behind all real UI
     (lowest real z-index in this file is 1) and never intercept taps. */
  .organic-leaves {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    overflow: hidden;
    display: block;
  }
  .organic-leaves .leaf {
    position: absolute;
    top: 0;
    left: 0;
    font-size: var(--size, 20px);
    opacity: 0;
    will-change: transform, opacity;
  }
  /* Fallback only — overridden by initLeafMagnetPhysics() with inline
     transform/opacity once JS runs. Keeps leaves falling if JS is disabled. */
  .organic-leaves .leaf {
    left: var(--x, 50%);
    animation: leafFall var(--dur, 14s) linear infinite;
    animation-delay: var(--delay, 0s);
  }
  @keyframes leafFall {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    8%   { opacity: 0.55; }
    92%  { opacity: 0.55; }
    100% { transform: translate(var(--drift, 30px), 124vh) rotate(340deg); opacity: 0; }
  }

  /* Headings/section titles/prices use the serif to carry the brand's
     character; body text and controls stay on the sans stack. */
  .section-title, .cart-page-header, .checkout-header, .cheque-title,
  .orders-header, .fav-header, .profile-name, .modal-header h2,
  .map-modal-header h2, .detail-price, .cheque-total, .order-id,
  .home-hero-title {
    font-family: var(--serif);
  }

  /* ===== PAGE SYSTEM ===== */
  .page { display: none; min-height: calc(100dvh - 58px - env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .page.active { display: block; }

  /* ===== BOTTOM TAB BAR ===== */
  .tab-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    min-height: 58px;
    background: var(--bg);
    border-top: 1px solid var(--secondary-bg);
    box-shadow: 0 -1px 8px rgba(150,105,20,0.08);
    display: flex;
    z-index: 9999;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-height: 44px;
    cursor: pointer;
    color: var(--hint);
    transition: color .2s;
    position: relative;
    -webkit-tap-highlight-color: transparent;
  }
  .tab-item.active { color: var(--btn); }
  .tab-item svg { width: 24px; height: 24px; }
  .tab-item span { font-size: 10px; font-weight: 500; }
  .tab-badge {
    position: absolute;
    top: 4px;
    right: calc(50% - 18px);
    background: var(--berry);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    min-width: 16px;
    height: 16px;
    border-radius: 8px;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
    line-height: 1;
  }
  .tab-badge.visible { display: flex; }

  /* ===== SEARCH ===== */
  .search-wrap { position: relative; }
  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: var(--hint);
  }

  /* ===== HOME PAGE ===== */
  /* Compact brand banner — a toned-down version of the approved hero
     (no floating fruit/torn-paper edge, which suit a one-time landing
     page, not a tab reopened many times a day). */
  .home-hero {
    margin: 10px 14px 4px;
    padding: 20px 18px;
    border-radius: 20px;
    background: linear-gradient(150deg, #FFE37A 0%, #FFD23F 55%, #FFBE0B 100%);
    color: #3A2A10;
  }
  .home-hero-eyebrow {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #7A4D16;
  }
  .home-hero-title {
    font-size: 21px;
    line-height: 1.2;
    margin: 6px 0 4px;
  }
  .home-hero-title em { font-style: italic; color: #B85C10; }
  .home-hero-sub {
    font-size: 13px;
    color: #5B451F;
    line-height: 1.4;
    margin-bottom: 14px;
  }
  .home-hero-cta {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    color: #3A2A10;
    border: none;
    border-radius: 12px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  .home-hero-cta:active { opacity: 0.85; }
  .home-section {
    margin-bottom: 0;
    padding-bottom: 6px;
    border-bottom: 8px solid var(--secondary-bg);
  }
  .home-section:last-child { border-bottom: none; }
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 14px 10px;
  }
  .section-title {
    font-size: 18px;
    font-weight: 700;
  }
  .carousel {
    display: flex;
    overflow-x: auto;
    gap: 12px;
    padding: 0 14px 14px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .auto-carousel-track {
    display: flex;
    overflow-x: auto;
    gap: 12px;
    padding: 0 14px 14px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .auto-carousel-track::-webkit-scrollbar { display: none; }
  .carousel::-webkit-scrollbar { display: none; }

  .carousel-card {
    flex-shrink: 0;
    width: 170px;
    scroll-snap-align: start;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .carousel-card:active { opacity: 0.85; }
  .carousel-card .card-img-wrap {
    position: relative;
    width: 170px;
    height: 170px;
  }
  .carousel-card .card-img {
    width: 170px;
    height: 170px;
    border-radius: 14px;
    object-fit: cover;
    background: var(--secondary-bg);
    display: block;
    box-shadow: 0 6px 16px -8px rgba(150,105,20,0.35);
  }
  .carousel-card .no-photo {
    width: 170px;
    height: 170px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--secondary-bg);
    font-size: 36px;
    color: var(--hint);
  }
  /* ===== TOP-3 PODIUM (home) ===== */
  .podium {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 10px;
    padding: 8px 14px 18px;
  }
  .podium-item {
    flex: 1 1 0;
    max-width: 33%;
    background: var(--secondary-bg);
    border-radius: 14px;
    padding: 8px 6px 10px;
    text-align: center;
    cursor: pointer;
    position: relative;
    border: 2px solid transparent;
    box-shadow: 0 4px 12px -6px rgba(150,105,20,0.3);
    -webkit-tap-highlight-color: transparent;
  }
  .podium-item:active { opacity: 0.85; }
  .podium-item.rank-1 {
    transform: translateY(-12px);
    border-color: var(--gold);
    box-shadow: 0 6px 18px rgba(240, 165, 0, 0.25);
  }
  .podium-item.rank-2 { border-color: #b9c3cf; }
  .podium-item.rank-3 { border-color: #d99a5b; }
  .podium-medal { font-size: 22px; line-height: 1; margin-bottom: 4px; }
  .podium-item.rank-1 .podium-medal { font-size: 28px; }
  .podium-img, .podium-nophoto {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    object-fit: cover;
    background: var(--bg);
    display: block;
  }
  .podium-nophoto {
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; color: var(--hint);
  }
  .podium-name {
    font-size: 12px; font-weight: 600; margin-top: 6px;
    line-height: 1.25; max-height: 2.5em; overflow: hidden;
  }
  .podium-price { font-size: 12px; font-weight: 700; margin-top: 3px; color: var(--text); }
  .customer-podium { position: relative; }
  .customer-podium .podium-item { cursor: default; }
  .confetti-holder {
    position: absolute;
    inset: 0;
    overflow: visible;
    pointer-events: none;
    z-index: 5;
  }
  .confetti-piece {
    position: absolute;
    top: -10px;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    opacity: 0.95;
    animation-name: confetti-fall;
    animation-timing-function: ease-in;
    animation-fill-mode: forwards;
  }
  @keyframes confetti-fall {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--drift), 240px) rotate(var(--rot)); opacity: 0; }
  }
  .podium-rest {
    padding: 0 14px 4px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .podium-rest-item {
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    color: var(--text);
  }
  .card-fav-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 36px;
    height: 36px;
    padding: 4px;
    box-sizing: content-box;
    border-radius: 50%;
    background: rgba(255,255,255,0.85);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 2;
    font-size: 16px;
    line-height: 1;
    -webkit-tap-highlight-color: transparent;
  }
  .carousel-card .card-name {
    font-size: 15px;
    font-weight: 800;
    margin-top: 8px;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.3;
  }
  .carousel-card .card-price {
    font-size: 13px;
    font-weight: 700;
    color: var(--link);
    margin-top: 3px;
  }

  /* ===== CATALOG PAGE ===== */
  .categories {
    display: flex;
    overflow-x: auto;
    gap: 8px;
    padding: 8px 12px;
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .categories::-webkit-scrollbar { display: none; }
  .cat-tab {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: 20px;
    background: var(--secondary-bg);
    color: var(--text);
    border: none;
    font-size: 13px;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
    font-family: inherit;
  }
  .cat-tab.active {
    background: var(--btn);
    color: var(--btn-text);
  }

  .product-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 8px 12px 16px;
  }
  .product-card {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .product-card:active { opacity: 0.85; }
  .product-card .card-img-wrap {
    position: relative;
  }
  .product-card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 14px;
    background: var(--secondary-bg);
    display: block;
    box-shadow: 0 6px 16px -8px rgba(150,105,20,0.35);
  }
  .product-card .no-photo {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--secondary-bg);
    font-size: 40px;
    color: var(--hint);
  }
  .product-card .card-price {
    font-size: 13px;
    font-weight: 700;
    color: var(--link);
    margin-top: 3px;
  }
  /* Discount styling — used in carousel cards, catalog cards, detail modal, cart */
  .price-old {
    color: var(--hint);
    text-decoration: line-through;
    font-weight: 500;
    font-size: 0.85em;
    margin-right: 6px;
  }
  .price-new {
    color: var(--berry);
    font-weight: 800;
  }
  .discount-badge {
    display: inline-block;
    background: var(--berry);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 6px;
    margin-left: 6px;
    vertical-align: middle;
    line-height: 1.2;
  }
  .card-img-wrap .discount-corner {
    position: absolute;
    top: 6px;
    left: 6px;
    background: var(--berry);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 8px;
    z-index: 2;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .card-img-wrap .disc-until-corner {
    position: absolute;
    top: 6px;
    right: 6px;
    background: rgba(0,0,0,0.62);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 8px;
    z-index: 2;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .product-card .card-name {
    font-size: 15px;
    font-weight: 800;
    color: var(--text);
    margin-top: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.3;
  }
  .product-card .card-desc,
  .carousel-card .card-desc {
    font-size: 11px;
    color: var(--hint);
    opacity: 0.7;
    margin-top: 2px;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.3;
  }

  .catalog-search-bar {
    padding: 8px 12px 0;
  }
  .catalog-search-bar input {
    width: 100%;
    padding: 10px 14px 10px 36px;
    border-radius: 12px;
    border: none;
    background: var(--secondary-bg);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .catalog-search-bar input::placeholder { color: var(--hint); }

  /* ===== CART PAGE ===== */
  .cart-page-content { padding: 0 0 100px; }
  .cart-page-header {
    padding: 16px 14px 8px;
    font-size: 18px;
    font-weight: 700;
  }
  .cart-item {
    display: flex;
    align-items: center;
    padding: 12px 14px;
    gap: 12px;
    border-bottom: 1px solid var(--secondary-bg);
  }
  .cart-item img {
    width: 56px; height: 56px;
    border-radius: 10px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--secondary-bg);
  }
  .cart-item .no-photo-sm {
    width: 56px; height: 56px;
    border-radius: 10px;
    background: var(--secondary-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .cart-item .item-info { flex: 1; min-width: 0; }
  .cart-item .item-name {
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cart-item .item-meta { font-size: 12px; color: var(--hint); margin-top: 2px; }
  .cart-item .item-price { font-weight: 700; font-size: 14px; white-space: nowrap; margin-left: 8px; }
  .cart-item .remove-btn {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--berry);
    padding: 4px;
    margin-left: 4px;
  }
  /* Inline qty stepper inside each cart line. Compact (28px tall) so it
     fits without pushing other rows down, but still meets a usable touch
     target with surrounding padding. */
  .cart-item .qty-stepper {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    background: var(--secondary-bg);
    border-radius: 999px;
    padding: 2px 4px;
    width: fit-content;
  }
  .cart-item .qty-step {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--bg);
    border: none;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    line-height: 1;
  }
  .cart-item .qty-step:disabled { opacity: 0.5; cursor: default; }
  .cart-item .qty-step-value {
    min-width: 28px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }

  .cart-footer {
    position: fixed;
    bottom: 58px;
    left: 0;
    right: 0;
    background: var(--bg);
    border-top: 1px solid var(--secondary-bg);
    padding: 12px 14px;
    z-index: 50;
  }
  .cart-total-row {
    display: flex;
    justify-content: space-between;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .cart-discount-line {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--hint);
    margin-bottom: 6px;
  }
  .cart-saved-banner {
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: linear-gradient(135deg, var(--leaf), var(--leaf-deep));
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    padding: 9px 12px;
    border-radius: 10px;
    margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(95,138,45,0.28);
  }
  .cart-actions {
    display: flex;
    gap: 10px;
  }
  .cart-actions button {
    flex: 1;
    padding: 13px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-clear {
    background: var(--secondary-bg);
    color: var(--text);
  }
  .btn-checkout {
    background: var(--btn);
    color: var(--btn-text);
  }

  /* ===== CHECKOUT PAGE ===== */

    font-weight: 500;

  .keto-redeem-toggle-row input[type="checkbox"] {

  #keto-redeem-amount {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 1.5px solid var(--secondary-bg);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }
  .delivery-options-list {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;

  .delivery-options-list .del-opt {
    flex: 1 1 calc(50% - 5px);

  .checkout-total {
    padding: 12px 0;

    justify-content: space-between;
    font-size: 14px;
    color: var(--hint);
    padding: 2px 0;
  }
  .checkout-total .ct-grand {

    justify-content: space-between;
    font-size: 17px;
    font-weight: 700;
    padding-top: 6px;
    margin-top: 4px;
  }
  .checkout-submit-btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: var(--btn);
    color: var(--btn-text);
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .checkout-submit-btn:active { opacity: 0.8; }
  .checkout-submit-btn:disabled { opacity: 0.5; cursor: default; }
  .checkout-back-btn {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    background: var(--secondary-bg);
    color: var(--text);
    border: none;
    border-radius: 12px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  .location-btn {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1.5px solid var(--secondary-bg);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 8px;

  .location-btn.set {

  .location-address-box { margin-top: 8px; }
  .location-address-label {
    display: block;
    font-size: 12px;
    color: var(--hint);
    margin-bottom: 6px;
    line-height: 1.35;
  }
  .location-address-input {
    width: 100%;

    padding: 8px 12px;
    background: var(--secondary-bg);
    border: 1px solid var(--secondary-bg);
    border-radius: 8px;
    font-size: 13px;
    color: var(--text);
    line-height: 1.4;
    font-family: inherit;
    resize: vertical;
    min-height: 40px;
  }
  .location-address-input:focus {
    outline: none;
    border-color: var(--leaf-deep);

  /* ===== MAP PICKER MODAL ===== */
  .map-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg);
    /* Above tab bar (z:9999) so the bottom Confirm button is reachable. */
    z-index: 10001;
    flex-direction: column;
  }
  .map-modal.show { display: flex; }
  .map-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    border-bottom: 1px solid var(--secondary-bg);
    flex-shrink: 0;
  }
  .map-modal-header h2 { font-size: 16px; font-weight: 700; }
  .map-modal-body {
    flex: 1;
    position: relative;
    /* Explicit min-height so the body has size even if a webview reports
       0 for flex:1 briefly after the modal switches to display:flex —
       Leaflet refuses to render in a zero-height container. */
    min-height: 240px;
  }
  #map-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    background: var(--secondary-bg);
  }
  /* Override Leaflet's tile background that bleeds through with our hint
     color, in case tiles are loading. */
  .leaflet-container { background: var(--secondary-bg); }
  #map-error {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.45;
    max-width: 86%;
    text-align: center;
    z-index: 3;
  }
  /* Center crosshair sits on top of the map; the map slides under it
     when the user pans, so wherever the crosshair points is the picked
     spot. Avoids the marker-drag awkwardness on touch screens. */
  .map-crosshair {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -100%);
    font-size: 32px;
    pointer-events: none;
    z-index: 2;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
  }
  .map-modal-footer {
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--secondary-bg);
    background: var(--bg);
    flex-shrink: 0;
  }
  .map-address {
    font-size: 13px;
    color: var(--text);
    margin-bottom: 10px;
    min-height: 36px;
    padding: 8px 12px;
    background: var(--secondary-bg);
    border-radius: 8px;
    line-height: 1.4;
  }
  .map-address.loading { color: var(--hint); }
  .checkout-error {
    color: var(--berry);
    font-size: 13px;
    margin-top: 4px;
  }

  /* ===== FAVORITES PAGE ===== */
  .fav-header {
    padding: 16px 14px 8px;
    font-size: 18px;
    font-weight: 700;
  }

  /* ===== CHEQUE UPLOAD PAGE ===== */
  .cheque-page { padding: 18px 14px 24px; }
  .cheque-title { font-size: 18px; font-weight: 700; color: var(--text); }
  .cheque-order { font-size: 14px; color: var(--hint); margin-top: 4px; }
  .cheque-total {
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
    margin: 14px 0 18px;
  }
  .cheque-row {
    background: var(--secondary-bg);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .cheque-row-label { font-size: 12px; color: var(--hint); margin-bottom: 4px; }
  .cheque-row-value {
    display: flex;

  .cheque-copy {

    border: 1px solid var(--secondary-bg);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--btn);
    font-family: inherit;
  }
  .cheque-copy:active { opacity: 0.7; }
  .cheque-hint {
    font-size: 13px;
    color: var(--hint);
    margin: 14px 0 12px;
    line-height: 1.5;
  }
  .cheque-pick-btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: var(--secondary-bg);
    border: 2px dashed var(--hint);
    border-radius: 12px;
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    margin-bottom: 12px;
  }
  .cheque-pick-btn.has-file {
    border-style: solid;
    border-color: var(--btn);
    background: var(--bg);
  }
  #cheque-preview {
    margin: 0 0 12px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--secondary-bg);
  }
  #cheque-preview img {
    width: 100%;
    max-height: 320px;
    object-fit: contain;
    display: block;
    background: var(--secondary-bg);
  }
  #cheque-preview .doc-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px;
    font-size: 14px;
    color: var(--text);
    background: var(--secondary-bg);
  }
  .cheque-pay-later-btn {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    background: transparent;
    color: var(--hint);
    border: none;
    border-radius: 12px;
    font-size: 13px;
    font-family: inherit;

  .profile-content { padding: 24px 14px; }

  /* ===== PRODUCT DETAIL MODAL ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    /* Above the bottom tab-bar (z:9999) — otherwise the tab-bar
       covers the modal's sticky footer (qty + Add to cart button)
       and buyers can't see/tap it. */
    z-index: 10000;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--bg);
    border-radius: 16px 16px 0 0;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding-bottom: env(safe-area-inset-bottom, 0);
    animation: slideUp .25s ease-out;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px;
    padding-top: env(safe-area-inset-top, 0px);
    border-bottom: 1px solid var(--secondary-bg);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 1;
  }
  .modal-header h2 { font-size: 17px; flex: 1; }
  .modal-close {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--secondary-bg);
    border: none;
    font-size: 18px;
    cursor: pointer;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal img.detail-img {
    width: 100%;
    max-height: 280px;
    object-fit: cover;
  }
  .modal video.detail-video {
    width: 100%;
    max-height: 280px;
    object-fit: cover;
  }
  .detail-media-carousel {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .detail-media-carousel::-webkit-scrollbar { display: none; }
  .detail-media-carousel .media-slide {
    flex-shrink: 0;
    width: 100%;
    scroll-snap-align: start;
  }
  .detail-media-carousel .media-slide img,
  .detail-media-carousel .media-slide video {
    width: 100%;
    max-height: 280px;
    object-fit: cover;
    display: block;
  }
  .media-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 8px 0;
  }
  .media-dots .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--hint);
    opacity: 0.3;
    transition: opacity .2s;
  }
  .media-dots .dot.active { opacity: 1; }
  .modal .detail-body { padding: 16px; padding-bottom: 8px; }
  /* Sticky footer keeps qty + "Add to cart" visible even when the
     description is long — on desktop the modal scrolls and the
     button would otherwise sit below the fold. */
  .modal .detail-footer {
    position: sticky;
    bottom: 0;
    background: var(--bg);
    padding: 8px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--secondary-bg);
    z-index: 1;
  }
  .modal .detail-price {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
  }
  .detail-saving {
    margin-top: 6px;
    font-size: 13px;
    font-weight: 700;
    color: var(--leaf-deep);
  }
  .card-saving {
    font-size: 11px;
    font-weight: 700;
    color: var(--leaf-deep);
    margin-top: 2px;
  }
  .item-saving {
    font-size: 11px;
    font-weight: 700;
    color: var(--leaf-deep);
    margin-top: 2px;
  }
  .modal .detail-unit {
    font-size: 13px;
    color: var(--hint);
  }
  .modal .detail-desc {
    margin-top: 12px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    opacity: 0.8;
    white-space: pre-line;

  .modal .detail-rating {
    margin-top: 8px;
    font-size: 13px;
    color: var(--hint);
  }
  .modal .detail-seller {
    margin-top: 4px;
    font-size: 12px;
    color: var(--hint);
  }
  .detail-reviews {
    margin-top: 18px;
    border-top: 1px solid var(--secondary-bg);
    padding-top: 14px;
  }
  .reviews-heading {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
  }
  .reviews-empty {
    font-size: 13px;
    color: var(--hint);
    margin-bottom: 10px;
  }
  .review-item {
    background: var(--secondary-bg);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .review-item-head {
    display: flex;
    align-items: center;
    gap: 8px;

  .review-comment {
    font-size: 13px;

  .review-date {

    color: var(--hint);

  .review-form {
    margin-top: 10px;
  }
  .review-stars {
    font-size: 22px;

    margin-bottom: 8px;
  }
  .review-form textarea {
    width: 100%;

  .review-submit-btn {
    margin-top: 8px;
    padding: 10px 16px;
    border-radius: 10px;

    background: var(--btn);
    color: #fff;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;

  .modal .detail-fav-btn {

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// ===== SITE THEME =====
// Defaults to night for every buyer (owner's request, 2026-07-13) —
// no longer tied to Telegram's own light/dark setting. Buyers can switch
// to day mode manually from the Profile page; the choice persists via
// localStorage the same way the language preference does.
let siteTheme = localStorage.getItem('ketoshop_theme') || 'night';

// Populates the drifting leaf particles once — runs on every theme
// (night/day/organic), owner's request 2026-07-20. Idempotent, so
// re-running on a theme switch is a cheap no-op once populated.
// Declared *before* applySiteTheme() below, which calls it immediately —
// a `const` referenced before its own declaration line runs throws
// (temporal dead zone), which was silently crashing the entire app's
// top-level script on every load (2026-07-20 incident: fixed same-day).
const LEAF_EMOJI = ['🍃', '🌿', '🍀'];
function initOrganicLeaves() {
  const holder = document.getElementById('organic-leaves');
  if (!holder) return;
  if (holder.children.length) return; // already populated
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 10; i++) {
    const leaf = document.createElement('span');
    leaf.className = 'leaf';
    leaf.textContent = LEAF_EMOJI[i % LEAF_EMOJI.length];
    leaf.style.setProperty('--x', (Math.random() * 100) + '%');
    leaf.style.setProperty('--size', (14 + Math.random() * 14) + 'px');
    leaf.style.setProperty('--dur', (12 + Math.random() * 10) + 's');
    leaf.style.setProperty('--delay', (-Math.random() * 20) + 's');
    leaf.style.setProperty('--drift', (Math.random() * 120 - 60) + 'px');
    frag.appendChild(leaf);
  }
  holder.appendChild(frag);
  initLeafMagnetPhysics(holder);
}

// Takes the ambient leaves off the CSS keyframe and drives them from JS
// instead, so a finger press (or mouse-down, on desktop) can pull nearby
// leaves toward it like a magnet — owner's request, 2026-07-28. Runs once;
// the leaves layer stays pointer-events:none so it never intercepts taps,
// but window-level pointer listeners still see every press/touch/drag
// anywhere on the page (including on real buttons) to know where to pull.
let _leafPhysicsStarted = false;
function initLeafMagnetPhysics(holder) {
  if (_leafPhysicsStarted) return;
  _leafPhysicsStarted = true;

  const MAGNET_RADIUS = 170;   // px — reach of a single press
  const MAGNET_ACCEL = 2200;   // px/s^2 at zero distance, tapering to 0 at the radius
  const DRAG = 0.90;           // per-frame damping so a pull settles instead of orbiting forever

  const pointers = new Map(); // pointerId -> {x, y}
  window.addEventListener('pointerdown', e => pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }), { passive: true });
  window.addEventListener('pointermove', e => { if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); }, { passive: true });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(evt =>
    window.addEventListener(evt, e => pointers.delete(e.pointerId), { passive: true })
  );

  function makeLeaf(el) {
    const dur = 12 + Math.random() * 10; // seconds for one full fall cycle
    return {
      el,
      x: Math.random() * window.innerWidth,
      y: -40,
      vx: 0, vy: 0,                       // extra velocity from magnet pulls, px/s
      rot: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 50, // deg/s
      driftAmp: 30 + Math.random() * 50,
      driftFreq: 0.15 + Math.random() * 0.2,
      phase: Math.random() * Math.PI * 2,
      fallSpeed: (window.innerHeight * 1.24) / dur, // px/s baseline descent
      fadeDur: dur,
      born: Math.random() * dur, // stagger so all 10 don't cycle in sync
    };
  }
  function respawn(l) {
    l.x = Math.random() * window.innerWidth;
    l.y = -40;
    l.vx = 0; l.vy = 0;
    l.born = 0;
  }

  const leaves = Array.from(holder.querySelectorAll('.leaf')).map(el => {
    el.style.animation = 'none'; // hand control over to the rAF loop below
    return makeLeaf(el);
  });

  let lastT = null;
  function frame(now) {
    if (lastT === null) lastT = now;
    const dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;

    for (const l of leaves) {
      l.born += dt;

      for (const p of pointers.values()) {
        const dx = p.x - l.x, dy = p.y - l.y;
        const dist = Math.hypot(dx, dy) || 1;
        if (dist < MAGNET_RADIUS) {
          const accel = MAGNET_ACCEL * (1 - dist / MAGNET_RADIUS);
          l.vx += (dx / dist) * accel * dt;
          l.vy += (dy / dist) * accel * dt;
        }
      }
      l.vx *= DRAG;
      l.vy *= DRAG;

      const sway = Math.sin(l.phase + l.born * l.driftFreq * 2 * Math.PI) * l.driftAmp * dt * 0.6;
      l.x += l.vx * dt + sway;
      l.y += (l.fallSpeed + l.vy) * dt;
      l.rot += l.rotSpeed * dt;

      // Wrap horizontally so a pull off one edge doesn't strand it offscreen.
      const w = window.innerWidth;
      if (l.x < -30) l.x = w + 30;
      if (l.x > w + 30) l.x = -30;

      if (l.y > window.innerHeight + 80 || l.born > l.fadeDur) respawn(l);

      const progress = Math.min(l.born / l.fadeDur, 1);
      const opacity = progress < 0.08 ? 0.55 * (progress / 0.08)
        : progress > 0.92 ? 0.55 * ((1 - progress) / 0.08)
        : 0.55;

      l.el.style.transform = 'translate3d(' + l.x + 'px,' + l.y + 'px,0) rotate(' + l.rot + 'deg)';
      l.el.style.opacity = opacity;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function applySiteTheme() {
  document.documentElement.setAttribute('data-site-theme', siteTheme);
  initOrganicLeaves();
}
applySiteTheme();

function switchTheme(newTheme) {
  siteTheme = newTheme;
  try { localStorage.setItem('ketoshop_theme', siteTheme); } catch (_) { /* quota — ignore */ }
  applySiteTheme();
  document.querySelectorAll('.theme-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.theme === siteTheme);
  });
}

// ===== LANGUAGE =====
// Will be set from API; fallback to Telegram app language
let lang = localStorage.getItem('ketoshop_lang') || ((tg.initDataUnsafe?.user?.language_code === 'ru') ? 'ru' : 'uz');

const L = {
  uz: {
    all: 'Hammasi',
    sectionBestsellers: 'Eng ko‘p sotilganlar',
    sectionTopCustomers: 'Eng faol xaridorlar',
    sectionAllProducts: 'Barcha mahsulotlar',
    search: 'Mahsulot qidirish...',
    loading: 'Yuklanmoqda...',
    empty: 'Mahsulotlar topilmadi',
    addToCart: "Savatga qo'shish",
    cart: 'Savat',
    total: 'Jami',
    subtotal: 'Mahsulotlar summasi',
    deliveryFeeLabel: 'Yetkazib berish narxi',
    ketoRedeemLabel: 'Ketochalarni ishlatish (balans: {balance})',
    ketoRedeemLine: '🥑 Keto chegirmasi',
    cartKetoLabel: '🥑 Ketolar bilan to\'lash (balans: {balance})',
    clear: 'Tozalash',
    checkout: 'Buyurtma berish',
    currency: "so'm",
    perUnit: '/{unit}',
    rating: '{rating}/5 ({count} ta sharh)',
    seller: 'Sotuvchi: {name}',
    reviewsTitle: '💬 Sharhlar',
    noReviews: "Hozircha sharh yo'q — birinchi bo'lib fikr bildiring!",
    submitReview: 'Sharh qoldirish',
    updateReview: 'Sharhni yangilash',
    reviewPickStars: 'Iltimos, yulduzcha bilan baho bering',
    reviewSaved: '✅ Sharhingiz uchun rahmat!',
    reviewCommentPlaceholder: 'Fikringizni yozing (ixtiyoriy)…',
    confirmDeleteReview: "Bu sharh o'chirilsinmi?",
    loadMore: "Ko'proq ko'rsatish",
    cartEmpty: "Savat bo'sh",
    inStock: 'Mavjud: {qty}',
    tabHome: 'Bosh sahifa',
    tabCatalog: 'Katalog',
    tabCart: 'Savat',
    tabFav: 'Sevimlilar',
    tabProfile: 'Profil',
    favTitle: 'Sevimlilar',
    favEmpty: "Sevimlilar ro'yxati bo'sh",
    profileLang: "Til",
    profileTheme: "Ko'rinish",
    profileOrders: 'Buyurtmalar tarixi',
    profileHelp: 'Yordam',
    contactAdmin: "📞 Admin bilan bog'lanish",

// ===== Latin → Uzbek Cyrillic transliteration =====
// Mirrors translit.py — same brand skip list, same digraph order so the
// Mini App and bot stay in lockstep.
const _UZ_BRANDS = ['Yandex Taxi','Yandex Market','Yandex','KETOSHOP','Ketoshop','Telegram','BTS','EMU','UZS'];
const _UZ_DIGRAPHS = [
  // o' / g' before yo/yu/ya so "yo'l" → й + ў + л (not ё + ъ).
  ["O'",'Ў'],["o'",'ў'],
  ["G'",'Ғ'],["g'",'ғ'],
  ['Oʻ','Ў'],['oʻ','ў'],
  ['Gʻ','Ғ'],['gʻ','ғ'],
  ['Sh','Ш'],['SH','Ш'],['sh','ш'],
  ['Ch','Ч'],['CH','Ч'],['ch','ч'],
  ['Yo','Ё'],['YO','Ё'],['yo','ё'],
  ['Yu','Ю'],['YU','Ю'],['yu','ю'],
  ['Ya','Я'],['YA','Я'],['ya','я'],
  ['Ye','Е'],['YE','Е'],['ye','е'],
];
const _UZ_SINGLES = {
  a:'а',b:'б',d:'д',e:'е',f:'ф',g:'г',h:'ҳ',i:'и',j:'ж',k:'к',l:'л',m:'м',
  n:'н',o:'о',p:'п',q:'қ',r:'р',s:'с',t:'т',u:'у',v:'в',x:'х',y:'й',z:'з',"'":'ъ','ʻ':'ъ',
  A:'А',B:'Б',D:'Д',E:'Е',F:'Ф',G:'Г',H:'Ҳ',I:'И',J:'Ж',K:'К',L:'Л',M:'М',
  N:'Н',O:'О',P:'П',Q:'Қ',R:'Р',S:'С',T:'Т',U:'У',V:'В',X:'Х',Y:'Й',Z:'З',
};
function latToCyr(text) {
  if (!text || typeof text !== 'string') return text;
  // Stash HTML tags, {format_tokens}, and brand names so they survive intact.
  const store = [];
  const stash = (m) => { store.push(m); return '' + (store.length - 1) + ''; };
  text = text.replace(/<[^>]+>/g, stash);
  text = text.replace(/\{[^{}]*\}/g, stash);
  // Telegram bot commands like /skip /done — must remain typeable
  text = text.replace(/(^|\s)\/[a-zA-Z][a-zA-Z0-9_]*/g, (m, lead) => lead + stash(m.slice(lead.length)));
  for (const b of _UZ_BRANDS) {
    if (text.includes(b)) {
      // Escape regex metachars
      const esc = b.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      text = text.replace(new RegExp(esc, 'g'), stash);
    }
  }
  // Digraphs in order
  for (const [from, to] of _UZ_DIGRAPHS) {
    if (text.includes(from)) text = text.split(from).join(to);
  }
  // Single letters
  text = Array.from(text).map((ch) => _UZ_SINGLES[ch] !== undefined ? _UZ_SINGLES[ch] : ch).join('');
  // Restore stashed pieces
  text = text.replace(/(\d+)/g, (_, i) => store[Number(i)]);
  return text;
}

// Build the active locale dict. "uz_cyr" auto-derives from L.uz so the
// Mini App doesn't need a third hand-written string table.
function buildActiveLocale() {
  if (lang === 'uz_cyr') {
    const base = L.uz;
    const out = {};
    for (const k in base) {
      out[k] = (typeof base[k] === 'string') ? latToCyr(base[k]) : base[k];
    }
    return out;
  }
  return L[lang] || L.uz;
}

  if (heroCtaEl) heroCtaEl.textContent = t.heroCta;
}

async function switchLanguage(newLang) {
  const btns = document.querySelectorAll('.lang-btn');
  btns.forEach(b => b.disabled = true);
  try {
    lang = newLang;
    t = buildActiveLocale();
    try { localStorage.setItem('ketoshop_lang', lang); } catch (_) { /* quota — ignore */ }
    applyLanguage();
    // Save to server
    try { await api('/api/lang', { method: 'POST', body: JSON.stringify({ lang }) }); } catch (_) { /* server-side preference is best-effort */ }
    // Reload dynamic content
    renderCatalogCategories();
    loadProducts();
    renderHomePage();
    if (activePage === 'cart') renderCartPage();
    if (activePage === 'profile') renderProfilePage();
    if (activePage === 'fav') renderFavPage();
    if (activePage === 'orders') loadOrdersPage();
  } finally {
    btns.forEach(b => b.disabled = false);
  }
}

// ===== AUTH =====
const AUTH = 'tma ' + tg.initData;
function apiHeaders() {
  return { 'Authorization': AUTH, 'Content-Type': 'application/json' };
}
async function api(path, opts = {}) {
  const res = await fetch(path, { headers: apiHeaders(), ...opts });
  if (!res.ok) {
    let body = null;
    try { body = await res.json(); } catch(_) {}
    const err = new Error(res.status);
    err.status = res.status;
    err.body = body;
    throw err;
  }
  return res.json();
}

// ===== SYSTEM BACK BUTTON =====
// Telegram exposes tg.BackButton (Android hardware back, iOS swipe-back, and
// the in-app back arrow). Without this hooked up, system-back closes the
// whole Mini App — pressing it after opening a product detail dropped the
// buyer all the way out instead of just closing the modal.
function _isModalOpen(id) {
  const el = document.getElementById(id);
  return el && el.classList.contains('show');
}

function onBackPressed() {
  // Highest-priority overlays win.
  if (_isModalOpen('map-modal')) { closeMapPicker(); return; }
  if (_isModalOpen('detail-modal')) { closeDetail(); return; }
  // Then page-level: anywhere except home → go home. (Home itself has
  // BackButton hidden, so Telegram handles back natively → app closes.)
  if (activePage && activePage !== 'home') {
    switchPage('home');
  }
}

function updateBackButton() {
  if (!tg.BackButton) return;
  const shouldShow = (
    _isModalOpen('map-modal') ||
    _isModalOpen('detail-modal') ||
    (activePage && activePage !== 'home')
  );
  if (shouldShow) tg.BackButton.show();
  else tg.BackButton.hide();
}

if (tg.BackButton) {
  tg.BackButton.onClick(onBackPressed);
}

// ===== INIT =====
(async function init() {
  // Paint immediately with the language we already know locally
  // (localStorage / Telegram's language_code — set synchronously above at
  // module load) instead of leaving the buyer staring at a blank shell
  // while we wait on a network round trip just to double-check it.
  applyLanguage();
  updateBackButton();

  // Reconcile the server-saved language preference in the background; only
  // re-render text if it actually differs from our local guess.
  const langPromise = api('/api/lang').then(langData => {
    if (langData.lang && L[langData.lang] && langData.lang !== lang) {
      lang = langData.lang;
      t = buildActiveLocale();
      try { localStorage.setItem('ketoshop_lang', lang); } catch (_) { /* quota — ignore */ }
      applyLanguage();
    }
  }).catch(() => { /* use local fallback */ });

  try {
    categories = await api('/api/categories');
    renderHomePage();
    renderCatalogCategories();
    await loadProducts();
    await loadCart();

    // Deep link: ?product=<id> on the Mini App URL (used by admin broadcasts —
    // e.g. a low-stock alert with a "tap here" button) opens straight into
    // that product's detail modal instead of landing on the home page.
    const dpId = parseInt(new URLSearchParams(location.search).get('product'), 10);
    if (!isNaN(dpId)) {
      openDetail(dpId).catch(() => {});
    }
  } catch(e) {
    console.error('Init error:', e);
    showToast(t.errorLoad, true);
  }

  await langPromise;
})();

async function renderHomePage() {
  const container = document.getElementById('home-sections');
  const loading = document.getElementById('home-loading');
  container.innerHTML = '';
  loading.style.display = 'block';
  loading.textContent = t.loading;

  try {
    // Load each category's products in parallel
    const promises = categories.map(cat =>
      api('/api/products?category=' + cat.key + '&page=0&per_page=200')
        .then(data => ({ cat, products: data.products || [], total: data.total || 0 }))
        .catch(() => ({ cat, products: [], total: 0 }))
    );
    const [topProducts, results, allProductsResp, topCustomers] = await Promise.all([
      api('/api/top').catch(() => []),
      Promise.all(promises),
      api('/api/products?page=0&per_page=40').catch(() => ({ products: [] })),
      api('/api/leaderboard').catch(() => []),
    ]);
    const allProducts = allProductsResp.products || [];

    loading.style.display = 'none';

    // All-products carousel — auto-rotating, at the very top of the home page.
    if (Array.isArray(allProducts) && allProducts.length) {
      container.appendChild(buildAutoCarousel(allProducts));
    }

    // Top-3 most-ordered products — podium just below the all-products carousel.
    if (Array.isArray(topProducts) && topProducts.length) {
      container.appendChild(buildPodium(topProducts));
    }

    results.forEach(({ cat, products, total }) => {
      if (products.length === 0) return;
      homeProductsCache[cat.key] = products;

      const section = document.createElement('div');
      section.className = 'home-section';

      // Section header
      const header = document.createElement('div');
      header.className = 'section-header';

      const title = document.createElement('div');
      title.className = 'section-title';
      title.textContent = cat.name;

      header.appendChild(title);
      section.appendChild(header);

      // Carousel — every product in the category, no "N more" pager;
      // the buyer just scrolls the row to see the rest.
      const carousel = document.createElement('div');
      carousel.className = 'carousel';
      products.forEach(p => {
        carousel.appendChild(createCarouselCard(p));
      });
      section.appendChild(carousel);
      container.appendChild(section);
    });

    // Most-active-customers podium — marketing hook so buyers compete for a spot.
    // A little confetti burst the first time it scrolls into view.
    if (Array.isArray(topCustomers) && topCustomers.length) {
      const podiumSection = buildCustomerPodium(topCustomers);
      container.appendChild(podiumSection);
      const io = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            launchConfetti(podiumSection);
            io.disconnect();
          }
        });
      }, { threshold: 0.4 });
      io.observe(podiumSection);
    }

    if (container.children.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="emoji">📦</div><div>' + t.empty + '</div></div>';
    }
  } catch(e) {
    loading.style.display = 'none';
    console.error('Home load error:', e);
    showToast(t.errorLoad, true);
  }
}

function buildPodium(top) {
  // `top` is in rank order: [1st, 2nd, 3rd]. Lay out as a classic podium —
  // 2nd on the left, 1st (raised) in the center, 3rd on the right.
  const medals = ['🥇', '🥈', '🥉'];
  const section = document.createElement('div');
  section.className = 'home-section podium-section';

  const header = document.createElement('div');
  header.className = 'section-header';
  const title = document.createElement('div');
  title.className = 'section-title';
  title.textContent = '🏆 ' + t.sectionBestsellers;
  header.appendChild(title);
  section.appendChild(header);

  const podium = document.createElement('div');
  podium.className = 'podium';
  [1, 0, 2].forEach(rankIdx => {
    const p = top[rankIdx];
    if (!p) return;
    const item = document.createElement('div');
    item.className = 'podium-item rank-' + (rankIdx + 1);
    item.onclick = () => openDetail(p.id);
    const img = p.photo_url
      ? '<img class="podium-img" src="' + p.photo_url + '" alt="" loading="lazy" onerror="this.outerHTML=\'<div class=podium-nophoto>📦</div>\'">'
      : '<div class="podium-nophoto">📦</div>';
    item.innerHTML =
      '<div class="podium-medal">' + medals[rankIdx] + '</div>' +
      img +
      '<div class="podium-name">' + escapeHtml(p.name) + '</div>' +
      '<div class="podium-price">' + priceHtml(p) + '</div>';
    podium.appendChild(item);
  });
  section.appendChild(podium);
  return section;
}

function buildCustomerPodium(names) {
  // Same podium visual as buildPodium, but for the top-5 most active
  // customers: name only (no photo/price/order count), ranks 4-5 as a
  // plain list underneath since the 3-column podium only fits a top 3.
  const medals = ['🥇', '🥈', '🥉'];
  const section = document.createElement('div');
  section.className = 'home-section podium-section customer-podium';

  const header = document.createElement('div');
  header.className = 'section-header';
  const title = document.createElement('div');
  title.className = 'section-title';
  title.textContent = '🏆 ' + t.sectionTopCustomers;
  header.appendChild(title);
  section.appendChild(header);

  const podium = document.createElement('div');
  podium.className = 'podium';
  const top3 = names.slice(0, 3);
  [1, 0, 2].forEach(rankIdx => {
    const name = top3[rankIdx];
    if (!name) return;
    const item = document.createElement('div');
    item.className = 'podium-item rank-' + (rankIdx + 1);
    item.innerHTML =
      '<div class="podium-medal">' + medals[rankIdx] + '</div>' +

function launchConfetti(container) {
  const colors = ['#E8892E', '#FFC94D', '#9BC25B', '#E8637F', '#F0A34D'];
  const holder = document.createElement('div');
  holder.className = 'confetti-holder';
  for (let i = 0; i < 40; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = (Math.random() * 100) + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = (Math.random() * 0.4) + 's';
    piece.style.animationDuration = (1.8 + Math.random() * 1.2) + 's';
    piece.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
    piece.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    holder.appendChild(piece);
  }
  container.appendChild(holder);
  setTimeout(() => holder.remove(), 3300);
}

function buildAutoCarousel(products) {
  const section = document.createElement('div');
  section.className = 'home-section';

  const header = document.createElement('div');
  header.className = 'section-header';
  const title = document.createElement('div');
  title.className = 'section-title';
  title.textContent = '🛍 ' + t.sectionAllProducts;
  header.appendChild(title);
  section.appendChild(header);

  // Genuinely scrollable track (native touch/drag works) — the card list is
  // duplicated once so wrapping scrollLeft back by exactly half the width
  // loops seamlessly. A rAF loop drifts scrollLeft at ~30px/s; user touch
  // pauses the drift (native scrolling takes over) and it always resumes
  // shortly after — with a hard safety timeout so it can never get stuck.
  const track = document.createElement('div');
  track.className = 'auto-carousel-track';
  [...products, ...products].forEach(p => track.appendChild(createCarouselCard(p)));
  section.appendChild(track);

  let halfWidth = 0;
  requestAnimationFrame(() => { halfWidth = track.scrollWidth / 2; });

  let paused = false;
  let resumeTimer = null;
  let safetyTimer = null;
  const SPEED = 0.5; // px/frame ≈ 30px/s at 60fps

  function step() {
    if (!paused && halfWidth > 0) {
      track.scrollLeft += SPEED;
      if (track.scrollLeft >= halfWidth) track.scrollLeft -= halfWidth;
    }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);

  function scheduleResume() {
    clearTimeout(resumeTimer);
    clearTimeout(safetyTimer);
    resumeTimer = setTimeout(() => { paused = false; }, 1200);
  }
  function pause() {
    paused = true;
    clearTimeout(safetyTimer);
    // Guarantees the carousel never stays frozen even if a release event is missed.
    safetyTimer = setTimeout(() => { paused = false; }, 4000);
  }

  track.addEventListener('pointerdown', pause);
  track.addEventListener('pointerup', scheduleResume);
  track.addEventListener('pointercancel', scheduleResume);
  track.addEventListener('pointerleave', scheduleResume);
  track.addEventListener('touchend', scheduleResume);

  return section;
}

  currentCat = key;
  currentPage = 0;
  document.querySelectorAll('#categories .cat-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.cat === key);
  });
  // Scroll active tab into view
  const activeTab = document.querySelector('#categories .cat-tab.active');
  if (activeTab) activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  document.getElementById('catalog-search').value = '';
  loadProducts();

let isLoadingMore = false;

async function loadProducts(append = false) {
  const grid = document.getElementById('product-grid');
  const loading = document.getElementById('catalog-loading');
  const empty = document.getElementById('catalog-empty');
  const scrollLoader = document.getElementById('scroll-loader');

  if (!append) {
    grid.innerHTML = '';
    loading.style.display = 'block';
    loading.textContent = t.loading;
    empty.style.display = 'none';
  }
  scrollLoader.style.display = 'none';
  isLoadingMore = true;

  try {
    const url = currentCat === 'all'
      ? '/api/products?page=' + currentPage
      : '/api/products?category=' + currentCat + '&page=' + currentPage;
    const data = await api(url);
    const products = data.products || [];
    totalPages = data.pages || 1;

    loading.style.display = 'none';

    if (!append && products.length === 0) {
      empty.style.display = 'block';
      document.getElementById('catalog-empty-text').textContent = t.empty;
      isLoadingMore = false;
      return;
    }

    products.forEach(p => {
      grid.appendChild(createProductCard(p));
    });

    isLoadingMore = false;
  } catch(e) {
    loading.style.display = 'none';
    isLoadingMore = false;
    console.error('Load products error:', e);
    showToast(t.errorLoad, true);
  }
}

// Infinite scroll
window.addEventListener('scroll', () => {
  if (activePage !== 'catalog' || isLoadingMore) return;
  if (currentPage + 1 >= totalPages) return;

  const scrollY = window.scrollY + window.innerHeight;
  const docHeight = document.documentElement.scrollHeight;

  if (scrollY >= docHeight - 300) {
    currentPage++;
    isLoadingMore = true;
    document.getElementById('scroll-loader').style.display = 'block';
    loadProducts(true);
  }
});

// ===== PRODUCT DETAIL =====
async function openDetail(productId, isSet = false) {
  try {
    const url = isSet ? '/api/set/' + productId : '/api/product/' + productId;
    const p = await api(url);
    currentProduct = p;
    qty = 1;

    document.getElementById('detail-name').textContent = p.name;
    document.getElementById('detail-price').innerHTML = priceHtml(p);

    const savingEl = document.getElementById('detail-saving');
    const dPct = p.discount_percent || 0;
    if (dPct > 0 && p.original_price && p.original_price > p.price) {
      const saved = Math.round(p.original_price - p.price);
      savingEl.textContent = '🔥 −' + dPct + '% · ' + t.youSave.replace('{amount}', formatPrice(saved));
      savingEl.style.display = 'block';
    } else {
      savingEl.style.display = 'none';
      savingEl.textContent = '';
    }

    const untilEl = document.getElementById('detail-discount-until');
    if (p.discount_percent && p.discount_until) {
      untilEl.textContent = t.discountUntil.replace('{date}', formatDiscountDate(p.discount_until));
    } else {
      untilEl.textContent = '';
    }
    document.getElementById('detail-unit').textContent = t.perUnit.replace('{unit}', p.unit);
    const descEl = document.getElementById('detail-desc');
    if (p.description) {
      descEl.innerHTML = escapeHtml(p.description).replace(/\n/g, '<br>');
    } else {
      descEl.textContent = '';
    }
    document.getElementById('qty-value').textContent = qty;
    const addBtn = document.getElementById('add-to-cart-btn');
    if (p.out_of_stock) {
      addBtn.textContent = t.comingSoon;
      addBtn.disabled = true;
      addBtn.style.opacity = '0.55';
    } else {
      addBtn.textContent = t.addToCart;
      addBtn.disabled = false;
      addBtn.style.opacity = '';
    }

    // Favorite button
    document.getElementById('detail-fav-btn').textContent = favorites[p.id] ? '❤️' : '🤍';

    // Photo + extra media carousel
    const photoContainer = document.getElementById('detail-photo-container');
    const allMedia = [];
    if (p.photo_url) {
      allMedia.push({ url: p.photo_url, type: 'photo' });
    }
    if (p.media && p.media.length > 0) {
      p.media.forEach(m => allMedia.push(m));
    }

    if (allMedia.length === 0) {
      photoContainer.innerHTML = '<div class="no-photo" style="aspect-ratio:1;border-radius:0">📦</div>';
    } else if (allMedia.length === 1) {
      const m = allMedia[0];
      if (m.type === 'video') {
        photoContainer.innerHTML = '<video class="detail-video" src="' + m.url + '" controls playsinline></video>';
      } else {
        photoContainer.innerHTML = '<img class="detail-img" src="' + m.url + '" alt="" onerror="this.style.display=\'none\'">';
      }
    } else {
      let slidesHtml = '';
      let dotsHtml = '';
      allMedia.forEach((m, i) => {
        if (m.type === 'video') {
          slidesHtml += '<div class="media-slide"><video src="' + m.url + '" controls playsinline></video></div>';
        } else {
          slidesHtml += '<div class="media-slide"><img src="' + m.url + '" alt="" onerror="this.parentElement.style.display=\'none\'"></div>';
        }
        dotsHtml += '<div class="dot' + (i === 0 ? ' active' : '') + '"></div>';
      });
      photoContainer.innerHTML =
        '<div class="detail-media-carousel" id="media-carousel">' + slidesHtml + '</div>' +
        '<div class="media-dots" id="media-dots">' + dotsHtml + '</div>';

      // Dot indicator on scroll
      const carousel = document.getElementById('media-carousel');
      const dots = document.querySelectorAll('#media-dots .dot');
      carousel.addEventListener('scroll', () => {
        const idx = Math.round(carousel.scrollLeft / carousel.clientWidth);
        dots.forEach((d, i) => d.classList.toggle('active', i === idx));
      });
    }

    // Rating
    const ratingEl = document.getElementById('detail-rating');
    if (p.review_count > 0) {
      ratingEl.textContent = '⭐ ' + t.rating.replace('{rating}', p.rating).replace('{count}', p.review_count);
    } else {
      ratingEl.textContent = '';
    }

    // Seller
    const sellerEl = document.getElementById('detail-seller');
    if (p.seller_name) {
      sellerEl.textContent = t.seller.replace('{name}', p.seller_name);
    } else {
      sellerEl.textContent = '';
    }

    document.getElementById('detail-modal').classList.add('show');
    updateBackButton();
    loadProductReviews(productId);
  } catch(e) {
    console.error('Detail error:', e);
    showToast(t.errorLoad, true);
  }
}

        return '<div class="review-item"><div class="review-item-head"><span>' + stars + '</span>' +
          '<span class="review-name">' + escapeHtml(r.name) + '</span>' + del + '</div>' +
          comment + '<div class="review-date">' + date + '</div></div>';
      }).join('');
    }
    reviewRating = data.my_review ? data.my_review.rating : 0;
    document.getElementById('review-comment').value = data.my_review ? (data.my_review.comment || '') : '';
    renderReviewStars();
    document.getElementById('review-submit-btn').textContent = data.my_review ? t.updateReview : t.submitReview;
  } catch (e) {
    console.error('Reviews load error:', e);
  }
}

async function submitReview() {
  if (!currentProduct) return;
  if (reviewRating < 1) { showToast(t.reviewPickStars, true); return; }
  const comment = document.getElementById('review-comment').value.trim();
  const btn = document.getElementById('review-submit-btn');
  btn.disabled = true;
  try {
    await api('/api/product/' + currentProduct.id + '/reviews', {
      method: 'POST',
      body: JSON.stringify({ rating: reviewRating, comment }),
    });
    showToast(t.reviewSaved);
    await loadProductReviews(currentProduct.id);
  } catch (e) {
    console.error('Review submit error:', e);
    showToast(t.errorLoad, true);
  } finally {
    btn.disabled = false;
  }
}

async function deleteReview(reviewId, productId) {
  if (!confirm(t.confirmDeleteReview)) return;
  try {
    await api('/api/reviews/' + reviewId + '/delete', { method: 'POST' });
    await loadProductReviews(productId);
  } catch (e) {

}

function closeDetail() {
  document.getElementById('detail-modal').classList.remove('show');
  currentProduct = null;
  updateBackButton();
}

function changeQty(delta) {
  // Whole-number quantities only — buyers were ending up with 0.5 / 1.5
  // entries because the old logic let non-kg units step in halves. Now
  // every product steps by 1 with a minimum of 1, regardless of unit.
  // currentProduct.packaged is still returned by the server but no longer
  // influences stepping.
  const stock = (currentProduct && typeof currentProduct.quantity === 'number') ? currentProduct.quantity : 50;
  const max = Math.max(1, Math.min(stock, 50));
  qty = Math.max(1, Math.min(Math.round(qty + delta), max));
  document.getElementById('qty-value').textContent = qty;
}

function updateCartBadge() {
  const badge = document.getElementById('cart-badge');
  const count = cartData.items.reduce((sum, i) => sum + i.quantity, 0);
  if (count > 0) {
    badge.classList.add('visible');
    badge.textContent = count % 1 === 0 ? count : count.toFixed(1);
  } else {
    badge.classList.remove('visible');
  }
}

function renderCartPage() {
  const container = document.getElementById('cart-items');
  const emptyEl = document.getElementById('cart-empty');
  const footer = document.getElementById('cart-footer');
  container.innerHTML = '';

  if (cartData.items.length === 0) {
    emptyEl.style.display = 'block';
    footer.style.display = 'none';
    return;
  }

  emptyEl.style.display = 'none';
  footer.style.display = 'block';

  cartData.items.forEach(item => {
    const el = document.createElement('div');
    el.className = 'cart-item';

    let photoHtml;
    if (item.photo_url) {
      photoHtml = '<img src="' + item.photo_url + '" alt="" onerror="this.outerHTML=\'<div class=no-photo-sm>📦</div>\'">';
    } else {
      photoHtml = '<div class="no-photo-sm">📦</div>';
    }

    const qtyDisplay = item.quantity % 1 === 0 ? item.quantity : item.quantity.toFixed(1);

    const d = item.discount_percent || 0;
    let priceMeta;
    if (d > 0 && item.original_price && item.original_price !== item.price) {
      priceMeta = qtyDisplay + ' ' + item.unit + ' &times; ' +
                  '<span class="price-old">' + formatPrice(item.original_price) + '</span>' +
                  '<span class="price-new">' + formatPrice(item.price) + '</span>' +
                  '<span class="discount-badge">-' + d + '%</span>';
      // Total saved on this line (per-unit saving × quantity).
      const savedLine = Math.round((item.original_price - item.price) * item.quantity);
      if (savedLine > 0) {
        priceMeta += '<div class="item-saving">' + t.youSave.replace('{amount}', formatPrice(savedLine)) + '</div>';
      }
    } else {
      priceMeta = qtyDisplay + ' ' + item.unit + ' &times; ' + formatPrice(item.price);
    }

    const stepper =
      '<div class="qty-stepper">' +
        '<button class="qty-step" data-action="dec" data-id="' + item.cart_id + '" aria-label="-">&minus;</button>' +
        '<span class="qty-step-value">' + qtyDisplay + '</span>' +
        '<button class="qty-step" data-action="inc" data-id="' + item.cart_id + '" aria-label="+">+</button>' +
      '</div>';

    el.innerHTML = photoHtml +
      '<div class="item-info">' +
        '<div class="item-name">' + escapeHtml(item.name) + '</div>' +
        '<div class="item-meta">' + priceMeta + '</div>' +
        stepper +
      '</div>' +
      '<div class="item-price">' + formatPrice(item.total) + '</div>' +
      '<button class="remove-btn" data-id="' + item.cart_id + '">&times;</button>';
    container.appendChild(el);
  });

  // Remove buttons
  container.querySelectorAll('.remove-btn').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      try {
        btn.disabled = true;
        await api('/api/cart/remove', {
          method: 'POST',
          body: JSON.stringify({ cart_id: parseInt(btn.dataset.id) })
        });
        await loadCart();
      } catch(err) {
        console.error(err);
        btn.disabled = false;
      }
    };
  });

  // Quantity steppers — increment/decrement with stock + step awareness.
  // We disable both buttons during the API roundtrip so a flurry of taps
  // can't outrun the backend and create a stale UI.
  container.querySelectorAll('.qty-step').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const cartId = parseInt(btn.dataset.id);
      const item = cartData.items.find(x => x.cart_id === cartId);
      if (!item) return;
      // Always step by 1. Math.round() snaps any pre-existing fractional
      // quantity (left over from before integer-only was enforced) to the
      // nearest whole number so the first tap brings the line back onto
      // a clean integer grid.
      const delta = btn.dataset.action === 'inc' ? 1 : -1;
      let next = Math.round((item.quantity || 0) + delta);
      // Clamp to stock so we don't even bother the server with overshoot.
      if (typeof item.available === 'number' && next > item.available) {
        next = Math.floor(item.available);
      }
      if (next === item.quantity) return;
      const peers = btn.parentElement.querySelectorAll('.qty-step');
      peers.forEach(b => b.disabled = true);
      try {
        await api('/api/cart/update', {
          method: 'POST',
          body: JSON.stringify({ cart_id: cartId, quantity: next })
        });
        await loadCart();
      } catch (err) {
        console.error('Cart update error:', err);
        peers.forEach(b => b.disabled = false);
        showToast(t.errorCart || 'Error', true);
      }
    };
  });

  renderCartTotal();
  initCartKetoUI();

  // Total saved across all discounted lines — a celebratory banner.
  const savedTotal = cartData.items.reduce((s, it) =>
    (it.original_price && it.original_price > it.price)
      ? s + (it.original_price - it.price) * it.quantity
      : s, 0);
  const savedBanner = document.getElementById('cart-saved-banner');
  if (savedTotal > 0) {
    savedBanner.textContent = t.cartSaved.replace('{amount}', formatPrice(Math.round(savedTotal)));
    savedBanner.style.display = 'flex';
  } else {
    savedBanner.style.display = 'none';
  }

}

// Recompute + display the cart page's total line, folding in whatever Keto
// discount is currently selected (either toggled here or carried over from
// the checkout page). No delivery fee at this stage — that's only known
// once a delivery method is picked on checkout, so the cap here is just the
// product subtotal (checkout's own redeem UI re-clamps against the final
// total once the fee is known).
function renderCartTotal() {
  const redeem = keto.enabled ? Math.min(keto.redeem || 0, Math.round(cartData.total)) : 0;
  const discountLine = document.getElementById('cart-discount-line');
  if (redeem > 0) {
    discountLine.innerHTML = '<span>' + t.ketoRedeemLine + '</span><span>-' + formatPrice(redeem) + ' UZS</span>';
    discountLine.style.display = 'flex';
  } else {
    discountLine.style.display = 'none';
  }
  document.getElementById('cart-total-value').textContent = formatPrice(Math.max(0, cartData.total - redeem)) + ' UZS';
}

// "Pay with Keto" toggle on the cart page itself (owner request, 2026-08-12):
// a one-tap, all-or-nothing version of the checkout page's adjustable Keto
// discount — flip it on and the full balance (capped at the cart subtotal)
// is applied immediately, so buyers see the amount still owed before they
// even reach checkout. The choice carries into checkout via the shared
// `keto` object; initKetoRedeemUI() there picks it up instead of resetting it.
async function initCartKetoUI() {
  const group = document.getElementById('cart-keto-group');
  const toggle = document.getElementById('cart-keto-toggle');
  const toggleText = document.getElementById('cart-keto-toggle-text');

  try {
    const status = await api('/api/keto/status');
    keto.enabled = !!status.enabled;
    keto.balance = status.balance || 0;
  } catch (e) {
    keto.enabled = false;
    keto.balance = 0;
  }

  if (!keto.enabled || keto.balance <= 0) {
    keto.redeem = 0;
    group.style.display = 'none';
    renderCartTotal();
    return;
  }

  group.style.display = '';
  toggleText.textContent = t.cartKetoLabel.replace('{balance}', formatPrice(keto.balance));
  toggle.checked = (keto.redeem || 0) > 0;

  toggle.onchange = () => {
    keto.redeem = toggle.checked ? Math.min(keto.balance, Math.round(cartData.total)) : 0;
    renderCartTotal();
  };
}
