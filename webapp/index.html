          '<path d="M2,1 C12,6 22,14 30,24 M2,1.5 C10,9 16,18 19,28 M2,.5 C16,2 28,6 35,12 M2,2 C6,12 9,20 10,25" fill="none" stroke="#1C1410" stroke-width="1"/>' +
          '<g fill="#FFF8EC"><circle cx="34.6" cy="15" r="1"/><circle cx="35.4" cy="20" r="1"/><circle cx="32.6" cy="25" r="1"/>' +
            '<circle cx="27" cy="28" r="1"/><circle cx="21" cy="29.4" r=".9"/><circle cx="14.6" cy="27.4" r=".9"/></g>' +
        '</g>' +
        '<g id="bf-fw">' +
          '<path d="M1.5,-5 C8,-22 26,-35 44,-33 C49,-32 50,-26 47,-20 C42,-10 28,-3 1.5,-1.5 Z" fill="url(#bf-fw-g)" stroke="#1C1410" stroke-width="2.6" stroke-linejoin="round"/>' +
          '<path d="M34,-33.5 C40,-34 48,-33 48.5,-27 C49,-23 47,-19.5 44,-17 C42,-24 38,-29 34,-33.5 Z" fill="#1C1410"/>' +
          '<path d="M2,-4 C14,-14 26,-24 40,-31 M2,-3 C16,-9 30,-15 46,-21 M2,-2.5 C14,-5 26,-7 38,-10 M18,-14 C20,-10 21,-7 22,-5" fill="none" stroke="#1C1410" stroke-width="1"/>' +
          '<circle cx="40.5" cy="-27" r="1.4" fill="#F7A23B"/><circle cx="43.8" cy="-24.6" r="1.2" fill="#F7A23B"/>' +
          '<g fill="#FFF8EC"><circle cx="39" cy="-32.4" r="1"/><circle cx="42.4" cy="-30.6" r="1.1"/><circle cx="45.6" cy="-28" r="1"/>' +
            '<circle cx="46.6" cy="-24" r=".9"/><circle cx="44.6" cy="-20.4" r=".9"/></g>' +
        '</g>' +
      '</defs>' +
      '<g class="bf-hl"><use href="#bf-hw"/></g><g class="bf-hr"><use href="#bf-hw"/></g>' +
      '<g class="bf-fl"><use href="#bf-fw"/></g><g class="bf-fr"><use href="#bf-fw"/></g>' +
      '<g fill="#1C1410">' +
        '<path d="M-.8,-12.5 C-3,-20 -6,-26 -8.5,-30 M.8,-12.5 C3,-20 6,-26 8.5,-30" fill="none" stroke="#1C1410" stroke-width="1" stroke-linecap="round"/>' +
        '<circle cx="-8.6" cy="-30.2" r="1.5"/><circle cx="8.6" cy="-30.2" r="1.5"/>' +
        '<ellipse cx="0" cy="9" rx="2.2" ry="11"/><ellipse cx="0" cy="-3" rx="3" ry="6"/><circle cx="0" cy="-10.5" r="2.8"/>' +
      '</g>' +
      '<g fill="#FFF8EC"><circle cx="-1" cy="-5" r=".7"/><circle cx="1.1" cy="-2" r=".6"/><circle cx="0" cy="-11" r=".6"/></g>' +
    '</svg>';

  let el = null, wing = null, timer = null, flying = false, started = false;
  const rand = (a, b) => a + Math.random() * (b - a);

  function build() {
    el = document.createElement('div');
    el.className = 'butterfly';
    el.setAttribute('aria-hidden', 'true');
    el.innerHTML = SVG;
    document.body.appendChild(el);
    wing = ['fl', 'fr', 'hl', 'hr'].reduce((o, k) => (o[k] = el.querySelector('.bf-' + k), o), {});
  }

  function blocked() {
    return document.hidden || !CALM_PAGES.includes(activePage) ||
      !!document.querySelector('.modal-overlay.show, .map-modal.show');
  }

  function schedule(range) {
    clearTimeout(timer);
    timer = setTimeout(() => (blocked() ? schedule(RETRY_DELAY) : fly()), rand(range[0], range[1]));
  }

  // Wings turn about the body: seen from above that is a squeeze in x.
  function setWings(fore, hind) {
    wing.fr.setAttribute('transform', 'scale(' + fore + ',1)');
    wing.fl.setAttribute('transform', 'scale(' + (-fore) + ',1)');
    wing.hr.setAttribute('transform', 'scale(' + hind + ',1)');
    wing.hl.setAttribute('transform', 'scale(' + (-hind) + ',1)');
  }

  function place(x, y, angle, size) {
    el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) rotate(' +
      (angle * 180 / Math.PI + 90).toFixed(1) + 'deg) scale(' + size.toFixed(2) + ')';
  }

  function fly() {
    if (flying || blocked()) return;
    if (!el) build();
    const W = window.innerWidth, H = window.innerHeight;
    const fromLeft = Math.random() < 0.5;
    const size = rand(0.8, 1.1);
    const speed = rand(70, 100);                         // px/s
    let x = fromLeft ? -40 : W + 40;
    let y = rand(0.15, 0.7) * H;
    const ex = fromLeft ? W + 60 : -60, ey = rand(0.1, 0.8) * H;
    let shown = Math.atan2(ey - y, ex - x);
    let wander = 0, phase = 0, glide = 0, nextGlide = rand(1.2, 2.5), t = 0, last = null;
    flying = true;
    setWings(1, 1);
    place(x, y, shown, size);       // off-screen before it is shown, not at 0,0
    el.style.display = 'block';
    el.style.opacity = '1';

    function frame(now) {
      if (!flying) return;
      if (last === null) last = now;
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      t += dt;
      const gone = fromLeft ? x > W + 50 : x < -50;
      if (blocked() || gone || y < -90 || y > H + 90 || t > 16) { finish(); return; }

      // Butterflies don't fly straight: a drifting random wander and a slow
      // swoop around the line to the exit, short glides between wingbeats.
      wander += (Math.random() - 0.5) * 3.2 * dt;
      wander *= 1 - 0.6 * dt;
      wander = Math.max(-1.1, Math.min(1.1, wander));
      const heading = Math.atan2(ey - y, ex - x) + wander + 0.35 * Math.sin(t * 1.7);
      let fore, hind, v;
      if (glide > 0) {
        glide -= dt;
        v = speed * 0.85;
        y += 14 * dt;                                    // a glide sinks a little
        fore = 0.93 + 0.03 * Math.sin(t * 22);
        hind = fore;
      } else {
        nextGlide -= dt;
        if (nextGlide <= 0) { glide = rand(0.4, 0.9); nextGlide = rand(1.5, 3); }
        v = speed;
        phase += dt * 2 * Math.PI * 5.5;                 // ~5.5 beats a second
        fore = 0.18 + 0.82 * (0.5 + 0.5 * Math.cos(phase));
        hind = 0.24 + 0.76 * (0.5 + 0.5 * Math.cos(phase - 0.5));
      }
      x += Math.cos(heading) * v * dt;
      y += Math.sin(heading) * v * dt;
      let turn = heading - shown;
      turn = Math.atan2(Math.sin(turn), Math.cos(turn));
      shown += turn * Math.min(1, dt * 4);
      const bob = glide > 0 ? 0 : Math.sin(phase) * 2.5 * size;   // each beat lifts it
      setWings(fore.toFixed(3), hind.toFixed(3));
      place(x, y + bob, shown, size);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function finish() {
    flying = false;
    el.style.opacity = '0';
    setTimeout(() => { if (!flying) el.style.display = 'none'; }, 450);
    schedule(NEXT_DELAY);
  }

  return {
    start() { if (started) return; started = true; schedule(FIRST_DELAY); },
    fly,
  };
})();

// ===== BIRDSONG =====
// Now and then a bird or two sings quietly in the background (owner,
// 2026-10-22: "fonga qushlarni yoqimli nolasini ora-orada sayrab turadigan").
// Every note is synthesised with Web Audio — no recordings, so nothing to
// license or download. Phones only allow sound after the buyer's first tap,
// so the first song comes a few seconds after it. A song never plays at
// night (22:00–07:00 Tashkent), while the app is hidden, on the ordering
// screens or over an open window, and the 🐦 button (shown once the birds
// have sung) switches it off for good on that phone.
const Birdsong = (() => {
  const CALM_PAGES = ['home', 'catalog', 'fav', 'profile', 'games', 'orders'];
  const KEY = 'ketoshop_birds';
  const FIRST_DELAY = [4000, 8000];
  const NEXT_DELAY = [20000, 45000];
  let ctx = null, out = null, timer = null, started = false, heard = false, btn = null;
  let isAdmin = false;                  // admins hear it at night too, to test it
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  function muted() {
    try { return localStorage.getItem(KEY) === 'off'; } catch (_) { return false; }
  }
  function night() {
    if (isAdmin) return false;
    const h = (new Date().getUTCHours() + 5) % 24;
    return h >= 22 || h < 7;
  }
  function calm() {
    return !document.hidden && CALM_PAGES.includes(activePage) &&
      !document.querySelector('.modal-overlay.show, .map-modal.show');
  }

  // Master chain: a soft high cut and a short garden echo.
  function audio() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    out = ctx.createGain();
    out.gain.value = 0.5;                // peaks near -24 dBFS: background, not a ringtone
    const tone = ctx.createBiquadFilter();
    tone.type = 'lowpass';
    tone.frequency.value = 7000;
    const echo = ctx.createDelay(1);
    echo.delayTime.value = 0.13;
    const fb = ctx.createGain();
    fb.gain.value = 0.22;
    const wet = ctx.createGain();
    wet.gain.value = 0.2;
    out.connect(tone);
    tone.connect(ctx.destination);
    tone.connect(echo);
    echo.connect(fb);
    fb.connect(echo);
    echo.connect(wet);
    wet.connect(ctx.destination);
    return ctx;
  }

  // One pure, gliding tone — birdsong is close to a whistled sine. `vib`
  // adds the fast warble some notes have.
  function note(dest, t0, dur, f0, f1, peak, vib) {
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    if (vib) {
      const lfo = ctx.createOscillator();
      const depth = ctx.createGain();
      lfo.frequency.value = vib[0];
      depth.gain.value = vib[1];
      lfo.connect(depth);
      depth.connect(o.frequency);
      lfo.start(t0);
      lfo.stop(t0 + dur + 0.05);
    }
    const g = ctx.createGain();
    const att = Math.min(0.012, dur / 4), rel = Math.min(0.04, dur / 3);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + att);
    g.gain.setValueAtTime(peak, t0 + dur - rel);
    g.gain.linearRampToValueAtTime(0, t0 + dur);
    o.connect(g);
    g.connect(dest);
    o.start(t0);
    o.stop(t0 + dur + 0.05);
  }

  // Four kinds of bird; each returns when it has finished, in seconds.
  const SONGS = {
    chirp(d, t) {                       // sparrow: quick falling chirps
      const n = 2 + Math.floor(Math.random() * 3);
      for (let i = 0; i < n; i++) {
        note(d, t, 0.07, rand(4300, 5000), rand(2600, 3000), 0.11, [70, 90]);
        t += rand(0.12, 0.17);
      }
      return t;
    },
    trill(d, t) {                       // canary: a fast rolling trill
      const base = rand(2900, 3600), n = 9 + Math.floor(Math.random() * 6);
      for (let i = 0; i < n; i++) {
        const up = i % 2 === 0;
        note(d, t, 0.034, base * (up ? 0.94 : 1.08), base * (up ? 1.08 : 0.94), 0.085);
        t += 0.05;
      }
      return t;
    },
    whistle(d, t) {                     // a clear little tune
      const k = rand(0.92, 1.08);
      note(d, t, 0.17, 2400 * k, 3200 * k, 0.1);
      t += 0.23;
      note(d, t, 0.13, 3300 * k, 2600 * k, 0.1);
      t += 0.2;
      note(d, t, 0.36, 2600 * k, 3500 * k, 0.1, [32, 110]);
      return t + 0.36;
    },
    call(d, t) {                        // tit: "ti-chu, ti-chu"
      const n = 2 + Math.floor(Math.random() * 2);
      for (let i = 0; i < n; i++) {
        note(d, t, 0.09, 5300, 5050, 0.08);
        note(d, t + 0.13, 0.12, 3700, 3400, 0.09);
        t += 0.42;
      }
      return t;
    },
  };

  function bird(t, kind) {
    let dest = out;
    if (ctx.createStereoPanner) {        // each bird sits somewhere in the garden
      dest = ctx.createStereoPanner();
      dest.pan.value = rand(-0.7, 0.7);
      dest.connect(out);
    }
    return SONGS[kind](dest, t);
  }

  // A phrase: one bird, and sometimes a second one answering it.
  function sing() {
    if (!ctx || ctx.state !== 'running') return;
    const kinds = Object.keys(SONGS);
    const first = pick(kinds);
    let end = bird(ctx.currentTime + 0.05, first);
    if (Math.random() < 0.6) end = bird(end + rand(0.5, 1.4), pick(kinds));
    if (Math.random() < 0.3) bird(end + rand(0.4, 1), first);
    if (!heard) { heard = true; sync(); }
  }

  function schedule(range) {
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (!muted() && !night() && calm()) sing();
      schedule(NEXT_DELAY);
    }, rand(range[0], range[1]));
  }

  // The first tap unlocks sound (browser rule); the birds start soon after.
  function unlock() {
    if (!audio()) return;
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    if (!timer) schedule(FIRST_DELAY);
  }

  function sync() {
    if (!btn) return;
    const off = muted();
    btn.textContent = off ? '🔇' : '🐦';
    btn.classList.toggle('off', off);
    btn.setAttribute('aria-label', off ? t.birdsOff : t.birdsOn);
    btn.style.display = (heard || off) && CALM_PAGES.includes(activePage) ? 'flex' : 'none';
  }

  function toggle() {
    const off = !muted();
    try { localStorage.setItem(KEY, off ? 'off' : 'on'); } catch (_) {}
    showToast(off ? t.birdsOff : t.birdsOn);
    if (!off) { unlock(); sing(); }     // a little chirp says it is back on
    sync();
  }

  function start() {
    if (started) return;
    started = true;
    btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'birdsong-btn';
    btn.onclick = toggle;
    document.body.appendChild(btn);
    sync();
    // touchend/click, not pointerdown: a touch only counts as the gesture
    // that may start sound when it ends (Chrome and iOS alike).
    const gestures = ['touchend', 'click'];
    const first = () => {
      unlock();
      if (ctx && ctx.state === 'running') gestures.forEach(e => document.removeEventListener(e, first, true));
    };
    gestures.forEach(e => document.addEventListener(e, first, true));
    document.addEventListener('visibilitychange', () => {
      if (!ctx) return;
      if (document.hidden) ctx.suspend().catch(() => {});
      else ctx.resume().catch(() => {});
    });
  }

  return { start, sync, sing, admin() { isAdmin = true; } };
})();

function applySiteTheme() {
  document.documentElement.setAttribute('data-site-theme', siteTheme);
  initOrganicLeaves();
  // Paint Telegram's own header/background in the page colour so the Mini
  // App reads as one surface. Hex colours need Bot API 6.9+; older clients
  // throw, which is fine — they keep Telegram's default chrome.
  try {
    const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    if (bg && tg.setHeaderColor) tg.setHeaderColor(bg);
    if (bg && tg.setBackgroundColor) tg.setBackgroundColor(bg);
  } catch (_) { /* unsupported client */ }
}
applySiteTheme();

function switchTheme(newTheme) {
  siteTheme = newTheme;
  try { localStorage.setItem('ketoshop_theme', siteTheme); } catch (_) { /* quota — ignore */ }
  applySiteTheme();
  document.querySelectorAll('.theme-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.theme === siteTheme);
  });
}

// ===== Latin → Uzbek Cyrillic transliteration =====
// Mirrors translit.py — same brand skip list, same digraph order so the
// Mini App and bot stay in lockstep.
const _UZ_BRANDS = ['Yandex Taxi','Yandex Market','Yandex','KETOSHOP','Ketoshop','Telegram','BTS','EMU','UZS','MCT'];
const _UZ_DIGRAPHS = [
  // o' / g' before yo/yu/ya so "yo'l" → й + ў + л (not ё + ъ).
  ["O'",'Ў'],["o'",'ў'],
  ["G'",'Ғ'],["g'",'ғ'],
  ['Oʻ','Ў'],['oʻ','ў'],
  ['Gʻ','Ғ'],['gʻ','ғ'],
  ['Sh','Ш'],['SH','Ш'],['sh','ш'],
  ['Ch','Ч'],['CH','Ч'],['ch','ч'],
  ['Yo','Ё'],['YO','Ё'],['yo','ё'],
  ['Yu','Ю'],['YU','Ю'],['yu','ю'],
  ['Ya','Я'],['YA','Я'],['ya','я'],
  ['Ye','Е'],['YE','Е'],['ye','е'],
];
const _UZ_SINGLES = {
  a:'а',b:'б',d:'д',e:'е',f:'ф',g:'г',h:'ҳ',i:'и',j:'ж',k:'к',l:'л',m:'м',
  n:'н',o:'о',p:'п',q:'қ',r:'р',s:'с',t:'т',u:'у',v:'в',x:'х',y:'й',z:'з',"'":'ъ','ʻ':'ъ',
  A:'А',B:'Б',D:'Д',E:'Е',F:'Ф',G:'Г',H:'Ҳ',I:'И',J:'Ж',K:'К',L:'Л',M:'М',
  N:'Н',O:'О',P:'П',Q:'Қ',R:'Р',S:'С',T:'Т',U:'У',V:'В',X:'Х',Y:'Й',Z:'З',
};
// Loanword "ts" → "ц" and word-initial e → э, same rules as translit.py
// (2026-10-13: "Ретсептни очиш" for "Рецептни очиш"). Native Uzbek "ts"
// stays "тс" (aytsa → айтса, shartsiz → шартсиз). No lookbehind in these
// regexes: older iOS WebViews reject it and the whole script would fail.
const _UZ_TS_STEMS = [['retsept','рецепт'],['ratsion','рацион'],['antotsian','антоциан'],
  ['protsess','процесс'],['protsedur','процедур'],['kontsentrat','концентрат'],['kontsert','концерт'],
  ['pitsa','пицца'],['porsiya','порция'],['aksiya','акция']];
const _UZ_LETTER = "A-Za-zЀ-ӿ";
function _uzSameCase(src, cyr) {
  if (src.length > 1 && src === src.toUpperCase()) return cyr.toUpperCase();
  return src[0] === src[0].toUpperCase() ? cyr[0].toUpperCase() + cyr.slice(1) : cyr;
}
function _uzTsLoanwords(text) {
  for (const [lat, cyr] of _UZ_TS_STEMS) {
    text = text.replace(new RegExp(lat, 'gi'), (m) => _uzSameCase(m, cyr));
  }
  text = text.replace(new RegExp('([' + _UZ_LETTER + '])(ts)(?=iya)', 'gi'), (m, lead, ts) => lead + _uzSameCase(ts, 'ц'));
  return text.replace(new RegExp("(^|[^" + _UZ_LETTER + "'ʻ’])(ts)", 'gi'), (m, lead, ts) => lead + _uzSameCase(ts, 'ц'));
}
function latToCyr(text) {
  if (!text || typeof text !== 'string') return text;
  // Stash HTML tags, {format_tokens}, and brand names so they survive intact.
  const store = [];
  const stash = (m) => { store.push(m); return '' + (store.length - 1) + ''; };
  text = text.replace(/<[^>]+>/g, stash);
  text = text.replace(/\{[^{}]*\}/g, stash);
  // Telegram bot commands like /skip /done — must remain typeable
  text = text.replace(/(^|\s)\/[a-zA-Z][a-zA-Z0-9_]*/g, (m, lead) => lead + stash(m.slice(lead.length)));
  for (const b of _UZ_BRANDS) {
    if (text.includes(b)) {
      // Escape regex metachars
      const esc = b.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      text = text.replace(new RegExp(esc, 'g'), stash);
    }
  }
  text = _uzTsLoanwords(text);
  // Digraphs in order
  for (const [from, to] of _UZ_DIGRAPHS) {
    if (text.includes(from)) text = text.split(from).join(to);
  }
  // Word-initial e → э (emas → эмас), after the digraphs so ye → е already;
  // mid-word e (pechene, chek) stays е.
  text = text.replace(new RegExp("(^|[^" + _UZ_LETTER + "'ʻ’\\d_])([eE])", 'g'), (m, lead, e) => lead + (e === 'E' ? 'Э' : 'э'));
  // Single letters
  text = Array.from(text).map((ch) => _UZ_SINGLES[ch] !== undefined ? _UZ_SINGLES[ch] : ch).join('');
  // Restore stashed pieces
  text = text.replace(/(\d+)/g, (_, i) => store[Number(i)]);
  return text;
}

// Build the active locale dict. "uz_cyr" auto-derives from L.uz so the
// Mini App doesn't need a third hand-written string table.
function buildActiveLocale() {
  if (lang === 'uz_cyr') {
    const base = L.uz;
    const out = {};
    for (const k in base) {
      out[k] = (typeof base[k] === 'string') ? latToCyr(base[k]) : base[k];
    }
    return out;
  }
  return L[lang] || L.uz;
}

async function switchLanguage(newLang) {
  const btns = document.querySelectorAll('.lang-btn');
  btns.forEach(b => b.disabled = true);
  try {
    lang = newLang;
    t = buildActiveLocale();
    try { localStorage.setItem('ketoshop_lang', lang); } catch (_) { /* quota — ignore */ }
    applyLanguage();
    // Save to server
    try { await api('/api/lang', { method: 'POST', body: JSON.stringify({ lang }) }); } catch (_) { /* server-side preference is best-effort */ }
    // Reload dynamic content. loadPromo() and not renderPromoBanners(): the
    // two standing-promise lines are worded by the SERVER (see api_promo),
    // so re-rendering the cached payload would keep showing them in the old
    // language — which is exactly what happened after a switch to Cyrillic.
    renderCatalogCategories();
    loadPromo();
    loadProducts();
    renderHomePage();
    if (activePage === 'cart') renderCartPage();
    if (activePage === 'profile') renderProfilePage();
    if (activePage === 'fav') renderFavPage();
    if (activePage === 'orders') loadOrdersPage();
    if (activePage === 'games') renderGamesPage();
  } finally {
    btns.forEach(b => b.disabled = false);
  }
}

const AUTH = 'tma ' + tg.initData;
function apiHeaders() {
  return { 'Authorization': AUTH, 'Content-Type': 'application/json' };
}
async function api(path, opts = {}) {
  const res = await fetch(path, { headers: apiHeaders(), ...opts });
  if (!res.ok) {
    let body = null;
    try { body = await res.json(); } catch(_) {}
    // The server refuses buyers the bot can't reach (never pressed START,
    // or blocked it) — show the "start the bot" screen instead of an error.
    if (res.status === 403 && body && body.error === 'start_bot') showStartGate(body.bot);
    const err = new Error(res.status);
    err.status = res.status;
    err.body = body;
    throw err;
  }
  return res.json();
}

// ===== SITE ANALYTICS (owner, 2026-10-18) =====
// "Saytni har bir qismi kuzatib borilishi kerak … qaysi qismida odamlar
// ko'proq qolib ketishyapti": which screen the buyer is on and for how long
// (only while the app is on screen), where each product was opened from,
// how far down every screen was scrolled, which home rows came into view,
// searches, cart adds, favourites, games and the checkout steps. Batched to
// /api/track every 15 s and whenever the app is hidden. Fire-and-forget:
// tracking never waits on the network and never breaks the shop.
const Trk = (() => {
  const SCROLLED = new Set(['home', 'catalog', 'product', 'set', 'recipe', 'fav', 'cart', 'checkout', 'orders', 'profile', 'games', 'game', 'promo']);
  const MODAL_EL = { product: 'detail-modal', set: 'detail-modal', recipe: 'recipe-modal', promo: 'promo-modal' };
  const newSid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  let sid = newSid();
  const q = [];
  let base = { s: 'home', r: null };
  const stack = [];                       // open windows over the page, top last
  let cur = null, since = 0, depth = 0, depthSent = false, hiddenAt = 0;
  let lastTap = null, lastTapAt = 0, io = null, rowSeen = new Set();
  const observed = new WeakSet();
  const shown = () => !document.hidden;

  function push(k, s, r, f, ms) {
    const e = { k };
    if (s != null) e.s = String(s);
    if (r != null && r !== '') e.r = String(r).slice(0, 80);
    if (f) e.f = String(f).slice(0, 48);
    if (ms != null && isFinite(ms)) e.ms = Math.max(0, Math.round(ms));
    q.push(e);
    if (q.length >= 40) flush();
  }
  function book() {                       // the visible time on the current screen so far
    if (!cur || !since) return;
    const ms = performance.now() - since;
    since = shown() ? performance.now() : 0;
    if (ms >= 500) push('time', cur.s, cur.r, null, Math.min(ms, 300000));
  }
  function sendDepth() {
    if (cur && SCROLLED.has(cur.s) && depth > 0 && !depthSent) push('scroll', cur.s, cur.r, null, depth);
    depthSent = true;
  }
  function windowDepth() {
    const el = document.scrollingElement || document.documentElement;
    if (!el || el.scrollHeight <= 0) return 0;
    return Math.round(Math.min(1, (window.scrollY + window.innerHeight) / el.scrollHeight) * 100);
  }
  function enter(scr, back) {
    if (cur && cur.s === scr.s && String(cur.r) === String(scr.r)) return;
    book(); sendDepth();
    cur = scr; since = shown() ? performance.now() : 0; depthSent = false;
    depth = stack.length ? 0 : windowDepth();
    push('view', scr.s, scr.r, back ? 'back' : scr.f);
  }
  const top = () => stack[stack.length - 1] || base;
  function isOpen(m) {
    if (MODAL_EL[m.s]) { const el = document.getElementById(MODAL_EL[m.s]); return !!(el && el.classList.contains('show')); }
    if (m.s === 'game') { const el = document.getElementById('page-games'); return base.s === 'games' && !!(el && el.classList.contains('playing')); }
    return true;
  }
  function prune() {                      // drop windows that closed without telling us
    for (let i = stack.length - 1; i >= 0; i--) if (!isOpen(stack[i])) stack.splice(i, 1);
  }
  function srcOf() {
    const el = Date.now() - lastTapAt < 4000 ? lastTap : null;
    if (el && el.closest) {
      const row = el.closest('[data-row]');
      if (row) return 'home:' + row.dataset.row;
      if (el.closest('#recipe-modal')) { const r = stack.find(m => m.s === 'recipe'); return 'recipe' + (r && r.r ? ':' + r.r : ''); }
      if (el.closest('#detail-modal')) return 'product';
      if (el.closest('#page-catalog')) {
        const qv = (document.getElementById('catalog-search') || {}).value || '';
        return qv.trim().length >= 2 ? 'search' : 'catalog:' + (base.s === 'catalog' && base.r ? base.r : 'all');
      }
      const pg = el.closest('.page');
      if (pg && pg.id) return pg.id.replace('page-', '');
    }
    const t = top();
    return t.s + (t.r ? ':' + t.r : '');
  }
  function flush() {
    if (!q.length) return;
    const ev = q.splice(0, 60);
    try {
      fetch('/api/track', { method: 'POST', headers: apiHeaders(), keepalive: true,
                            body: JSON.stringify({ sid, ev }) }).catch(() => {});
    } catch (_) {}
  }
  document.addEventListener('pointerdown', e => { lastTap = e.target; lastTapAt = Date.now(); }, { capture: true, passive: true });
  document.addEventListener('scroll', e => {
    const t = e.target === document ? (document.scrollingElement || document.documentElement) : e.target;
    if (!t || !(t.scrollHeight - t.clientHeight > 4)) return;          // sideways rows don't count
    const pct = Math.round(Math.min(1, (t.scrollTop + t.clientHeight) / t.scrollHeight) * 100);
    if (pct > depth) depth = pct;
  }, { capture: true, passive: true });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { book(); sendDepth(); hiddenAt = Date.now(); flush(); return; }
    if (hiddenAt && Date.now() - hiddenAt > 30 * 60 * 1000) {        // back after 30+ min: a new visit
      sid = newSid(); rowSeen = new Set();
      push('open', null, 'resume', tg.platform || '');
      const s = cur; cur = null; if (s) enter(s);
    }
    since = performance.now();
  });
  window.addEventListener('pagehide', () => { book(); sendDepth(); flush(); });
  setInterval(() => { if (shown()) { book(); flush(); } }, 15000);

  return {
    start(entry) { push('open', null, entry, tg.platform || ''); enter(top()); },
    page(p, r) { prune(); base = { s: p, r: r == null ? null : r }; if (!stack.length) enter(base); },
    cat(key) { if (base.s !== 'catalog') return; base = { s: 'catalog', r: key }; prune(); if (!stack.length) enter(base); },
    open(s, r, f) {
      prune();
      const m = { s, r: r == null ? null : r, f: f || srcOf() };
      const t = stack[stack.length - 1];
      if (t && MODAL_EL[t.s] && MODAL_EL[t.s] === MODAL_EL[s]) stack.pop();   // same window, new content
      stack.push(m); enter(m);
    },
    close(s) {
      const hit = m => (s === 'detail' ? (m.s === 'product' || m.s === 'set') : m.s === s);
      let i = stack.length - 1;
      while (i >= 0 && !hit(stack[i])) i--;
      if (i < 0) return;
      stack.splice(i, 1); prune(); enter(top(), true);
    },
    from() { const m = stack.find(x => x.s === 'product' || x.s === 'set'); return m ? m.f : srcOf(); },
    ev: push,
    rows(root) {
      if (!root || !window.IntersectionObserver) return;
      io = io || new IntersectionObserver(es => es.forEach(e => {
        if (!e.isIntersecting) return;
        const k = e.target.dataset.row;
        io.unobserve(e.target);
        if (!rowSeen.has(k)) { rowSeen.add(k); push('row', 'home', k); }
      }), { threshold: 0.4 });
      const els = [...root.querySelectorAll('[data-row]')];
      if (root.dataset && root.dataset.row) els.push(root);
      els.forEach(el => { if (!observed.has(el)) { observed.add(el); io.observe(el); } });
    },
  };
})();
function trk(fn) { try { fn(); } catch (_) {} }

// ===== SYSTEM BACK BUTTON =====
// Telegram exposes tg.BackButton (Android hardware back, iOS swipe-back, and
// the in-app back arrow). Without this hooked up, system-back closes the
// whole Mini App — pressing it after opening a product detail dropped the
// buyer all the way out instead of just closing the modal.
function _isModalOpen(id) {
  const el = document.getElementById(id);
  return el && el.classList.contains('show');
}

function onBackPressed() {
  // Highest-priority overlays win.
  if (_isModalOpen('map-modal')) { closeMapPicker(); return; }
  if (_isModalOpen('detail-modal')) { closeDetail(); return; }
  if (_isModalOpen('recipe-modal')) { closeRecipe(); return; }
  if (_isModalOpen('site-fb-modal')) { closeSiteFeedback(true); return; }
  // Inside a game, back returns to the games menu first.
  if (activePage === 'games' && gameState) { renderGamesPage(); return; }
  // Then page-level: anywhere except home → go home. (Home itself has
  // BackButton hidden, so Telegram handles back natively → app closes.)
  if (activePage && activePage !== 'home') {
    switchPage('home');
  }
}

function updateBackButton() {
  if (!tg.BackButton) return;
  const shouldShow = (
    _isModalOpen('map-modal') ||
    _isModalOpen('detail-modal') ||
    _isModalOpen('recipe-modal') ||
    _isModalOpen('site-fb-modal') ||
    (activePage && activePage !== 'home')
  );
  if (shouldShow) tg.BackButton.show();
  else tg.BackButton.hide();
}

if (tg.BackButton) {
  tg.BackButton.onClick(onBackPressed);
}

function foodCarbs(f) { return gx('~' + f[2] + ' g', '~' + f[2] + ' г'); }

function foodCardHtml(f, i, tag) {
  const name = foodName(f);
  const inner =
    '<span class="food-mono" aria-hidden="true">' + escapeHtml(name.charAt(0)) + '</span>' +
    '<span class="food-name">' + escapeHtml(name) + '</span>' +
    '<span class="food-sub">100 ' + gx('g', 'г') + '</span>';
  return tag === 'button'
    ? '<button type="button" class="food-card duel-card" ' + gameToneStyle(i) + ' onclick="answerDuel(' + i + ')">' + inner + '<span class="duel-carbs"></span></button>'
    : '<div class="food-card" ' + gameToneStyle(i) + '>' + inner + '</div>';
}

function gameRevealHtml(ok, verdictText, bodyHtml, shopCat, nextLabel, nextFn) {

    '<span class="game-verdict ' + (ok ? 'ok' : 'bad') + '">' + (ok ? '✓ ' : '✗ ') + escapeHtml(verdictText) + '</span>' +

      (shopCat ? '<button type="button" class="game-shop" onclick="gameToShop(\'' + shopCat + '\')">' + escapeHtml(gx("Do'konda ko'rish", 'Смотреть в магазине')) + ' →</button>' : '') +
      '<button type="button" class="game-next" onclick="' + nextFn + '">' + escapeHtml(nextLabel) + '</button>' +
    '</div></div>';
}

function showGameReveal(html) {
  const slot = document.getElementById('game-reveal-slot');
  slot.innerHTML = html;
  const box = slot.firstElementChild;
  if (box && box.scrollIntoView) box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

function gameNextLabel(isLast) {
  return isLast ? gx('Natijani ko\'rish', 'Посмотреть результат') : gx('Keyingisi', 'Дальше');
}

// ── 1. Keto mi, emas mi? ─────────────────────────────────────────────
function startKetoGame() {
  const yes = gameShuffle(GAME_FOODS.filter(f => f[3])).slice(0, 5);
  const no = gameShuffle(GAME_FOODS.filter(f => !f[3])).slice(0, 5);
  gameState = { id: 'keto', items: gameShuffle(yes.concat(no)), i: 0, score: 0, marks: [], answered: false };
  renderKetoRound();
}

function renderKetoRound() {
  const s = gameState;
  const f = s.items[s.i];
  setGameScreen('keto', s.score + '/' + s.items.length,
    gameProgressHtml(s.marks, s.items.length) +
    foodCardHtml(f, s.i) +
    '<div class="game-answers" id="keto-answers">' +
      '<button type="button" class="game-btn yes" onclick="answerKeto(true)">✓ ' + escapeHtml(gx('Keto', 'Кето')) + '</button>' +
      '<button type="button" class="game-btn no" onclick="answerKeto(false)">✗ ' + escapeHtml(gx('Keto emas', 'Не кето')) + '</button>' +
    '</div>' +
    '<div id="game-reveal-slot"></div>');
}

function answerKeto(saysKeto) {
  const s = gameState;
  if (!s || s.id !== 'keto' || s.answered) return;
  s.answered = true;
  const f = s.items[s.i];
  const ok = saysKeto === f[3];
  if (ok) s.score++;
  s.marks.push(ok);
  gameHaptic(ok);
  document.querySelectorAll('#keto-answers .game-btn').forEach(b => { b.disabled = true; });
  document.getElementById('game-score').textContent = s.score + '/' + s.items.length;
  const verdict = ok ? gx("To'g'ri!", 'Верно!') : gx("Noto'g'ri", 'Неверно');
  const body =
    '<div class="game-carbs">' + foodCarbs(f) + ' <small>' + escapeHtml(gx('sof uglevod 100 g da', 'чистых углеводов на 100 г')) + '</small></div>' +
    '<div class="game-fact"><b>' + escapeHtml(f[3] ? gx('Keto uchun mos.', 'Подходит для кето.') : gx('Keto uchun mos emas.', 'Не подходит для кето.')) + '</b> ' +
      escapeHtml(gx(f[5], f[6])) + '</div>';
  showGameReveal(gameRevealHtml(ok, verdict, body, f[4], gameNextLabel(s.i === s.items.length - 1), 'nextKetoRound()'));
}

function nextKetoRound() {
  const s = gameState;
  if (!s || s.id !== 'keto') return;
  s.i++;
  s.answered = false;
  if (s.i >= s.items.length) { finishGame('keto', s.score, s.items.length); return; }
  renderKetoRound();
  window.scrollTo(0, 0);
}

// ── 2. Qaysi birida uglevod kam? ─────────────────────────────────────
const DUEL_MAX = 12;

function startDuelGame() {
  gameState = { id: 'duel', streak: 0, used: new Set(), pair: null, answered: false };
  renderDuelRound();
}

function pickDuelPair() {
  const s = gameState;
  for (let tries = 0; tries < 300; tries++) {
    const a = GAME_FOODS[Math.floor(Math.random() * GAME_FOODS.length)];
    const b = GAME_FOODS[Math.floor(Math.random() * GAME_FOODS.length)];
    // Ties and near-ties are not fair questions with rounded figures.
    if (a === b || Math.abs(a[2] - b[2]) < 3) continue;
    const key = [a[0], b[0]].sort().join('|');
    if (s.used.has(key)) continue;
    s.used.add(key);
    return [a, b];
  }
  return [GAME_FOODS[0], GAME_FOODS[18]];
}

function renderDuelRound() {
  const s = gameState;
  s.pair = pickDuelPair();
  s.answered = false;
  setGameScreen('duel', '🔥 ' + s.streak,
    '<div class="duel-q">' + escapeHtml(gx('Qaysi birida sof uglevod kamroq?', 'В чём меньше чистых углеводов?')) + '</div>' +
    '<div class="duel" id="duel">' + foodCardHtml(s.pair[0], 0, 'button') + foodCardHtml(s.pair[1], 1, 'button') +
      '<div class="duel-vs" aria-hidden="true">VS</div></div>' +
    '<div id="game-reveal-slot"></div>');
}

function answerDuel(k) {
  const s = gameState;
  if (!s || s.id !== 'duel' || s.answered) return;
  s.answered = true;
  const pick = s.pair[k];
  const other = s.pair[1 - k];
  const ok = pick[2] < other[2];
  const cards = document.querySelectorAll('#duel .duel-card');
  cards.forEach((c, i) => {
    c.disabled = true;
    c.querySelector('.duel-carbs').textContent = foodCarbs(s.pair[i]);
    c.classList.add(s.pair[i][2] < s.pair[1 - i][2] ? 'win' : 'lose');
  });
  cards[k].classList.add('picked');
  gameHaptic(ok);
  const low = ok ? pick : other;
  const high = ok ? other : pick;
  const fact = '<div class="game-fact">' + escapeHtml(gx(
    foodName(low) + ': ' + foodCarbs(low) + ', ' + foodName(high) + ': ' + foodCarbs(high) + '. ' + low[5],
    foodName(low) + ': ' + foodCarbs(low) + ', ' + foodName(high) + ': ' + foodCarbs(high) + '. ' + low[6])) + '</div>';
  if (ok) {
    s.streak++;
    document.getElementById('game-score').textContent = '🔥 ' + s.streak;
    const done = s.streak >= DUEL_MAX;
    showGameReveal(gameRevealHtml(true, gx("To'g'ri! Seriya: ", 'Верно! Серия: ') + s.streak, fact, low[4],
      gameNextLabel(done), done ? 'finishGame(\'duel\', ' + s.streak + ', ' + DUEL_MAX + ')' : 'renderDuelRound()'));
  } else {
    showGameReveal(gameRevealHtml(false, gx('Seriya tugadi', 'Серия прервалась'), fact, low[4],
      gameNextLabel(true), 'finishGame(\'duel\', ' + s.streak + ', ' + DUEL_MAX + ')'));
  }
}

function startQuizGame() {

function renderQuizRound() {
  const s = gameState;

}

function answerQuiz(pos) {
  const s = gameState;
  if (!s || s.id !== 'quiz' || s.answered) return;
  s.answered = true;
  const { item, order } = s.items[s.i];

function nextQuizRound() {

// ── 4. Juftini top ───────────────────────────────────────────────────
function startMemoryGame() {
  const cards = [];
  const pairs = gameShuffle(GAME_PAIRS).slice(0, MEMORY_PAIRS);
  pairs.forEach((pair, i) => {
    cards.push({ pair: i, kind: 'product', text: pair[0] });
    cards.push({ pair: i, kind: 'benefit', text: pair[1] });
  });
  gameState = { id: 'memory', cards: gameShuffle(cards), pairs: pairs.length, open: [], found: 0, moves: 0, lock: false };
  const s = gameState;
  setGameScreen('memory', memoryScoreText(0),
    '<p class="games-intro mem-hint">' + escapeHtml(gx(
      "Kartani oching va mahsulotni uning foydasi bilan juftlang.",
      'Открывайте карточки и соединяйте продукт с его пользой.')) + '</p>' +
    '<div class="mem-grid" id="mem-grid">' + s.cards.map((c, k) =>
      '<button type="button" class="mem-card" data-k="' + k + '" onclick="flipMemory(' + k + ')" aria-label="' + escapeHtml(gx('Karta', 'Карточка')) + ' ' + (k + 1) + '">' +
        '<span class="mem-face mem-back" aria-hidden="true">?</span>' +
        '<span class="mem-face mem-front kind-' + c.kind + '">' + escapeHtml(gx(c.text[0], c.text[1])) + '</span>' +
      '</button>').join('') + '</div>');
}

function memoryScoreText(moves) {
  return gx(moves + ' urinish', moves + ' попыт.');
}

function flipMemory(k) {
  const s = gameState;
  if (!s || s.id !== 'memory' || s.lock) return;
  const el = document.querySelector('.mem-card[data-k="' + k + '"]');
  if (!el || el.classList.contains('open') || el.classList.contains('done')) return;
  el.classList.add('open');
  s.open.push(k);
  if (s.open.length < 2) return;

  s.moves++;
  document.getElementById('game-score').textContent = memoryScoreText(s.moves);
  const [a, b] = s.open;
  const els = s.open.map(i => document.querySelector('.mem-card[data-k="' + i + '"]'));
  s.open = [];
  if (s.cards[a].pair === s.cards[b].pair) {
    s.found++;
    gameHaptic(true);
    els.forEach(e => { e.classList.add('done'); e.disabled = true; });
    if (s.found === s.pairs) setTimeout(() => finishGame('memory', s.moves, s.pairs), 700);
  } else {
    s.lock = true;
    gameHaptic(false);
    els.forEach(e => e.classList.add('miss'));
    setTimeout(() => {
      els.forEach(e => e.classList.remove('open', 'miss'));
      s.lock = false;
    }, 950);
  }
}

// ── Result screen ────────────────────────────────────────────────────
function finishGame(id, value, total) {
  if (!gameState || gameState.id !== id) return;
  trk(() => Trk.ev('game', 'game', id, null, value));
  gameState.finished = true;
  const record = saveGameBest(id, value);
  let big, msg, great;
  if (id === 'memory') {
    big = String(value);
    great = value <= total + 3;
    msg = gx(value + ' urinishda hammasini topdingiz', 'Всё найдено за ' + value + ' попыток');
  } else if (id === 'duel') {
    big = String(value);
    great = value >= 6;
    msg = value >= total ? gx('Barcha savollar to\'g\'ri — zo\'r!', 'Все ответы верные — отлично!')
                         : gx(value + ' ta ketma-ket to\'g\'ri javob', value + ' верных ответов подряд');
  } else {
    big = value + '/' + total;
    great = value >= total * 0.8;
    msg = great ? gx('Ajoyib! Siz keto bilimdonisiz', 'Отлично! Вы знаток кето')
        : value >= total * 0.5 ? gx('Yaxshi natija!', 'Хороший результат!')
        : gx('Yana bir bor urinib ko\'ring', 'Попробуйте ещё раз');
  }
  const sub = record ? gx('Yangi rekord! 🎉', 'Новый рекорд! 🎉') : gameBestLabel(id);
  setGameScreen(id, '',
    '<div class="game-result" id="game-result">' +
      '<div class="game-result-big">' + escapeHtml(big) + '</div>' +
      '<div class="game-result-msg">' + escapeHtml(msg) + '</div>' +
      '<div class="game-result-sub">' + escapeHtml(sub) + '</div>' +
      '<div class="game-actions">' +
        '<button type="button" class="game-again" onclick="openGame(\'' + id + '\')">' + escapeHtml(gx("Qayta o'ynash", 'Сыграть ещё')) + '</button>' +
        '<button type="button" class="game-other" onclick="renderGamesPage()">' + escapeHtml(gx("Boshqa o'yin", 'Другая игра')) + '</button>' +
      '</div>' +
    '</div>' +
    '<button type="button" class="game-shop game-shop-wide" onclick="gameToShop(\'keto_flour\')">' +
      escapeHtml(gx("Keto mahsulotlarini ko'rish", 'Смотреть кето-продукты')) + ' →</button>');
  if (great || record) launchConfetti(document.getElementById('game-result'));
  gameHaptic(true);
  renderGamesTeaser();
}

// ===== SAYT HAQIDA FIKR (site feedback) =====
// Owner, 2026-10-13: ask buyers who have spent over a minute on the site how
// convenient it is — five stars and a comment — and send it to the admins
// (POST /api/site-feedback → site_feedback.py). Asked once per phone: after a
// send it never comes back; ✕ (or back / a tap outside) postpones it for a
// week. It waits for a quiet moment — never over checkout, payment, an open
// sheet or a running game. Only visible time counts towards the minute.
const SITE_FB_KEY = 'ketoshop_site_fb';
const SITE_FB_AFTER_MS = 60000;
const SITE_FB_SNOOZE_MS = 7 * 864e5;
const SITE_FB_FACES = ['😊', '😔', '😕', '🙂', '😊', '😍'];
let siteFbRating = 0;
let siteFbOpenedOnce = false;

function _siteFbState() {
  try { return JSON.parse(localStorage.getItem(SITE_FB_KEY) || '{}') || {}; } catch (_) { return {}; }
}
function _siteFbSave(state) {
  try { localStorage.setItem(SITE_FB_KEY, JSON.stringify(state)); } catch (_) { /* quota — ignore */ }
}
function _siteFbDue() {
  const s = _siteFbState();
  if (s.sent) return false;
  return !(s.snoozed && Date.now() - s.snoozed < SITE_FB_SNOOZE_MS);
}
function _siteFbQuietMoment() {
  if (['checkout', 'cheque', 'order-success'].includes(activePage)) return false;
  if (activePage === 'games' && typeof gameState !== 'undefined' && gameState) return false;
  return !document.querySelector('.modal-overlay.show, .map-modal.show');
}
function _siteFbPaint() {
  document.querySelectorAll('#site-fb-stars button').forEach(b => {
    b.classList.toggle('on', +b.dataset.star <= siteFbRating);
  });
  document.getElementById('site-fb-emoji').textContent = SITE_FB_FACES[siteFbRating];
  const comment = document.getElementById('site-fb-comment').value.trim();
  document.getElementById('site-fb-send').disabled = !(siteFbRating > 0 || comment);
}

function openSiteFeedback() {
  siteFbOpenedOnce = true;
  siteFbRating = 0;
  document.getElementById('site-fb-title').textContent = gx('Saytimiz sizga qulaymi?', 'Удобен ли вам наш сайт?');
  document.getElementById('site-fb-sub').textContent = gx(
    "Fikringiz biz uchun juda muhim — saytni yanada qulay qilishga yordam beradi. Yulduzcha qo'ying yoki bir-ikki so'z yozing.",
    'Ваше мнение очень важно — оно поможет сделать сайт ещё удобнее. Поставьте звёзды или напишите пару слов.');
  const comment = document.getElementById('site-fb-comment');
  comment.value = '';
  comment.placeholder = gx("Nima yoqdi, nimani yaxshilaylik? (ixtiyoriy)", 'Что понравилось, что улучшить? (необязательно)');
  document.getElementById('site-fb-close').setAttribute('aria-label', gx('Yopish', 'Закрыть'));
  document.querySelectorAll('#site-fb-stars button').forEach(b => {
    b.setAttribute('aria-label', b.dataset.star + ' / 5');
  });
  const send = document.getElementById('site-fb-send');
  send.textContent = gx('Yuborish', 'Отправить');
  _siteFbPaint();
  document.getElementById('site-fb-modal').classList.add('show');
  updateBackButton();
}

function closeSiteFeedback(snooze) {
  document.getElementById('site-fb-modal').classList.remove('show');
  if (snooze) _siteFbSave({ snoozed: Date.now() });
  updateBackButton();
}

async function sendSiteFeedback() {
  const send = document.getElementById('site-fb-send');
  const comment = document.getElementById('site-fb-comment').value.trim();
  if (!(siteFbRating > 0 || comment)) return;
  send.disabled = true;
  send.textContent = gx('Yuborilmoqda...', 'Отправляем...');
  try {
    await api('/api/site-feedback', { method: 'POST', body: JSON.stringify({ rating: siteFbRating, comment }) });
    _siteFbSave({ sent: Date.now() });
    closeSiteFeedback(false);
    showToast(gx('Rahmat! Fikringiz bizga yetib keldi 💛', 'Спасибо! Ваш отзыв получен 💛'));
    try { tg.HapticFeedback.notificationOccurred('success'); } catch (_) {}
  } catch (e) {
    console.error('Site feedback error:', e);
    showToast(t.errorLoad, true);
    send.textContent = gx('Yuborish', 'Отправить');
    _siteFbPaint();
  }
}

document.querySelectorAll('#site-fb-stars button').forEach(b => {
  b.addEventListener('click', () => { siteFbRating = +b.dataset.star; _siteFbPaint(); });
});
document.getElementById('site-fb-comment').addEventListener('input', _siteFbPaint);
document.getElementById('site-fb-modal').addEventListener('click', function (e) {
  if (e.target === this) closeSiteFeedback(true);
});

(function initSiteFeedback() {
  if (!_siteFbDue()) return;
  const TICK = 5000;
  let visibleMs = 0;
  const timer = setInterval(() => {
    if (document.visibilityState === 'visible') visibleMs += TICK;
    if (visibleMs >= SITE_FB_AFTER_MS && !siteFbOpenedOnce && _siteFbQuietMoment()) {
      clearInterval(timer);
      openSiteFeedback();
    }
  }, TICK);
})();

async function checkStartGate(manual) {
  let ok = false;
  try { ok = !!(await fetch('/api/bot-access', { headers: apiHeaders() }).then(r => r.json())).ok; } catch (_) {}
  if (ok) {
    clearInterval(_startGateTimer); _startGateTimer = null;
    location.reload();   // boot the shop from scratch now that it may load
  } else if (manual) {
    const note = document.getElementById('start-gate-note');
    if (note) note.textContent = t.startGateWaiting;
  }
  return ok;
}

(async function init() {
  // Paint immediately with the language we already know locally
  // (localStorage / Telegram's language_code — set synchronously above at
  // module load) instead of leaving the buyer staring at a blank shell
  // while we wait on a network round trip just to double-check it.
  applyLanguage();
  updateBackButton();

  // Nothing loads for a buyer the bot can't reach — they get the START card.
  try {
    const access = await fetch('/api/bot-access', { headers: apiHeaders() }).then(r => r.json());
    if (access && access.ok === false) { showStartGate(access.bot); return; }
  } catch (_) { /* network trouble — carry on; the server still guards every call */ }
  trk(() => {
    const sp = (tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
    const qs = new URLSearchParams(location.search);
    Trk.start((qs.get('recipe') || sp.startsWith('recipe-')) ? 'recipe'
      : qs.get('product') ? 'product' : qs.get('game') ? 'game' : sp ? 'link' : 'direct');
  });
  Butterfly.start();
  Birdsong.start();

  // Reconcile the server-saved language preference in the background; only
  // re-render text if it actually differs from our local guess.
  const langPromise = api('/api/lang').then(langData => {
    if (langData.is_admin) Birdsong.admin();
    if (langData.lang && L[langData.lang] && langData.lang !== lang) {
      lang = langData.lang;
      t = buildActiveLocale();
      try { localStorage.setItem('ketoshop_lang', lang); } catch (_) { /* quota — ignore */ }
      applyLanguage();
    }
  }).catch(() => { /* use local fallback */ });

  const ketoRatePromise = api('/api/keto/status')
    .then(s => { ketoRate = (s && s.rate) || 0; })
    .catch(() => { /* no badges */ });

  try {
    categories = await api('/api/categories');
    await ketoRatePromise;
    await loadPromo();
    renderHomePage();
    renderCatalogCategories();
    await loadProducts();
    await loadCart();

    // Deep link: ?product=<id> on the Mini App URL (used by admin broadcasts —
    // e.g. a low-stock alert with a "tap here" button) opens straight into
    // that product's detail modal instead of landing on the home page.
    const dpId = parseInt(new URLSearchParams(location.search).get('product'), 10);
    if (!isNaN(dpId)) {
      openDetail(dpId).catch(() => {});
    }
    // ?game=quiz|keto|duel|memory — the "🎮 Davom etish — saytda" button
    // under the bot's question opens straight into that game.
    const deepGame = new URLSearchParams(location.search).get('game');
    if (deepGame && GAMES.some(g => g.id === deepGame)) openGame(deepGame);
    // The channel's recipe link (recipe_channel.py) opens that recipe:
    // ?startapp=recipe-<slug> arrives as start_param, the bot's «📖 Retseptni
    // ochish» button as ?recipe=<slug>.
    const startParam = (tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
    const deepRecipe = new URLSearchParams(location.search).get('recipe')
      || (startParam.startsWith('recipe-') ? startParam.slice(7) : '');
    if (deepRecipe) {
      if (!recipesData) await loadRecipes();
      if (recipesData) await openRecipe(deepRecipe);
    }
  } catch(e) {
    console.error('Init error:', e);
    showToast(t.errorLoad, true);
  }

  await langPromise;
})();

// ===== SAVAT BRONI: "⏳ Band" (owner, 2026-10-13) =====
// A product whose last pieces all sit in other buyers' carts comes from the
// server as out_of_stock + held_out. It isn't sold out — it may come back
// within a few hours — so wherever a card or the detail view would say "sold out /
// coming soon", it says "⏳ Hozircha band" instead. Done as a pass over the
// rendered element, so it holds whatever the out-of-stock markup looks like.
function markHeld(root) {
  if (!root) return;
  const soldOut = [t.comingSoon, t.soldOutStamp, t.outOfStock].filter(Boolean);
  root.querySelectorAll('*').forEach(el => {
    if (el.children.length === 0 && soldOut.includes((el.textContent || '').trim())) {
      el.textContent = t.heldOut;
    }
  });
}
(function showHeldAsBand() {
  const card = createProductCard, carousel = createCarouselCard, detail = openDetail;
  createProductCard = function (p) {
    const el = card.apply(this, arguments);
    if (p && p.held_out) markHeld(el);
    return el;
  };
  createCarouselCard = function (p) {
    const el = carousel.apply(this, arguments);
    if (p && p.held_out) markHeld(el);
    return el;
  };
  openDetail = async function () {
    const result = await detail.apply(this, arguments);
    if (currentProduct && currentProduct.held_out) markHeld(document.getElementById('detail-modal'));
    return result;
  };
})();

// ===== TACTILE POLISH =====
// A light haptic tick on every control tap. Telegram already gets one on a
// few specific actions (add-to-cart, order placed); this generalises it to
// the whole UI, which is most of what makes a web view feel like a real app
// rather than a page. Delegated from the document so it covers controls that
// are re-rendered by innerHTML — binding per element would miss those.
//
// Guarded three ways: the API is absent on old clients, throws on some
// desktop builds, and must never break the tap it is decorating.
(function initHaptics() {
  const TAP = '.add-to-cart-btn,.btn-checkout,.checkout-submit-btn,.cheque-pick-btn,'
            + '.home-hero-cta,.promo-banner,.cart-nudge-add,.review-submit-btn';
  const LIGHT = '.cat-tab,.qty-btn,.qty-step,.btn-clear,.tab-item,.card-fav-btn,'
              + '.detail-fav-btn,.modal-close,.promo-strip,.checkout-back-btn,'
              + '.location-btn,.cheque-pay-later-btn,.lang-btn,.remove-btn,'
              + '.game-tile,.game-next,.game-back,.game-shop,.mem-card';

  document.addEventListener('pointerdown', (e) => {
    try {
      const h = tg.HapticFeedback;
      if (!h) return;
      if (e.target.closest(TAP)) h.impactOccurred('medium');
      else if (e.target.closest(LIGHT)) h.impactOccurred('light');
    } catch (_) { /* unsupported client — silence is the correct fallback */ }
  }, { passive: true });
})();

// One /api/promo read per session drives the home banner, the catalog strip,
// the 🎁 badges on cards, and the aksiya sheet. Refreshed after every cart

// "Bot orqali buyurtmaga 10% chegirma" card on the home page. Worded and

// The surprise pack (400 000) and free Tashkent delivery (800 000). The
// server sends both lines already worded and translated — the thresholds
// live in config.py, so the client never restates them.
function renderPerks() {
  const perks = promo && promo.perks;
  // "Bot orqali buyurtma qilib, istalgan summaga 10% chegirma" leads the
  // strip while the discount is on (bot_discount.py); "" when it's off.
  const strip = perks

function renderPromoBanners() {

/** 🎁 pill for a product card — p.bonus is the server-rendered rule line. */
// Label for the Keto switch: the title, plus what it takes off right now.
function ketoSwitchHtml(label, applied) {
  const sub = applied > 0
    ? t.ketoSwitchApplied.replace('{amount}', formatPrice(applied))
    : t.ketoSwitchHint.replace('{balance}', formatPrice(keto.balance));

         '<span class="keto-switch-sub">' + sub + '</span></span>';

function bonusBadgeHtml(p) {

}

// "+250 Keto" — the coins this purchase brings back, shown like a bonus.
// Same rounding as the server's award (floor of amount x rate).
function ketoAmount(amount) {
  return ketoRate > 0 ? Math.floor((amount || 0) * ketoRate) : 0;
}
function ketoBadgeHtml(amount) {
  // "+525 Keto" said nothing to a buyer who had never spent one. The badge now
  // states the point outright: this much money comes back (owner, 2026-09-19).
  const n = ketoAmount(amount);
  if (n <= 0) return '';
  const label = (t.ketoBack || 'Pulingiz qaytadi: {n} Keto').replace('{n}', formatPrice(n));
  return '<div class="keto-badge">' + escapeHtml(label) + '</div>';
}

// ===== HOME PAGE =====
// ===== RETSEPTLAR =====
// A new recipe every 2 days at the very top of home (recipes.py). Words and
// labels come from the server in the buyer's language; products are linked
// to the live catalogue, so prices and stock are always current.
let recipesData = null;

function recipeMetaHtml(r, L) {
  const parts = ['⏱ ' + L.minutes.replace('{n}', r.minutes) + (r.rest ? ' ' + r.rest : ''),
                 '🍽 ' + r.servings];
  if (r.per_serving) {
    parts.push(L.carbs.replace('{n}', r.per_serving.carbs));
    parts.push(L.kcal.replace('{n}', r.per_serving.kcal));
  }
  return parts.map(p => '<span>' + escapeHtml(p) + '</span>').join('');
}

async function loadRecipes() {
  const slot = document.getElementById('home-recipe');
  if (!slot) return;
  try {
    recipesData = await api('/api/recipes');
  } catch (e) {
    slot.innerHTML = '';
    return;
  }
  const r = recipesData.current, L = recipesData.labels;
  slot.innerHTML =
    '<div class="recipe-hero" onclick="openRecipe()">' +
      '<div class="rh-photo"><img src="' + r.image_url + '" alt="" loading="eager">' +
        '<span class="rh-badge">' + escapeHtml(L.badge) + '</span></div>' +
      '<div class="rh-body">' +
        '<div class="rh-title">' + escapeHtml(r.title) + '</div>' +
        '<div class="rh-meta">' + recipeMetaHtml(r, L) + '</div>' +
        '<div class="rh-cta"><span>' + escapeHtml(L.open) + '</span><span>›</span></div>' +
      '</div>' +
    '</div>';
}

// Only today's recipe is ever shown — no archive (owner, 2026-10-08:
// "har kuni faqat 1 ta retsept ko'rsat ... hammasini emas"). The one
// exception is a channel link naming an earlier recipe: it opens that one.
async function openRecipe(slug) {
  if (!recipesData) return;
  let r = recipesData.current;
  if (slug && slug !== r.slug) {
    try { r = await api('/api/recipes/' + encodeURIComponent(slug)); } catch (_) {}
  }
  renderRecipe(r);
  try { tg.expand(); } catch (_) {}
  document.getElementById('recipe-modal').classList.add('show');
  trk(() => Trk.open('recipe', r && r.slug));
  updateBackButton();
}

function renderRecipe(r) {
  const L = recipesData.labels;
  document.getElementById('recipe-modal-title').textContent = '';
  document.getElementById('recipe-back-btn').textContent = L.back;
  const ings = r.ingredients.map(i => {
    let html = '<li class="rm-ing"><div class="rm-ing-main"><b>' + escapeHtml(i.name) +
      (i.product === undefined ? '<span class="rm-home">' + escapeHtml(L.from_home) + '</span>' : '') +
      '</b><span class="rm-amt">' + escapeHtml(i.amount) + '</span></div>';
    if (i.product) {
      const p = i.product;
      const img = p.photo_url
        ? '<img src="' + p.photo_url + '" alt="" loading="lazy" onerror="this.outerHTML=\'<div class=rm-noimg>📦</div>\'">'
        : '<div class="rm-noimg">📦</div>';
      const price = p.out_of_stock
        ? '<div class="rm-prod-out">' + escapeHtml(L.out_of_stock) + '</div>'
        : '<div class="rm-prod-price">' + priceHtml(p) + '</div>';
      html += '<div class="rm-prod" onclick="openDetail(' + p.id + ')">' + img +
        '<div><div class="rm-prod-name">' + escapeHtml(p.name) + '</div>' + price + '</div></div>';
    }
    if (i.why) html += '<div class="rm-why">' + escapeHtml(i.why) + '</div>';
    return html + '</li>';
  }).join('');
  // One pack of each in-stock product — exactly what recipeToCart puts in.
  // Pinned to the bottom of the sheet (2026-10-22): mid-page, under the
  // ingredients, the add-all button was almost never pressed.
  const seen = new Set();
  const buy = [];
  r.ingredients.forEach(i => {
    const p = i.product;
    if (p && !p.out_of_stock && !seen.has(p.id)) { seen.add(p.id); buy.push(p); }
  });
  const total = buy.reduce((s, p) => s + (Number(p.price) || 0), 0);
  const cartBar = buy.length
    ? '<div class="rm-cart-bar">' +
        '<div class="rm-cart-info"><b>' + escapeHtml(L.bar_title) + '</b>' +
          '<span class="rm-cart-total">' + formatPrice(total) + ' UZS</span>' +
          '<small>' + escapeHtml(L.bar_count.replace('{n}', buy.length)) + '</small></div>' +
        '<button class="rm-cart-btn" type="button" onclick="recipeToCart(\'' + r.slug + '\', this)">' +
          escapeHtml(L.bar_btn) + '</button>' +
      '</div>'
    : '';
  document.getElementById('recipe-body').innerHTML =
    '<img class="rm-img" src="' + r.image_url + '" alt="">' +
    '<div class="rm-ai">' + escapeHtml(r.ai_note) + '</div>' +
    '<div class="rm-pad">' +
      '<div class="rm-title">' + escapeHtml(r.title) + '</div>' +
      '<p class="rm-intro">' + escapeHtml(r.intro) + '</p>' +
      '<div class="rm-meta">' + recipeMetaHtml(r, L) + '</div>' +
      '<div class="rm-note">' + escapeHtml(L.per_serving) + '</div>' +
      '<h3>' + escapeHtml(L.ingredients) + '</h3><ul class="rm-ings">' + ings + '</ul>' +
      '<h3>' + escapeHtml(L.steps) + '</h3><ol class="rm-steps">' +
        r.steps.map(s => '<li>' + escapeHtml(s) + '</li>').join('') + '</ol>' +
      (r.tip ? '<div class="rm-tip"><b>' + escapeHtml(L.tip) + '</b><br>' + escapeHtml(r.tip) + '</div>' : '') +
      '<div class="rm-next">' + escapeHtml(L.next.replace('{date}', recipesData.next_at)) + '</div>' +
    '</div>' +
    cartBar;
  document.querySelector('#recipe-modal .modal').scrollTop = 0;
}

async function recipeToCart(slug, btn) {
  const L = recipesData.labels;
  if (btn) btn.disabled = true;
  try {
    const res = await api('/api/recipes/' + encodeURIComponent(slug) + '/cart', { method: 'POST' });
    trk(() => Trk.ev('cart_add', 'recipe', slug, 'recipe', res.added.length));
    let msg = res.added.length ? L.added.replace('{n}', res.added.length) : L.already;
    if (res.missing.length) msg += ' · ' + L.missing.replace('{names}', res.missing.join(', '));
    showToast(msg, false, 3500);
    try { tg.HapticFeedback.notificationOccurred('success'); } catch (_) {}
    await loadCart();
    // The ingredients are in the cart now — the bar's next step is the cart.
    if (btn && (res.added.length || res.already.length)) {
      btn.textContent = L.go_cart;
      btn.classList.add('go');
      btn.onclick = () => { closeRecipe(); switchPage('cart'); };
    }
  } catch (e) {
    showToast(t.errorLoad, true);
  } finally {
    if (btn) btn.disabled = false;
  }
}

function closeRecipe() {
  document.getElementById('recipe-modal').classList.remove('show');
  trk(() => Trk.close('recipe'));
  updateBackButton();
}

async function renderHomePage() {
  loadRecipes();
  const container = document.getElementById('home-sections');
  const topSlot = document.getElementById('home-top-carousel');
  const loading = document.getElementById('home-loading');
  container.innerHTML = '';
  topSlot.innerHTML = '';
  loading.style.display = 'block';
  loading.textContent = t.loading;

  try {
    // Load each category's products in parallel
    const promises = categories.map(cat =>
      api('/api/products?category=' + cat.key + '&page=0&per_page=200')
        .then(data => ({ cat, products: data.products || [], total: data.total || 0 }))
        .catch(() => ({ cat, products: [], total: 0 }))
    );
    const [topProducts, results, allProductsResp, topCustomers, popular] = await Promise.all([
      api('/api/top').catch(() => []),
      Promise.all(promises),
      // Every product — the API caps a page at 200, well above the catalogue.
      api('/api/products?page=0&per_page=200').catch(() => ({ products: [] })),
      api('/api/leaderboard').catch(() => []),
      api('/api/popular').catch(() => []),
    ]);
    const allProducts = allProductsResp.products || [];

    loading.style.display = 'none';

    // All-products carousel — auto-rotating, above the banners: the first
    // thing on the page is the whole catalogue moving by.
    if (Array.isArray(allProducts) && allProducts.length) {
      const auto = buildAutoCarousel(allProducts);
      trk(() => { auto.dataset.row = 'carousel'; });
      topSlot.appendChild(auto);
    }

    // «🔥 Ko'p olinadi» right under it, still on the first screen: what
    // people buy most, with «+ Savatga» on the card itself.
    const popularInStock = Array.isArray(popular) ? popular.filter(p => !p.out_of_stock) : [];
    if (popularInStock.length >= 3) {
      const row = buildPopularRow(popularInStock);
      trk(() => { row.dataset.row = 'popular'; });
      topSlot.appendChild(row);
    }

    // Top-3 most-ordered products — podium just below the all-products carousel.
    if (Array.isArray(topProducts) && topProducts.length) {
      const podium = buildPodium(topProducts);
      trk(() => { podium.dataset.row = 'top'; });
      container.appendChild(podium);
    }

    results.forEach(({ cat, products, total }) => {
      if (products.length === 0) return;
      homeProductsCache[cat.key] = products;

      const section = document.createElement('div');
      section.className = 'home-section';
      section.dataset.row = cat.key;

      // Section header
      const header = document.createElement('div');
      header.className = 'section-header';

      const title = document.createElement('div');
      title.className = 'section-title';
      title.textContent = cat.name;

      header.appendChild(title);
      section.appendChild(header);

      // Carousel — every product in the category, no "N more" pager;
      // the buyer just scrolls the row to see the rest.
      const carousel = document.createElement('div');
      carousel.className = 'carousel';
      products.forEach(p => {
        carousel.appendChild(createCarouselCard(p));
      });
      section.appendChild(carousel);
      container.appendChild(section);
    });

    trk(() => { Trk.rows(topSlot); Trk.rows(container); });

    // Most-active-customers podium — marketing hook so buyers compete for a spot.
    // A little confetti burst the first time it scrolls into view.
    if (Array.isArray(topCustomers) && topCustomers.length) {
      const podiumSection = buildCustomerPodium(topCustomers);
      container.appendChild(podiumSection);
      podiumSection.dataset.row = 'customers';
      trk(() => Trk.rows(podiumSection));
      const io = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            launchConfetti(podiumSection);
            io.disconnect();
          }
        });
      }, { threshold: 0.4 });
      io.observe(podiumSection);
    }

    if (container.children.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="emoji">📦</div><div>' + t.empty + '</div></div>';
    }
  } catch(e) {
    loading.style.display = 'none';
    console.error('Home load error:', e);
    showToast(t.errorLoad, true);
  }
}

function buildPodium(top) {
  // Three of the shop's recent bestsellers, rotated daily
  // (database.rotate_daily_window). The middle slot is raised because the
  // layout reads better that way, NOT because it is first: these are not
  // ranked 1-2-3 and must not be labelled as if they were, so no medals.
  // The customer podium below keeps its medals — that one really is a rank.
  const medals = ['', '', ''];
  const section = document.createElement('div');
  section.className = 'home-section podium-section';

  const header = document.createElement('div');
  header.className = 'section-header';
  const title = document.createElement('div');
  title.className = 'section-title';
  title.textContent = '🏆 ' + t.sectionBestsellers;
  header.appendChild(title);
  section.appendChild(header);

  const podium = document.createElement('div');
  podium.className = 'podium';
  [1, 0, 2].forEach(rankIdx => {
    const p = top[rankIdx];
    if (!p) return;
    const item = document.createElement('div');
    item.className = 'podium-item rank-' + (rankIdx + 1);

function buildAutoCarousel(products) {
  const section = document.createElement('div');
  section.className = 'home-section';

  const header = document.createElement('div');
  header.className = 'section-header';
  const title = document.createElement('div');
  title.className = 'section-title';
  title.textContent = '🛍 ' + t.sectionAllProducts;
  header.appendChild(title);
  section.appendChild(header);

  // Genuinely scrollable track (native touch/drag works) — the card list is
  // duplicated once so wrapping scrollLeft back by exactly half the width
  // loops seamlessly. A rAF loop drifts scrollLeft at 60px/s; user touch
  // pauses the drift (native scrolling takes over) and it always resumes
  // shortly after — with a hard safety timeout so it can never get stuck.
  const track = document.createElement('div');
  track.className = 'auto-carousel-track';
  [...products, ...products].forEach(p => track.appendChild(createCarouselCard(p)));
  section.appendChild(track);

  // Measured lazily. A language switch from the profile page re-renders home
  // while it is hidden: the track is 0 wide then, and the old one-shot
  // measure left the carousel frozen for good (2026-10-22).
  let halfWidth = 0;
  let paused = false;
  let resumeTimer = null;
  let safetyTimer = null;
  // 60px/s is what Android showed with the old "+0.5px a frame", which
  // Chrome rounds up to a whole pixel. The position is kept as a float:
  // iOS WebKit truncates a fractional scrollLeft, so "+= 0.5" never moved.
  const SPEED = 60;
  let pos = 0;
  let lastT = 0;

  function step(now) {
    if (!track.isConnected) return;  // home was re-rendered — end this loop
    const dt = lastT ? Math.min((now - lastT) / 1000, 0.05) : 0;
    lastT = now;
    if (!paused && track.offsetWidth > 0) {
      if (!halfWidth) halfWidth = track.scrollWidth / 2;
      // The buyer scrolled by hand meanwhile — carry on from there.
      if (Math.abs(track.scrollLeft - pos) > 2) pos = track.scrollLeft;
      pos += SPEED * dt;
      if (pos >= halfWidth) pos -= halfWidth;
      track.scrollLeft = pos;
    }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);

  function scheduleResume() {
    clearTimeout(resumeTimer);
    clearTimeout(safetyTimer);
    resumeTimer = setTimeout(() => { paused = false; }, 1200);
  }
  function pause() {
    paused = true;
    clearTimeout(safetyTimer);
    // Guarantees the carousel never stays frozen even if a release event is missed.
    safetyTimer = setTimeout(() => { paused = false; }, 4000);
  }

  track.addEventListener('pointerdown', pause);
  track.addEventListener('pointerup', scheduleResume);
  track.addEventListener('pointercancel', scheduleResume);
  track.addEventListener('pointerleave', scheduleResume);
  track.addEventListener('touchend', scheduleResume);

  return section;
}

// One piece straight from a card — the same rules and messages as the
// product page's button (addToCart), without opening it.
async function quickAddToCart(p, btn) {
  if (btn.disabled) return;
  btn.disabled = true;
  try {
    const res = await api('/api/cart/add', {
      method: 'POST',
      body: JSON.stringify({ product_id: p.id, quantity: 1 })
    });
    trk(() => Trk.ev('cart_add', 'product', p.id, Trk.from()));
    await loadCart();
    try { tg.HapticFeedback.impactOccurred('light'); } catch (_) {}
    showToast(res && res.partial ? t.addedPartly.replace('{n}', res.added) : t.addedToCart);
    btn.textContent = t.quickAdded;
    btn.classList.add('done');
    setTimeout(() => {
      btn.textContent = t.quickAdd;
      btn.classList.remove('done');
      btn.disabled = false;
    }, 1800);
  } catch (e) {
    console.error('Quick add error:', e);
    const reason = e && e.body && e.body.error;
    const held = reason === 'held' && (e.body.waiting ? t.heldWaiting : t.heldLimit);
    showToast(held || t.errorCart, true);
    btn.disabled = false;
  }
}

function selectCategory(key) {
  currentCat = key;
  currentPage = 0;
  document.querySelectorAll('#categories .cat-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.cat === key);
  });
  // Scroll active tab into view
  const activeTab = document.querySelector('#categories .cat-tab.active');
  if (activeTab) activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  document.getElementById('catalog-search').value = '';
  trk(() => Trk.cat(key));
  loadProducts();
}

let isLoadingMore = false;
// The catalog asks for 30 a page; the bot keeps its own 5 (ITEMS_PER_PAGE).
// Five was far too few here: on a wide screen five tiles fit without any
// scrolling, the scroll that loads the next page never came, and the catalog
// stopped at five products (owner, 2026-10-22: "katalogda hamma
// mahsulotlarni ko'rib bo'lmayapti").
const CATALOG_PAGE_SIZE = 30;
let catalogSeq = 0;      // a newer category, search or language wins

async function loadProducts(append = false) {
  const grid = document.getElementById('product-grid');
  const loading = document.getElementById('catalog-loading');
  const empty = document.getElementById('catalog-empty');
  const scrollLoader = document.getElementById('scroll-loader');

  if (!append) {
    // A fresh list always starts at page 0 — a language switch or a cleared
    // search used to reload only the page the buyer had scrolled to.
    currentPage = 0;
    grid.innerHTML = '';
    loading.style.display = 'block';
    loading.textContent = t.loading;
    empty.style.display = 'none';
  }
  scrollLoader.style.display = 'none';
  isLoadingMore = true;
  const seq = ++catalogSeq;

  try {
    const url = (currentCat === 'all'
      ? '/api/products?page=' + currentPage
      : '/api/products?category=' + currentCat + '&page=' + currentPage) + '&per_page=' + CATALOG_PAGE_SIZE;
    const data = await api(url);
    if (seq !== catalogSeq) return;
    const products = data.products || [];
    totalPages = data.pages || 1;

    loading.style.display = 'none';

    if (!append && products.length === 0) {
      empty.style.display = 'block';
      document.getElementById('catalog-empty-text').textContent = t.empty;
      isLoadingMore = false;
      return;
    }

    products.forEach(p => {
      grid.appendChild(createProductCard(p));
    });

    isLoadingMore = false;
    requestAnimationFrame(catalogLoadMore);
  } catch(e) {
    if (seq !== catalogSeq) return;
    loading.style.display = 'none';
    isLoadingMore = false;
    console.error('Load products error:', e);
    showToast(t.errorLoad, true);
  }
}

// Infinite scroll: the next page when the buyer nears the end — or at once
// when the grid doesn't even fill the screen, since then nothing scrolls.
function catalogLoadMore() {
  if (activePage !== 'catalog' || isLoadingMore) return;
  if (currentPage + 1 >= totalPages) return;

  const scrollY = window.scrollY + window.innerHeight;
  const docHeight = document.documentElement.scrollHeight;

  if (scrollY >= docHeight - 300) {
    currentPage++;
    isLoadingMore = true;
    document.getElementById('scroll-loader').style.display = 'block';
    loadProducts(true);
  }
}
window.addEventListener('scroll', catalogLoadMore);

// Sold out stays in the shop (owner, 2026-10-14): a tilted "Yo'lda 🚚"
