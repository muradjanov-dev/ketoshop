<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Call Centre CRM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ☀️ kunduzgi — asosiy; 🌙 tungi — [data-theme="dark"]. */
:root{
  --bg:#f5f4ef; --card:#ffffff; --ink:#1e221a; --muted:#6c7163; --line:#e8e5dc; --soft:#f0eee6;
  --accent:#4f7a2e; --accent-ink:#ffffff; --accent-soft:#e7f0dc;
  --c-out:#3a78b5; --c-mean:#7457c2; --c-ord:#4f7a2e; --warn:#b86e00; --bad:#c2453d;
  --shadow:0 1px 2px rgba(30,34,26,.05),0 8px 24px rgba(30,34,26,.06);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121410; --card:#1b1e18; --ink:#ecefe6; --muted:#9ba091; --line:#2b2f27; --soft:#23271f;
  --accent:#8dbb5e; --accent-ink:#13160f; --accent-soft:#25301b;
  --c-out:#6fa8e0; --c-mean:#a58ce8; --c-ord:#8dbb5e; --warn:#e6a23c; --bad:#e77a72;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;transition:background .25s,color .25s}
body{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
button{font:inherit;color:inherit}
a{color:var(--accent)}

/* tepa */
.top{display:flex;align-items:center;gap:12px;padding:16px 0 6px}
.ava{width:42px;height:42px;border-radius:14px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:0 0 auto}
.top .t{flex:1;min-width:0}
.top h1{margin:0;font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .d{color:var(--muted);font-size:13px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;flex:0 0 auto}
.opsel{width:100%;margin:6px 0 2px;border:1px solid var(--line);border-radius:12px;padding:9px 10px;
  background:var(--card);color:var(--ink);font:inherit}

.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-top:12px}
.card h3{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}

/* progress */
.prog{display:grid;gap:12px}
.prog .lbl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.prog .lbl b{font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.done-chip{font-size:12px;color:var(--accent);font-weight:700}

/* keyingi qo'ng'iroq */
.next{border:1.5px solid var(--accent-soft)}
.next .who{font-size:19px;font-weight:700;margin:2px 0}
.next .why{color:var(--muted);font-size:13px}
.phone{font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:.3px;text-decoration:none;color:var(--ink)}
.btn{border:0;border-radius:14px;padding:12px 14px;font-weight:600;cursor:pointer;background:var(--soft);color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:46px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:36px;padding:7px 11px;font-size:14px;border-radius:11px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn[disabled]{opacity:.55}
.actions{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:12px}

/* ro'yxat */
.item{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:0}
.item .m{flex:1;min-width:0}
.item .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;width:40px;flex:0 0 auto}
.pill{border-radius:99px;padding:3px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--soft)}
.pill.sold{background:var(--accent-soft);color:var(--accent)}
.pill.followup,.pill.thinking{color:var(--warn)}
.pill.declined{color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:18px 0;font-size:14px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px;margin-top:12px}
.seg button{flex:1;white-space:nowrap;border:0;background:transparent;border-radius:10px;padding:8px 6px;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}

.joke{font-style:italic;white-space:pre-line;font-size:14px}

/* pastki menyu */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr;align-items:center}
.nav button{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;
  font-size:11px;color:var(--muted);padding:5px 0;position:relative}
.nav button .i{font-size:20px;line-height:1.1}
.nav button.on{color:var(--accent);font-weight:700}
.nav .plus{width:58px;height:58px;margin:-26px auto 0;border-radius:20px;background:var(--accent);color:var(--accent-ink);
  font-size:30px;font-weight:400;box-shadow:0 8px 22px rgba(79,122,46,.38);justify-content:center}
.badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:99px;font-size:10px;
  min-width:17px;height:17px;line-height:17px;padding:0 4px;font-weight:700}

/* forma */
.sheet-bg{position:fixed;inset:0;background:rgba(8,10,6,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-radius:22px 22px 0 0;
  max-height:94vh;overflow:auto;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.sheet .in{max-width:640px;margin:0 auto;padding:10px 16px calc(16px + env(safe-area-inset-bottom))}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 8px}
.f-label{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;
  background:var(--card);color:var(--ink);outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:56px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 8px;cursor:pointer;
  font-weight:600;font-size:14px;text-align:center}
.choice button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 12px;cursor:pointer;font-size:14px}
.chips button.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.timer{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 12px;border:1px solid var(--line)}
.timer .clock{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;flex:1}
.timer .go{width:50px;height:50px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:20px;cursor:pointer}
.timer .go.rec{background:var(--bad);color:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(194,69,61,.45)}100%{box-shadow:0 0 0 14px rgba(194,69,61,0)}}
.hint{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:8px;display:none}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.save{position:sticky;bottom:0;padding-top:8px;background:linear-gradient(transparent,var(--bg) 30%)}
.hidden{display:none!important}
details{margin-top:12px}
details summary{cursor:pointer;color:var(--muted);font-size:14px;list-style:none}
details summary::-webkit-details-marker{display:none}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td{padding:8px 0;border-top:1px solid var(--line)}
table.t tr:first-child td{border-top:0}
table.t td:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.big{font-size:30px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.chk{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;display:none;max-width:90vw;box-shadow:var(--shadow)}

/* 🎆 bayram */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.party{position:fixed;inset:0;z-index:55;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(8,10,6,.35)}
.party.show{display:flex}
.pop{background:var(--card);border-radius:24px;max-width:360px;width:100%;padding:24px 20px 18px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.pop .emo{font-size:52px;line-height:1;animation:wig 1.2s ease-in-out infinite}
.pop h2{margin:10px 0 6px;font-size:20px}
.pop p{margin:6px 0;color:var(--muted)}
.pop .moti{color:var(--ink);font-style:italic}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg) scale(1.07)}}
.cert{max-width:400px;width:100%;background:#fffdf6;color:#2b2a22;border-radius:10px;padding:26px 22px;text-align:center;
  border:3px double #c9a240;box-shadow:0 0 0 8px #fffdf6,0 0 0 10px #c9a240,0 24px 70px rgba(0,0,0,.4);animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.cert .ttl{font-family:Georgia,"Times New Roman",serif;font-size:28px;letter-spacing:4px;color:#8a6a12;margin:4px 0}
.cert .name{font-family:Georgia,serif;font-size:24px;font-style:italic;margin:10px 0;border-bottom:1px solid #d9c27a;display:inline-block;padding:0 14px 4px}
.cert .seal{width:66px;height:66px;border-radius:50%;margin:14px auto 0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,#e6c45a,#b88a1c);color:#fff;font-size:28px;box-shadow:0 4px 12px rgba(150,110,20,.5)}
.cert .stats{display:flex;justify-content:center;gap:14px;margin-top:10px;font-size:14px}
.cert small{color:#7c7558}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="ava" id="ava">📞</div>
    <div class="t"><h1 id="hello">Call Centre</h1><div class="d" id="sub">Yuklanmoqda…</div></div>
    <button class="icon-btn" id="theme" aria-label="Rejim">☀️</button>
  </div>
  <div id="opPick"></div>
  <section id="view"></section>
</div>

<nav class="nav"><div class="in">
  <button data-tab="today" class="on"><span class="i">🏠</span>Bugun</button>
  <button data-tab="queue"><span class="i">📋</span>Navbat<span class="badge hidden" id="qBadge"></span></button>
  <button class="plus" id="plus" aria-label="Qo'ng'iroq yozish">＋</button>
  <button data-tab="result"><span class="i">🏆</span>Natija</button>
</div></nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<canvas id="fx"></canvas>
<div class="party" id="party"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }
var AUTH = 'tma ' + ((tg && tg.initData) || '');
var S = { data:null, tab:'today', qseg:'due', operator:null, month:null, leads:null, skip:{}, editing:null,
          form:{}, timerStart:null, timerId:null };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(n){ return Math.round(Number(n)||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function money(n){ return num(n) + " so'm"; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function toast(t){ var el=$('toast'); el.textContent=t; el.style.display='block';
  clearTimeout(toast._t); toast._t=setTimeout(function(){ el.style.display='none'; }, 2400); }
function haptic(k){ try { tg.HapticFeedback.notificationOccurred(k||'success'); } catch(e){} }
function tap(){ try { tg.HapticFeedback.selectionChanged(); } catch(e){} }
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){ return null; } }
function fmtPhone(p){ var m = /^\+998(\d{2})(\d{3})(\d{2})(\d{2})$/.exec(p || '');
  return m ? '+998 ' + m[1] + ' ' + m[2] + ' ' + m[3] + ' ' + m[4] : (p || ''); }
function mmss(sec){ sec = Math.max(0, sec|0); return Math.floor(sec/60) + ':' + ('0' + sec%60).slice(-2); }

/* ☀️ / 🌙 — tanlov eslab qolinadi; birinchi marta Telegram rejimi. */
function applyTheme(mode){
  document.documentElement.setAttribute('data-theme', mode);
  $('theme').textContent = mode === 'dark' ? '🌙' : '☀️';
  $('theme').title = mode === 'dark' ? 'Tungi rejim' : 'Kunduzgi rejim';
  var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch(e){}
}
var theme = store('cc_theme') || ((tg && tg.colorScheme === 'dark') ? 'dark' : 'light');
applyTheme(theme);
$('theme').onclick = function(){ theme = theme === 'dark' ? 'light' : 'dark'; store('cc_theme', theme); applyTheme(theme); tap();
  toast(theme === 'dark' ? '🌙 Tungi rejim' : '☀️ Kunduzgi rejim'); };

function api(path, body, raw){
  var q = [];
  if (!raw && S.operator) q.push('operator=' + S.operator);
  if (!raw && S.month) q.push('month=' + S.month);
  var url = body || raw ? path : path + (q.length ? '?' + q.join('&') : '');
  var opt = { headers:{ 'Authorization': AUTH } };
  if (body) { opt.method='POST'; opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(body); }
  return fetch(url, opt).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if (!r.ok) { var e = new Error(j.error || ('Xato ' + r.status)); e.status = r.status; throw e; }
      return j;
    });
  });
}

function load(){
  return api('/cc/api/dashboard').then(function(d){
    S.data = d; if (!S.operator) S.operator = d.operator; if (!S.month) S.month = d.month.month;
    render();
  }).catch(function(e){
    $('sub').textContent = e.status === 403 ? "Bu bo'lim faqat Call Centre xodimlari uchun."
      : e.status === 401 ? "Botda /callcentre bosib, tugma orqali oching." : e.message;
    document.querySelector('.nav').classList.add('hidden');
  });
}
function loadLeads(){
  return api('/cc/api/leads', null, true).then(function(j){ S.leads = j.leads || []; })
    .catch(function(){ S.leads = []; });
}
function isMe(){ return S.data && S.data.operator === S.data.me.id; }

/* ───────── tepa ───────── */
function renderTop(){
  var d = S.data, name = d.me.first_name || '';
  var h = new Date().getHours();
  var greet = h < 5 ? 'Xayrli tun' : h < 12 ? 'Xayrli tong' : h < 18 ? 'Xayrli kun' : 'Xayrli kech';
  $('ava').textContent = isMe() ? (name ? name[0].toUpperCase() : '📞') : '👁';
  $('hello').textContent = isMe() ? (greet + (name ? ', ' + name : '')) : (d.target_name || 'Operator');
  var dt = new Date(d.today + 'T12:00:00');
  var days = ['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
  $('sub').textContent = days[dt.getDay()] + ', ' + d.today.split('-').reverse().join('.') + (isMe() ? '' : ' · kuzatish rejimi');
  if (d.me.role === 'admin' && !$('opSel')) {
    $('opPick').innerHTML = '<select class="opsel" id="opSel"></select>';
    $('opSel').onchange = function(){ S.operator = Number(this.value); S.leads = null; S.skip = {}; load(); };
  }
  if (d.me.role === 'admin') {
    $('opSel').innerHTML = '<option value="'+d.me.id+'">👑 O\'zim</option>' + (d.operators||[]).map(function(o){
      return '<option value="'+o.id+'">📞 '+esc(o.name)+'</option>'; }).join('');
    $('opSel').value = String(S.operator);
  }
  var due = d.due.length, b = $('qBadge');
  b.textContent = due; b.classList.toggle('hidden', !due);
  $('plus').classList.toggle('hidden', !isMe());
  document.querySelectorAll('.nav [data-tab]').forEach(function(x){ x.classList.toggle('on', x.getAttribute('data-tab') === S.tab); });
}
function render(){ renderTop(); VIEWS[S.tab](); }
document.querySelectorAll('.nav [data-tab]').forEach(function(b){ b.onclick = function(){
  S.tab = b.getAttribute('data-tab'); tap(); render(); window.scrollTo(0,0); }; });

/* ───────── navbat: kimga keyin qo'ng'iroq ───────── */
function queue(){
  var d = S.data, out = [];
  d.due.forEach(function(c){ out.push({key:'f'+c.id, name:c.customer_name, phone:c.phone, product:c.product, followup:c.id,
    why:'📅 Qayta aloqa' + (c.follow_up_on < d.today ? ' · kechikkan' : '') + (c.note ? ' · ' + c.note : '')}); });
  (S.leads||[]).forEach(function(l){ out.push({key:'l'+l.phone, name:l.name, phone:l.phone,
    why:'🛍 ' + l.orders + ' ta xarid · ' + l.days + ' kundan beri olmagan'}); });
  return out;
}
function nextUp(){ var q = queue().filter(function(x){ return !S.skip[x.key]; }); return q[0] || null; }

function startCall(it){
  tap();
  openForm(null, {customer_name:it.name, phone:it.phone, product:it.product, call_type:'out', _done:it.followup, _key:it.key}, true);
  if (it.phone) { try { location.href = 'tel:' + it.phone.replace(/\s/g,''); } catch(e){} }
}
function noAnswer(it){
  tap();
  api('/cc/api/calls', {call_type:'out', status:'no_answer', phone:it.phone, customer_name:it.name, duration_sec:0})
    .then(function(j){ S.skip[it.key] = 1; toast('📵 Yozildi · keyingisi'); afterSave(j, 'no_answer'); })
    .catch(function(e){ toast(e.message); });
}

/* ───────── ko'rinishlar ───────── */
function bars(){
  var d = S.data, s = d.settings, day = d.day;
  return [['📤 Qo\'ng\'iroqlar', day.outbound, s.daily_outbound, 'var(--c-out)'],
          ['💬 Mazmunli suhbatlar', day.meaningful, s.daily_meaningful, 'var(--c-mean)'],
          ['🛒 Buyurtmalar', day.orders, s.daily_orders, 'var(--c-ord)']].map(function(r){
    var p = Math.min(100, r[2] ? r[1] / r[2] * 100 : 0);
    return '<div><div class="lbl"><span>'+r[0]+'</span>' + (r[1] >= r[2] ? '<span class="done-chip">✓ bajarildi · '+r[1]+'</span>' :
      '<b>'+r[1]+' <span class="muted">/ '+r[2]+'</span></b>') + '</div><div class="bar"><i style="width:'+p+'%;background:'+r[3]+'"></i></div></div>';
  }).join('');
}
function callRow(c){
  var st = S.data.statuses[c.status] || c.status;
  var sub = [c.call_type === 'in' ? 'kiruvchi' : null, c.duration_sec ? mmss(c.duration_sec) : null,

function setStatus(k){
  S.form.status = k;
  document.querySelectorAll('[data-st]').forEach(function(x){ x.classList.toggle('on', x.getAttribute('data-st') === k); });
  $('soldBox').classList.toggle('hidden', k !== 'sold');
  $('folBox').classList.toggle('hidden', !(k === 'followup' || k === 'thinking'));
  $('prodBox').classList.toggle('hidden', k === 'no_answer');
  $('durBox').classList.toggle('hidden', k === 'no_answer');
  if (k === 'no_answer') { stopTimer(); setDur(0); }
  if ((k === 'followup' || k === 'thinking') && !$('fFol').value) { $('fFol').value = plusDays(1); markFol(); }
}
function markFol(){
  var v = $('fFol').value;
  document.querySelectorAll('[data-f]').forEach(function(b){ b.classList.toggle('on', plusDays(Number(b.getAttribute('data-f'))) === v); });
}
function setDur(sec){
  S.form.duration_sec = sec; $('fClock').textContent = mmss(sec);
  document.querySelectorAll('[data-d]').forEach(function(b){ b.classList.toggle('on', Number(b.getAttribute('data-d')) === sec); });
  $('meanBox').classList.toggle('hidden', sec < 30);
}
function startTimer(){
  S.timerStart = Date.now() - (S.form.duration_sec || 0) * 1000;
  $('fGo').textContent = '⏹'; $('fGo').classList.add('rec');
  S.timerId = setInterval(function(){
    var sec = Math.floor((Date.now() - S.timerStart) / 1000);
    if (sec === 30) { haptic('success'); toast('💬 30 soniya — mazmunli suhbat!'); }
    setDur(sec);
  }, 500);
}
function stopTimer(){ if (S.timerId) { clearInterval(S.timerId); S.timerId = null; }
  var g = $('fGo'); if (g) { g.textContent = '▶'; g.classList.remove('rec'); } }

    var h = $('fHint'); if (!h || !j.phone) return;
    if (j.name && $('fName') && !$('fName').value) $('fName').value = j.name;
    var bits = [j.orders ? '🛍 ' + j.orders + ' ta xarid · ' + money(j.spent) + (j.last_order ? ' · oxirgisi ' + j.last_order.split('-').reverse().join('.') : '')
                         : '🆕 Hali xarid qilmagan'];
    if (j.top_products && j.top_products.length) bits.push('❤️ ' + j.top_products.map(esc).join(', '));
    (j.calls || []).slice(0, 2).forEach(function(c){ bits.push('📞 ' + esc(c.at.slice(5,10).split('-').reverse().join('.')) + ' · ' +
      esc((S.data.statuses[c.status] || c.status)) + (c.note ? ' — ' + esc(c.note) : '')); });
    h.innerHTML = bits.join('<br>'); h.style.display = 'block';
  }).catch(function(){});
}
function orderInfo(){
  var id = ($('fOrd').value || '').replace(/\D/g, ''); if (!id) { $('fOrdInfo').textContent = ''; return; }
  api('/cc/api/order/' + id, null, true).then(function(o){
    $('fOrdInfo').textContent = '#' + o.id + ' · ' + (o.customer_name || '') + ' · ' + money(o.total) +
      (o.operator && o.operator !== S.data.operator ? ' · ⚠️ boshqa operatorga biriktirilgan' : '');
    if (!$('fAmt').value) $('fAmt').value = Math.round(o.total || 0);
  }).catch(function(e){ $('fOrdInfo').textContent = '⚠️ ' + e.message; });
}
function saveForm(){
  stopTimer();
  var f = S.form;
  if (!f.status) { $('fErr').textContent = 'Natijani tanlang'; return; }
  var body = { call_type:f.call_type, status:f.status, phone:$('fPhone').value, customer_name:$('fName').value,
    duration_sec:f.duration_sec || 0, meaningful:$('fMean').checked, product:$('fProd').value,
    order_amount:f.status === 'sold' ? $('fAmt').value : '', order_id:f.status === 'sold' ? $('fOrd').value : '',
    follow_up_on:(f.status === 'followup' || f.status === 'thinking') ? $('fFol').value : '', note:$('fNote').value };
  $('fSave').disabled = true;
  api(S.editing ? '/cc/api/calls/' + S.editing : '/cc/api/calls', body).then(function(j){
    // Qayta aloqa bajarildi — mijoz javob bergan bo'lsa (ko'tarmasa navbatda qoladi).
    var done = f._done && f.status !== 'no_answer' ? api('/cc/api/followups/' + f._done + '/done', {}) : Promise.resolve();
    if (f._key) S.skip[f._key] = 1;
    return done.then(function(){ closeSheet(); toast('✅ Saqlandi'); afterSave(j, f.status); });
  }).catch(function(e){ $('fErr').textContent = e.message; var b = $('fSave'); if (b) b.disabled = false; });
}
function afterSave(j, status){
  if (j.celebrate && j.celebrate.length) celebrate(j.celebrate);
  else if (status === 'sold') { haptic(); fireworks(1400); }
  S.leads = null;
  load();
}
function openReport(){
  var d = S.data, s = d.settings, r = d.report;
  openSheet('<b style="font-size:17px">📝 Kun yakuni</b><table class="t" style="margin-top:10px">' +
    '<tr><td>📤 Qo\'ng\'iroqlar</td><td>'+d.day.outbound+' / '+s.daily_outbound+'</td></tr>' +
    '<tr><td>💬 Mazmunli</td><td>'+d.day.meaningful+' / '+s.daily_meaningful+'</td></tr>' +
    '<tr><td>🛒 Buyurtmalar</td><td>'+d.day.orders+' / '+s.daily_orders+'</td></tr>' +
    '<tr><td>📥 Kiruvchi</td><td>'+d.day.inbound+'</td></tr><tr><td>📅 Qayta aloqaga</td><td>'+d.day.followups+'</td></tr>' +
    '<tr><td>💰 Sotuv</td><td>'+money(d.day.sales)+'</td></tr></table>' +
    '<div class="f-label">Bugun nimani o\'rgandingiz?</div><input id="rLearn" maxlength="500" placeholder="Masalan: alluloza va eritritol farqi" value="'+esc(r && r.learned || '')+'">' +
    '<div class="f-label">Muammolar va izohlar</div><textarea id="rProb" maxlength="1500">'+esc(r && r.problems || '')+'</textarea>' +
    '<div class="err" id="rErr"></div><div class="save"><button class="btn primary" id="rSend" style="width:100%">'+(r ? 'Yangilash' : 'Yuborish')+'</button></div>');
  $('rSend').onclick = function(){
    api('/cc/api/report', {learned:$('rLearn').value, problems:$('rProb').value}).then(function(){
      closeSheet(); haptic();
      showParty({emo:'🌙', title:'Hisobot yuborildi!', text:pick(S.data.fun.thanks), moti:pick(S.data.fun.motivation)}, false);
      load(); }).catch(function(e){ $('rErr').textContent = e.message; });
  };
}
$('plus').onclick = function(){ tap(); openForm(null); };

/* ───────── 🎆 salyut, tabrik, tashakkurnoma ───────── */
var fx = $('fx'), ctx = fx.getContext('2d'), parts = [], raf = null, fxUntil = 0;
var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function sizeFx(){ fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; }
addEventListener('resize', sizeFx); sizeFx();
var COLORS = ['#ffd54a','#ff7a59','#7bd389','#5ab0ff','#c08bff','#ff5fa2','#ffffff'];
function burst(x, y){
  var n = 70, col = pick(COLORS);
  for (var i = 0; i < n; i++){ var a = Math.PI*2*i/n, v = 2 + Math.random()*4.5;
    parts.push({x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:1, c:Math.random() < .3 ? pick(COLORS) : col, s:2 + Math.random()*2.5}); }
}
function confetti(){
  for (var i = 0; i < 90; i++) parts.push({x:Math.random()*innerWidth, y:-20 - Math.random()*200, vx:(Math.random()-.5)*2,
    vy:2 + Math.random()*3, life:1.6, c:pick(COLORS), s:4 + Math.random()*4, rect:true, r:Math.random()*6});
}
function tick(){
  var dpr = devicePixelRatio; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,innerWidth,innerHeight);
  if (Date.now() < fxUntil && Math.random() < .09) burst(innerWidth*(.15 + Math.random()*.7), innerHeight*(.12 + Math.random()*.35));
  parts = parts.filter(function(p){ return p.life > 0; });
  parts.forEach(function(p){
    p.x += p.vx; p.y += p.vy; p.vy += p.rect ? .02 : .06; p.vx *= .985; p.life -= p.rect ? .006 : .014;
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life)); ctx.fillStyle = p.c;
    if (p.rect) { p.r += .1; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); ctx.restore(); }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 7); ctx.fill(); }
  });
  ctx.globalAlpha = 1;
  if (parts.length || Date.now() < fxUntil) raf = requestAnimationFrame(tick); else { raf = null; ctx.clearRect(0,0,innerWidth,innerHeight); }
}
function fireworks(ms){
  if (REDUCED) return;
  fxUntil = Date.now() + ms; burst(innerWidth/2, innerHeight/3); if (ms > 2000) confetti();
  if (!raf) raf = requestAnimationFrame(tick);
}
var partyQ = [];
function showParty(o, big){
  var el = $('party');
  el.innerHTML = '<div class="pop"><div class="emo">'+o.emo+'</div><h2>'+esc(o.title)+'</h2><p>'+esc(o.text)+'</p>' +
    (o.moti ? '<p class="moti">'+esc(o.moti)+'</p>' : '') + (o.joke ? '<p style="white-space:pre-line;font-size:13px">😄 '+esc(o.joke)+'</p>' : '') +
    '<button class="btn primary" id="pOk" style="margin-top:10px;width:100%">'+pick(['Rahmat! 🙌','Davom etamiz 🚀','Zo\'r! 💪'])+'</button></div>';
  el.classList.add('show'); fireworks(big ? 3500 : 1600); haptic('success');
  $('pOk').onclick = nextParty;
  clearTimeout(showParty._t); showParty._t = setTimeout(nextParty, big ? 9000 : 5000);
}
function nextParty(){ clearTimeout(showParty._t); $('party').classList.remove('show'); var n = partyQ.shift(); if (n) setTimeout(n, 250); }
function showCertificate(){
  var d = S.data, el = $('party'), day = d.day, s = d.settings;
  el.innerHTML = '<div class="cert"><div style="font-size:12px;letter-spacing:3px;color:#8a6a12">KETO SHOP · CALL CENTRE</div>' +
    '<div class="ttl">TASHAKKURNOMA</div><div>ushbu tashakkurnoma</div><div class="name">'+esc(d.me.first_name || 'Operator')+'</div>' +
    '<div>ga topshiriladi</div><p style="margin:12px 0 6px">'+esc(pick(d.fun.thanks))+'</p>' +
    '<div class="stats"><span>📤 '+day.outbound+'/'+s.daily_outbound+'</span><span>💬 '+day.meaningful+'/'+s.daily_meaningful+'</span><span>🛒 '+day.orders+'/'+s.daily_orders+'</span></div>' +
    '<div class="seal">🏅</div><small>'+esc(d.today.split('-').reverse().join('.'))+' · Sifatli xizmat. To\'g\'ri maslahat. Barqaror savdo.</small>' +
    '<button class="btn primary" id="pOk" style="margin-top:14px;width:100%">🙏 Qabul qildim</button></div>';
  el.classList.add('show'); fireworks(6000); haptic('success');
  $('pOk').onclick = nextParty; clearTimeout(showParty._t);
}
function celebrate(list){
  var F = S.data.fun;
  list.forEach(function(c){
    if (c.kind === 'certificate') { partyQ.push(showCertificate); return; }
    var txt, emo, title, big = false;
    if (c.kind === 'small') { emo = pick(['🎉','✨','🔥','🌟','👏']); title = 'Kichik g\'alaba!';
      txt = pick(F.small[c.metric]).replace('{n}', c.value) + ' Rejagacha ' + (c.goal - c.value) + ' ta qoldi.'; }
    else if (c.kind === 'goal') { emo = '🎯'; title = 'Reja bajarildi!'; big = true; txt = F.goal[c.metric].replace('{n}', c.value); }
    else { emo = '🏆'; title = 'Rekord!'; big = true; txt = pick(F.record).replace('{n}', c.value); }
    partyQ.push(function(){ showParty({emo:emo, title:title, text:txt, moti:pick(F.motivation), joke:big ? pick(F.jokes) : null}, big); });
  });
  var first = partyQ.shift(); if (first) first();
}

load();
})();
</script>
